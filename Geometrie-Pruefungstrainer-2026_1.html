<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometrie 2026 – Prüfungstrainer · Dr. Koksch · TU Dresden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFAF6;--paper-2:#F3F1E9;--grid:#E5E1D4;--grid-strong:#D8D2C0;
  --ink:#1B2436;--ink-soft:#4C566B;--ink-faint:#828C9E;
  --blue:#2C6079;--blue-deep:#1E4356;--red:#B23B2E;--green:#3F7357;--amber:#B7822A;
  --card:#FFFFFF;--shadow:0 1px 2px rgba(27,36,54,.06),0 8px 24px rgba(27,36,54,.06);--radius:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;-webkit-font-smoothing:antialiased;}
.app{display:grid;grid-template-columns:330px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(180deg,#20344A,#1B2436);color:#E8ECF3;border-right:1px solid #16202f;}
.brand{padding:22px 22px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .compass{display:flex;align-items:center;gap:12px}
.brand h1{font-family:'Space Grotesk';font-size:17px;font-weight:600;margin:0;line-height:1.2;letter-spacing:.2px}
.brand .sub{font-family:'JetBrains Mono';font-size:11px;color:#8FA4BC;margin-top:4px;letter-spacing:.3px}
.brand .scope{font-family:'JetBrains Mono';font-size:10.5px;color:#7C93B0;margin-top:9px;line-height:1.5;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:8px;padding:8px 10px}
.progwrap{margin-top:14px}
.progbar{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.progfill{height:100%;width:0;background:linear-gradient(90deg,#5EA37F,#3F7357);transition:width .4s}
.progtxt{font-family:'JetBrains Mono';font-size:11px;color:#8FA4BC;margin-top:7px;display:flex;justify-content:space-between}
.searchbox{padding:14px 16px 8px}
.searchbox input{width:100%;padding:9px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.06);color:#E8ECF3;font-family:'Inter';font-size:13px;outline:none;}
.searchbox input::placeholder{color:#7D90A8}
.searchbox input:focus{border-color:#4E82A0;background:rgba(255,255,255,.10)}
nav{padding:6px 10px 30px}
.navgroup{font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:#6F84A0;padding:16px 12px 6px}
.navitem{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;cursor:pointer;color:#C9D3E1;font-size:13.5px;line-height:1.3;transition:background .15s,color .15s;position:relative;}
.navitem:hover{background:rgba(255,255,255,.06);color:#fff}
.navitem.active{background:rgba(78,130,160,.22);color:#fff}
.navitem.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:#5EA0C4}
.navnum{font-family:'JetBrains Mono';font-size:12px;font-weight:500;color:#7E93AE;min-width:22px;text-align:right}
.navitem.active .navnum{color:#9CC6DE}
.navcheck{margin-left:auto;width:16px;height:16px;border-radius:5px;border:1.5px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;flex:none;font-size:11px}
.navitem.done .navcheck{background:var(--green);border-color:var(--green);color:#fff}
.navitem.done .navtitle{color:#8FB8A2}
.navtitle{flex:1}
.navitem.hidden{display:none}
main{padding:0}
.topic{max-width:900px;margin:0 auto;padding:38px 44px 90px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.thead{display:flex;align-items:flex-start;gap:18px;margin-bottom:6px}
.tnum{font-family:'JetBrains Mono';font-weight:600;font-size:15px;color:#fff;background:var(--blue);width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--shadow)}
.thead h2{font-family:'Space Grotesk';font-size:27px;font-weight:600;margin:0;line-height:1.15;letter-spacing:-.2px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px 64px}
.tag{font-family:'JetBrains Mono';font-size:11px;padding:4px 10px;border-radius:20px;letter-spacing:.2px;background:var(--paper-2);color:var(--ink-soft);border:1px solid var(--grid-strong)}
.tag.chap{background:#EAF1F4;color:var(--blue-deep);border-color:#CFE0E7}
.tag.scope-breit{background:#F5ECDD;color:#8A6216;border-color:#E7D6B4}
.tag.scope-eng{background:#EAF1EC;color:#3F7357;border-color:#CFE3D5}
.tag.scope-mittel{background:#EFEEF6;color:#5B5387;border-color:#DBD8EC}
.tag.school{background:#FBEAE7;color:#A5372B;border-color:#F0CEC8}
.doneBtn{margin:16px 0 0 64px;font-family:'Inter';font-size:13px;font-weight:500;cursor:pointer;padding:8px 16px;border-radius:9px;border:1.5px solid var(--grid-strong);background:var(--card);color:var(--ink-soft);display:inline-flex;align-items:center;gap:8px;transition:all .15s}
.doneBtn:hover{border-color:var(--blue);color:var(--blue)}
.doneBtn.on{background:var(--green);border-color:var(--green);color:#fff}
.block{margin-top:26px}
.block > h3{font-family:'Space Grotesk';font-size:13px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;color:var(--blue);margin:0 0 12px;display:flex;align-items:center;gap:9px}
.block > h3::before{content:"";width:16px;height:2px;background:var(--blue);border-radius:2px}
.lead{font-size:15.5px;line-height:1.7;color:var(--ink-soft)}
.lead strong{color:var(--ink);font-weight:600}
.entry{background:var(--card);border:1px solid var(--grid-strong);border-radius:var(--radius);padding:15px 18px;margin-bottom:11px;box-shadow:var(--shadow)}
.entry .lbl{font-family:'JetBrains Mono';font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:2px 8px;border-radius:6px;margin-right:9px;vertical-align:2px}
.lbl.def{background:#EAF1F4;color:var(--blue-deep)}
.lbl.ax{background:#FBEAE7;color:var(--red)}
.lbl.satz{background:#F1ECF7;color:#5B4E86}
.entry .name{font-weight:600;color:var(--ink);font-size:15px}
.entry .body{font-size:14.5px;line-height:1.65;color:var(--ink-soft);margin-top:7px}
.entry .body.inline{display:inline;margin-top:0}
details.idea{margin-top:9px;border-top:1px dashed var(--grid-strong);padding-top:9px}
details.idea summary{font-family:'JetBrains Mono';font-size:12px;color:var(--blue);cursor:pointer;list-style:none;display:flex;align-items:center;gap:7px;user-select:none;font-weight:500}
details.idea summary::-webkit-details-marker{display:none}
details.idea summary::before{content:"▸";transition:transform .2s;font-size:11px}
details.idea[open] summary::before{transform:rotate(90deg)}
details.idea .ideabody{font-size:13.5px;line-height:1.6;color:var(--ink-soft);margin-top:9px;padding:11px 13px;background:var(--paper-2);border-radius:9px;border-left:3px solid var(--blue)}
.sketch{background:var(--card);border:1px solid var(--grid-strong);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);text-align:center}
.sketch svg{max-width:100%;height:auto}
.sketch .cap{font-family:'JetBrains Mono';font-size:11.5px;color:var(--ink-faint);margin-top:10px;letter-spacing:.2px}
.s-grid{stroke:var(--grid);stroke-width:1}
.s-line{stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.s-con{stroke:var(--blue);stroke-width:1.6;fill:none;stroke-dasharray:5 4;stroke-linecap:round}
.s-res{stroke:var(--red);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.s-fill{fill:rgba(44,96,121,.10);stroke:var(--blue);stroke-width:1.6}
.s-pt{fill:var(--ink)}
.s-pt-r{fill:var(--red)}
.s-lbl{font-family:'JetBrains Mono';font-size:14px;fill:var(--ink)}
.s-lbl-b{font-family:'JetBrains Mono';font-size:13px;fill:var(--blue)}
.s-lbl-r{font-family:'JetBrains Mono';font-size:13px;fill:var(--red)}
.karte{background:linear-gradient(#fff,#fff) padding-box,repeating-linear-gradient(180deg,transparent,transparent 27px,#EDEAE0 27px,#EDEAE0 28px) padding-box;border:1px solid #E4DFCF;border-left:5px solid var(--red);border-radius:12px;padding:18px 20px 20px;box-shadow:var(--shadow);position:relative}
.karte::after{content:"KARTEIKARTE";position:absolute;top:12px;right:16px;font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:2px;color:#C9C2AE}
.karte h4{font-family:'Space Grotesk';font-size:14px;margin:0 0 12px;color:var(--red);letter-spacing:.3px}
.karte ul{margin:0;padding-left:20px}
.karte li{font-size:14px;line-height:1.75;color:var(--ink);margin-bottom:3px}
.karte li strong{color:var(--blue-deep)}
.nachfr .q{background:var(--paper-2);border:1px solid var(--grid-strong);border-radius:10px;padding:11px 14px;margin-bottom:8px;font-size:14px;line-height:1.55;color:var(--ink-soft);display:flex;gap:11px;align-items:flex-start}
.nachfr .q::before{content:"?";font-family:'Space Grotesk';font-weight:700;color:var(--amber);background:#F7EFD9;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.qa{margin-bottom:16px}
details.answer{margin-top:0;border-top:none;padding-top:8px;margin-left:33px}
details.answer summary{color:var(--green);font-weight:500}
details.answer summary::before{color:var(--green)}
details.answer .ideabody{border-left-color:var(--green);background:#F1F6F1;color:var(--ink-soft)}
.plainbox{background:linear-gradient(180deg,#F3F7F2,#EDF3EC);border:1px solid #D3E2CF;border-radius:14px;padding:4px 6px;box-shadow:var(--shadow)}
.plainrow{padding:12px 14px;border-bottom:1px dashed #D3E2CF}
.plainrow:last-child{border-bottom:none}
.plainrow .pt{font-family:'Space Grotesk';font-weight:600;font-size:14.5px;color:#2F5A44}
.plainrow .pe{font-size:14px;line-height:1.6;color:#3A473F;margin-top:3px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.linkchip{font-family:'JetBrains Mono';font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;background:#EAF1F4;color:var(--blue-deep);border:1px solid #CFE0E7;transition:all .15s}
.linkchip:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.foot{margin:40px 0 0 64px;padding-top:18px;border-top:1px solid var(--grid-strong);display:flex;justify-content:space-between;gap:14px}
.navbtn{font-family:'Inter';font-size:13.5px;font-weight:500;cursor:pointer;padding:11px 18px;border-radius:10px;border:1.5px solid var(--grid-strong);background:var(--card);color:var(--ink-soft);transition:all .15s;display:inline-flex;align-items:center;gap:9px;box-shadow:var(--shadow)}
.navbtn:hover{border-color:var(--blue);color:var(--blue)}
.navbtn .dir{font-family:'JetBrains Mono';font-size:11px;color:var(--ink-faint);display:block;text-align:left}
.navbtn.next .dir{text-align:right}
kbd{font-family:'JetBrains Mono';font-size:11px;background:var(--paper-2);border:1px solid var(--grid-strong);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--ink-soft)}
.hint{font-family:'JetBrains Mono';font-size:11px;color:var(--ink-faint);text-align:center;margin:24px 0 0}
m{font-family:'JetBrains Mono';font-size:.93em;font-style:normal;color:var(--ink)}
@media(max-width:880px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;z-index:40;width:300px;transform:translateX(-100%);transition:transform .3s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .sidebar.open{transform:none}
  .topic{padding:76px 20px 80px}
  .meta,.doneBtn,.foot{margin-left:0}
  .thead h2{font-size:22px}
  .menuBtn{display:flex}
  .scrim{position:fixed;inset:0;background:rgba(15,22,34,.5);z-index:35;opacity:0;pointer-events:none;transition:opacity .3s}
  .scrim.on{opacity:1;pointer-events:auto}
}
.menuBtn{display:none;position:fixed;top:14px;left:14px;z-index:45;width:44px;height:44px;border-radius:11px;background:var(--blue);color:#fff;border:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow)}
.navitem.special{color:#E7D9B8}
.navitem.special .navnum{color:#C7A85E}
.navitem.special.active{background:rgba(183,130,42,.24)}
.navitem.special.active::before{background:#D9B871}
.gb-group{margin-top:30px}
.gb-group:first-of-type{margin-top:8px}
.gb-gh{font-family:'Space Grotesk';font-size:17px;font-weight:600;color:var(--blue-deep);margin:0 0 4px;display:flex;align-items:baseline;gap:11px}
.gb-gh .gn{font-family:'JetBrains Mono';font-size:13px;color:#fff;background:var(--blue);width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-weight:600}
.gb-intro{font-size:14px;line-height:1.6;color:var(--ink-faint);margin:0 0 14px 37px;font-style:italic}
.gb-card{background:var(--card);border:1px solid var(--grid-strong);border-radius:var(--radius);padding:14px 17px;margin-bottom:10px;box-shadow:var(--shadow)}
.gb-t{font-family:'Space Grotesk';font-weight:600;font-size:15.5px;color:var(--ink);margin-bottom:8px}
.gb-f{font-size:13.5px;line-height:1.6;color:var(--ink-soft);padding:9px 12px;background:var(--paper-2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;margin-bottom:8px}
.gb-f::before{content:"formal";font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--blue);display:block;margin-bottom:3px}
.gb-e{font-size:14px;line-height:1.62;color:#3A473F;padding:9px 12px;background:linear-gradient(180deg,#F3F7F2,#EDF3EC);border-left:3px solid var(--green);border-radius:0 8px 8px 0}
.gb-e::before{content:"in einfachen Worten";font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--green);display:block;margin-bottom:3px}
.gb-flow{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:14px 0 4px 0;padding:14px 16px;background:var(--card);border:1px dashed var(--grid-strong);border-radius:var(--radius)}
.gb-flow .ax{font-family:'JetBrains Mono';font-size:12px;font-weight:600;padding:5px 11px;border-radius:8px;background:#FBEAE7;color:var(--red);border:1px solid #F0CEC8}
.gb-flow .ar{color:var(--ink-faint);font-size:13px}
</style>
</head>
<body>
<button class="menuBtn" id="menuBtn" aria-label="Menü">☰</button>
<div class="scrim" id="scrim"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="compass">
        <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
          <circle cx="17" cy="17" r="15.5" stroke="#5EA0C4" stroke-width="1.4"/>
          <path d="M17 6 L11 26 M17 6 L23 26" stroke="#E8ECF3" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="17" cy="6" r="2" fill="#5EA0C4"/>
          <path d="M11 26 A9 9 0 0 0 23 26" stroke="#B23B2E" stroke-width="1.6" fill="none"/>
        </svg>
        <div><h1>Geometrie-Trainer</h1><div class="sub">Skript 2026 · Dr. Koksch · TUD</div></div>
      </div>
      <div class="scope">Auswahl: 14 Themen (6–10, 13, 14, 17–23).<br>Nummerierung wie auf den Karteikarten.</div>

<script>
/* =========================================================================
   INHALTE — gegründet auf „Elementargeometrie" (N. Koksch, TU Dresden, 2026)
   Terminologie des 26er-Skripts: Kongruenzabbildung / Gruppe Kongr(P);
   Kongruenzsatz Ssw; Sätze mit Skript-Nummern. m = Formel/Symbol.
   Ausgewählte Themen: 6,7,8,9,10,13,14,17,18,19,20,21,22,23.
   ========================================================================= */
const TOPICS = [
/* ============================== THEMA 6 ============================== */
{
 id:6, chapter:"Kap. 4.2", scope:"eng", school:false,
 title:"Dreiecke und Winkel",
 subs:["Eckpunkte, Seiten, Inneres","Satz von Pasch, Ecktransversalensatz","Dreieckseinzigkeitssatz"],
 overview:"Enges Thema rund ums Dreieck als Grundobjekt. Der <strong>Satz von Pasch</strong> (Satz 4.2.4) ist das Anordnungs-Herzstück; der <strong>Dreieckseinzigkeitssatz</strong> (Satz 4.2.6) ist das Werkzeug für viele spätere Beweise – insbesondere die Kongruenzsätze.",
 defs:[
  {t:"Dreieck",b:"Drei nicht-kollineare Punkte <m>A,B,C</m>; Seiten <m>AB,BC,CA</m>; Rand <m>∂(ABC)</m>. Das <strong>Innere</strong> <m>int(ABC)</m> ist der Durchschnitt dreier Halbebenen (je die Seite, die die dritte Ecke enthält) ⇒ konvex."},
  {t:"Ecktransversale",b:"Halbgerade von einer Ecke ins Innere des Dreiecks. Der <strong>Ecktransversalensatz</strong> (Satz 4.2.5) sichert genau einen Schnittpunkt mit der Gegenseite."}
 ],
 plain:[
  {t:"Satz von Pasch",e:"Anschaulich: Wer als gerade Linie in ein Dreieck hineinläuft (durch eine Seite, nicht durch eine Ecke), muss es auch wieder verlassen – und zwar durch genau eine der anderen zwei Seiten."},
  {t:"Dreieckseinzigkeitssatz",e:"Kennt man die Abstände eines Punktes zu zwei festen Punkten und weiß, auf welcher Seite er liegt, ist der Punkt eindeutig festgelegt – zwei Kreise schneiden sich pro Seite nur einmal."}
 ],
 theorems:[
  {n:"Satz von Pasch (4.2.4)",s:"Eine Gerade <m>g</m>, die keine Ecke des Dreiecks enthält und eine Seite im Inneren schneidet, schneidet <strong>genau eine</strong> weitere Seite.",idea:"<m>g</m> zerlegt die Ebene in zwei Halbebenen (Axiom HE). Trifft <m>g</m> die Seite <m>AB</m>, so liegen <m>A,B</m> verschieden zu <m>g</m>. Die Ecke <m>C</m> liegt auf einer Seite, o. B. d. A. bei <m>A</m> ⇒ <m>g</m> schneidet <m>CB</m> (HE.3), aber nicht <m>CA</m>."},
  {n:"Ecktransversalensatz (4.2.5)",s:"Eine von einer Ecke ausgehende Halbgerade ins Innere schneidet die gegenüberliegende Seite in genau einem Punkt.",idea:"Anwendung von Pasch/HE auf die Trägergerade der Transversalen; die Innenlage sichert Existenz und Eindeutigkeit des Schnittpunkts."},
  {n:"Dreieckseinzigkeitssatz (4.2.6)",s:"Stimmen zwei Punkte <m>C,C'</m> in ihren Abständen zu <m>A</m> und <m>B</m> überein und liegen in derselben Halbebene bezüglich <m>AB</m>, so ist <m>C=C'</m>.",idea:"Zwei Kreise (um <m>A</m>, um <m>B</m>) treffen jede Halbebene in höchstens einem Punkt. Zentrales Werkzeug in den Beweisen von sss und sws."}
 ],
 sketch:{svg:`<svg viewBox="0 0 320 200" width="340">
   <polygon points="60,170 260,170 150,40" class="s-line"/>
   <circle cx="60" cy="170" r="4" class="s-pt"/><circle cx="260" cy="170" r="4" class="s-pt"/><circle cx="150" cy="40" r="4" class="s-pt"/>
   <text x="46" y="186" class="s-lbl">A</text><text x="264" y="186" class="s-lbl">B</text><text x="143" y="32" class="s-lbl">C</text>
   <line x1="30" y1="120" x2="300" y2="95" class="s-res"/>
   <circle cx="102" cy="116" r="3.5" class="s-pt-r"/><circle cx="205" cy="107" r="3.5" class="s-pt-r"/>
   <text x="300" y="92" class="s-lbl-r">g</text>
   <text x="150" y="196" text-anchor="middle" class="s-lbl-b">g trifft AC und BC — genau zwei Seiten</text>
 </svg>`,cap:"Satz von Pasch: eine „eintretende\u201c Gerade verlässt das Dreieck über genau eine weitere Seite."},
 focus:[
  "Pasch als <strong>Anordnungssatz</strong> präsentieren und über das Halbebenenaxiom (HE) beweisen.",
  "Betonen: Dreieckseinzigkeitssatz 4.2.6 ist der <strong>Motor</strong> hinter sss und sws.",
  "Inneres des Dreiecks = Durchschnitt dreier Halbebenen ⇒ konvex.",
  "Verbindung zu Thema 3 (Halbebenen) und Thema 8 (Kongruenz) herstellen."
 ],
 nachfr:[
  {q:"Beweisen Sie den Satz von Pasch mit dem Halbebenenaxiom.",a:"Sei <m>g</m> ohne Ecke von <m>ABC</m> und schneide die Seite <m>AB</m> innen. Dann liegen <m>A,B</m> in verschiedenen Halbebenen bezüglich <m>g</m>. Die Ecke <m>C</m> liegt in einer davon, o. B. d. A. auf der Seite von <m>A</m>. Dann liegen <m>C,B</m> verschieden zu <m>g</m> ⇒ <m>g</m> schneidet <m>CB</m> nach (HE.3); <m>C,A</m> liegen gleich ⇒ <m>g</m> schneidet <m>CA</m> nicht. Also trifft <m>g</m> genau eine weitere Seite."},
  {q:"Wozu braucht man den Dreieckseinzigkeitssatz später?",a:"Er sichert, dass ein Punkt durch seine Abstände zu zwei festen Punkten und die Wahl der Halbebene eindeutig bestimmt ist. Genau das wird in den Beweisen von sss (5.5.4) und sws (5.5.5) gebraucht: Nachdem eine Kongruenzabbildung zwei Ecken passend abbildet, erzwingt Satz 4.2.6, dass auch die dritte Ecke auf ihren Bildpunkt fällt."},
  {q:"Warum ist das Dreiecksinnere konvex?",a:"Das Innere ist der Durchschnitt dreier Halbebenen (zu jeder Seite die Halbebene mit der gegenüberliegenden Ecke). Jede Halbebene ist konvex, und der Durchschnitt konvexer Mengen ist konvex – also ist <m>int(ABC)</m> konvex."}
 ],
 links:[7,8]
},
/* ============================== THEMA 7 ============================== */
{
 id:7, chapter:"Kap. 5.1, 5.3", scope:"mittel", school:false,
 title:"Bewegungen",
 subs:["Gruppe der Bewegungen","Invarianzeigenschaften","Existenz und Eindeutigkeit (Fahnensatz und benachbarte Aussagen)"],
 overview:"Zentrales Thema. Im 26er-Skript heißen sie <strong>Kongruenzabbildungen</strong> (Def. 5.1.5: „Kongruenzabbildung, Bewegung oder Isometrie\u201c) – abstandstreue, bijektive Abbildungen von <m>P</m>. Sie bilden die Gruppe <m>(Kongr(P),∘,id)</m>, erhalten alle Grundstrukturen und sind durch das Bild einer <strong>Fahne</strong> eindeutig bestimmt.",
 defs:[
  {t:"Kongruenzabbildung (5.1.5)",b:"Abbildung <m>φ:P→P</m>, die <strong>abstandstreu</strong> und <strong>rechtstotal</strong> (surjektiv) ist – gleichbedeutend Bewegung/Isometrie. Menge <m>Kongr(P)</m>."},
  {t:"Gruppe (Kongr(P),∘,id) (5.1.9)",b:"Untergruppe der symmetrischen Gruppe <m>(S(P),∘,id)</m>: abgeschlossen unter Verkettung (Lemma 5.1.8), mit <m>id</m> und Inversen."},
  {t:"Fahne (5.3.8)",b:"<m>F=p∪H</m> aus Halbgerade <m>p</m> (Fahnenmast) und Halbebene <m>H</m> (Fahnentuch) mit <m>TG(p)</m> als Randgerade von <m>H</m>."}
 ],
 plain:[
  {t:"Kongruenzabbildung / Bewegung",e:"Ein starres Verschieben, Drehen oder Spiegeln der ganzen Ebene, bei dem sich keine Abstände ändern – als würde man eine Folie bewegen, ohne sie zu dehnen."},
  {t:"Gruppe",e:"Eine Sammlung von Operationen, die man beliebig hintereinander ausführen und wieder rückgängig machen kann, ohne die Sammlung zu verlassen – hier: die Kongruenzabbildungen."},
  {t:"Fahne",e:"Startpunkt + Blickrichtung + Seite (links/rechts). Das legt eine Bewegung eindeutig fest, so wie Ort und Kompassrichtung eine Karte ausrichten."}
 ],
 theorems:[
  {n:"Gruppe der Kongruenzabbildungen (5.1.9)",s:"<m>(Kongr(P),∘,id)</m> ist eine Untergruppe von <m>(S(P),∘,id)</m>.",idea:"Verkettung zweier abstandstreuer Bijektionen ist abstandstreu (Lemma 5.1.8) und bijektiv; die Umkehrabbildung ist wieder abstandstreu ⇒ Abgeschlossenheit und Inverse. <m>id</m> ist neutrales Element."},
  {n:"Invarianzeigenschaften (5.1.3)",s:"Kongruenzabbildungen bilden Geraden auf Geraden, Strecken auf Strecken, Strahlen/Halbebenen/Winkel auf ebensolche ab und erhalten Zwischenrelation und Länge (und Winkelmaß).",idea:"Abstandstreue + Axiom Ger-1 ⇒ Kollinearität und Zwischenlage bleiben erhalten; daraus folgen die übrigen Strukturtreuen."},
  {n:"Fahnensatz (5.3.9)",s:"Zu je zwei Fahnen gibt es <strong>genau eine</strong> Kongruenzabbildung, die die erste auf die zweite abbildet.",idea:"Einzigkeit: Eine Kongruenzabbildung, die eine Fahne fest lässt, hat drei nicht-kollineare Fixpunkte, ist nach dem Dreifixpunktesatz 5.3.3 also die Identität. Existenz über das Existenzaxiom 5.3.7."}
 ],
 sketch:{svg:`<svg viewBox="0 0 340 190" width="360">
   <line x1="40" y1="140" x2="180" y2="140" class="s-line"/><circle cx="60" cy="140" r="4" class="s-pt"/>
   <path d="M60 140 L165 140" class="s-line"/><path d="M158 134 L165 140 L158 146" class="s-line"/>
   <rect x="40" y="80" width="140" height="60" fill="rgba(44,96,121,.08)"/>

 </svg>`,cap:"Fahnensatz 5.3.9: genau eine Kongruenzabbildung bildet Fahne 1 auf Fahne 2 ab."},
 focus:[
  "Gruppenaxiome an <m>Kongr(P)</m> nachweisen (Abgeschlossenheit Lemma 5.1.8, Inverse!).",
  "Fahne = <strong>Mast (Halbgerade) + Tuch (Halbebene)</strong>; bestimmt genau eine Kongruenzabbildung.",
  "Einzigkeit über <strong>Fixpunkte</strong>: Dreifixpunktesatz 5.3.3 (drei nicht-kollineare Fixpunkte ⇒ id).",
  "Zu <m>(A,B)↦(A',B')</m> gibt es genau <strong>zwei</strong> Kongruenzabbildungen (Halbebenenwahl, Satz 5.3.7)."
 ],
 nachfr:[
  {q:"Zeigen Sie, dass Kongruenzabbildungen die Zwischenrelation erhalten.",a:"Sei <m>φ</m> abstandstreu und <m>A−B−C</m>, also <m>d(A,B)+d(B,C)=d(A,C)</m>. Wegen <m>d(φX,φY)=d(X,Y)</m> folgt <m>d(φA,φB)+d(φB,φC)=d(φA,φC)</m>, das ist <m>φA−φB−φC</m>. Damit bleiben auch Geraden, Strecken und Strahlen erhalten."},
  {q:"Beweisen Sie die Einzigkeit im Fahnensatz.",a:"Bilden <m>φ,ψ</m> beide Fahne 1 auf Fahne 2 ab, so lässt <m>ψ⁻¹∘φ</m> Fahne 1 fest. Eine Kongruenzabbildung, die eine ganze Fahne fixiert, hat drei nicht-kollineare Fixpunkte; nach dem Dreifixpunktesatz 5.3.3 ist sie die Identität. Also <m>ψ⁻¹∘φ=id</m>, d. h. <m>φ=ψ</m>."},
  {q:"Warum gibt es zu einem Punktepaar genau zwei Kongruenzabbildungen?",a:"Zu <m>(A,B)↦(A',B')</m> ist die Fahne bis auf die Wahl der Halbebene bestimmt: Anfangspunkt <m>A'</m> und Richtung liegen fest, nur die Seite ist frei. Nach Satz 5.3.7 gibt es genau zwei Kongruenzabbildungen mit <m>A,B</m> als vorgegebenen Bildern – eine erhält die Halbebene, die andere vertauscht sie (eine gleichsinnige, eine gegensinnige)."}
 ],
 links:[6,8,17,18]
},
/* ============================== THEMA 8 ============================== */
{
 id:8, chapter:"Kap. 5.2, 5.4, 5.5", scope:"breit", school:true,
 title:"Kongruenz",
 subs:["Kongruenz als Äquivalenzrelation","Streckenkongruenz","Klassen kongruenter Winkel (spitze, rechte und stumpfe Winkel)","Kongruenzsätze am Dreieck"],
 overview:"Breites, prüfungsträchtiges Thema. Kongruenz wird <strong>durch die Gruppe <m>Kongr(P)</m></strong> erzeugt und ist damit automatisch eine Äquivalenzrelation (5.2). Höhepunkt sind die Kongruenzsätze sss, sws, wsw (5.5) sowie Ssw (5.7.3).",
 defs:[
  {t:"Kongruenzrelation (5.2.2)",b:"Figuren <m>F,F'</m> heißen kongruent (<m>F≅F'</m>), wenn es eine Kongruenzabbildung <m>φ∈Kongr(P)</m> mit <m>φ[F]=F'</m> gibt."},
  {t:"Äquivalenzrelation (5.2.1)",b:"Von der Gruppe erzeugt: <strong>reflexiv</strong> (<m>id</m>), <strong>symmetrisch</strong> (<m>φ⁻¹</m>), <strong>transitiv</strong> (<m>ψ∘φ</m>)."},
  {t:"Winkelklassen (5.4.5–5.4.6)",b:"Über den Vergleich mit dem rechten Winkel: <strong>spitz</strong> (< rechter), <strong>recht</strong>, <strong>stumpf</strong> (> rechter, < gestreckt)."}
 ],
 plain:[
  {t:"Kongruenz",e:"Zwei Figuren sind kongruent, wenn man die eine deckungsgleich auf die andere legen kann (evtl. nach Drehen oder Spiegeln) – sie sind gleich groß und gleich geformt."},
  {t:"Äquivalenzrelation",e:"Eine „Gleichwertigkeits\u201c-Beziehung mit drei selbstverständlichen Eigenschaften: jedes ist sich selbst gleichwertig, es gilt in beide Richtungen, und es überträgt sich über Zwischenschritte."},
  {t:"Kongruenzsätze",e:"Faustregeln, welche wenigen Angaben (Seiten/Winkel) schon ausreichen, um ein Dreieck eindeutig festzulegen."}
 ],
 theorems:[
  {n:"Streckenkongruenz (5.3.11)",s:"Zwei Strecken sind genau dann kongruent, wenn sie gleich lang sind.",idea:"„⇒\u201c aus der Abstandstreue der Kongruenzabbildung. „⇐\u201c: Punktabtragung (Satz 3.3.11) liefert die Kongruenzabbildung, die die eine Strecke auf die andere legt."},
  {n:"Kongruenzsätze sss / sws / wsw (5.5)",s:"Drei Seiten (sss), zwei Seiten mit eingeschlossenem Winkel (sws) bzw. eine Seite mit beiden anliegenden Winkeln (wsw) bestimmen das Dreieck bis auf Kongruenz.",idea:"Fahnensatz liefert die Kongruenzabbildung <m>φ</m> mit <m>φ[AB⁺∪AB.C⁺]=A'B'⁺∪A'B'.C'⁺</m>; Abstandstreue erzwingt <m>φ(B)=B'</m>, und der <strong>Dreieckseinzigkeitssatz 4.2.6</strong> dann <m>φ(C)=C'</m>."},
  {n:"Kongruenzsatz Ssw (5.7.3)",s:"Zwei Seiten und der der <strong>größeren</strong> Seite gegenüberliegende Winkel bestimmen das Dreieck.",idea:"Über die Entsprechung von Winkelmaßen und Seitenlängen (5.7.2): die größere Seite legt die Lage der dritten Ecke eindeutig fest. „ssw\u201c an der kleineren Seite gilt nicht (ambiger Fall)."}
 ],
 sketch:{svg:`<svg viewBox="0 0 360 180" width="370">
   <polygon points="40,150 150,150 70,60" class="s-line"/>
   <text x="30" y="166" class="s-lbl">A</text><text x="150" y="166" class="s-lbl">B</text><text x="60" y="54" class="s-lbl">C</text>
   <polygon points="220,150 330,150 250,60" class="s-res"/>
   <text x="210" y="166" class="s-lbl-r">A'</text><text x="330" y="166" class="s-lbl-r">B'</text><text x="240" y="54" class="s-lbl-r">C'</text>
   <path d="M160 105 q25 -8 50 0" class="s-con"/><path d="M204 100 L212 105 L204 110" class="s-con"/>
   <text x="185" y="96" class="s-lbl-b">φ ∈ Kongr(P)</text>
 </svg>`,cap:"Kongruenz = es gibt eine Kongruenzabbildung, die ein Dreieck aufs andere abbildet."},
 focus:[
  "Pointe: Kongruenz ist Äquivalenzrelation, <strong>weil</strong> <m>Kongr(P)</m> eine Gruppe ist (5.2.1).",
  "Kongruenzsätze <strong>beweisen</strong>: Werkzeug Fahnensatz 5.3.9 + Dreieckseinzigkeitssatz 4.2.6.",
  "Winkelklassen spitz/recht/stumpf über den Vergleich mit dem rechten Winkel (5.4.5–5.4.6).",
  "<strong>Ssw</strong> gilt (größere Seite), „ssw\u201c allgemein nicht – Gegenbeispiel mit zwei Dreiecken skizzieren."
 ],
 nachfr:[
  {q:"Beweisen Sie sss unter Verwendung des Fahnensatzes.",a:"Seien <m>AB≅A'B'</m>, <m>BC≅B'C'</m>, <m>CA≅C'A'</m>. Der Fahnensatz 5.3.9 liefert genau eine Kongruenzabbildung <m>φ</m> mit <m>φ[AB⁺∪AB.C⁺]=A'B'⁺∪A'B'.C'⁺</m>. Dann <m>φ(A)=A'</m> und, mit Streckenkongruenz und Punktabtragung (3.3.11), <m>φ(B)=B'</m>. Da <m>|A'φ(C)|=|AC|=|A'C'|</m> und <m>|B'φ(C)|=|BC|=|B'C'|</m> und <m>φ(C)</m> auf der richtigen Seite liegt, folgt nach dem Dreieckseinzigkeitssatz 4.2.6 <m>φ(C)=C'</m>, also <m>ABC≅A'B'C'</m>."},
  {q:"Zeigen Sie, dass Kongruenz transitiv ist.",a:"Aus <m>F≅G</m> und <m>G≅H</m> gibt es <m>φ,ψ∈Kongr(P)</m> mit <m>φ[F]=G</m>, <m>ψ[G]=H</m>. Dann ist <m>ψ∘φ∈Kongr(P)</m> (Gruppe, 5.1.9) mit <m>(ψ∘φ)[F]=H</m>, also <m>F≅H</m>. Mit <m>id</m> (reflexiv) und <m>φ⁻¹</m> (symmetrisch) ist Kongruenz eine Äquivalenzrelation."},
  {q:"Warum ist Ssw gültig, „ssw\u201c aber nicht?",a:"Bei <strong>Ssw</strong> liegt der gegebene Winkel der <em>größeren</em> Seite gegenüber; nach der Entsprechung von Winkelmaßen und Seitenlängen (5.7.2) erzwingt sie die Lage der dritten Ecke eindeutig. Bei „ssw\u201c (Winkel an der kleineren Seite) kann der Kreis um eine Ecke die Gegengerade in zwei Punkten treffen – es entstehen zwei nicht-kongruente Dreiecke (ambiger Fall)."}
 ],
 links:[6,7,9,18]
},
/* ============================== THEMA 9 ============================== */
{
 id:9, chapter:"Kap. 5.4, 5.5", scope:"mittel", school:true,
 title:"Anwendungen von Kongruenzsätzen",
 subs:["Basiswinkelsatz","Scheitelwinkelsatz","Nebenwinkelsatz","Lot, Mittelsenkrechte"],
 overview:"Schulnahes Anwendungsthema: klassische Sätze, die <strong>direkt aus den Kongruenzsätzen</strong> folgen – jeweils mit kurzer, sauberer Beweisidee. Ideal, um Beweisführung zu zeigen.",
 defs:[
  {t:"Mittelsenkrechte (5.5.18)",b:"<m>MiSenk(AB)</m> = geometrischer Ort aller Punkte mit <m>|PA|=|PB|</m>. Sie ist die Gerade durch den Mittelpunkt senkrecht zu <m>AB</m>."},
  {t:"Lot (5.5.5)",b:"Die eindeutige Senkrechte von einem Punkt auf eine Gerade; der Fußpunkt ist der nächstgelegene Punkt der Geraden."}
 ],
 plain:[
  {t:"Basiswinkel",e:"Im gleichschenkligen Dreieck (zwei gleich lange Seiten) sind die beiden unteren Winkel gleich groß – die Figur ist symmetrisch."},
  {t:"Mittelsenkrechte",e:"Die Linie, die eine Strecke im rechten Winkel genau in der Mitte kreuzt. Jeder Punkt auf ihr ist von beiden Endpunkten gleich weit entfernt."},
  {t:"Ortslinie / geometrischer Ort",e:"Die Menge aller Punkte, die eine bestimmte Bedingung erfüllen – z. B. „gleich weit von A und B\u201c. Oft ergibt das eine Linie."}
 ],
 theorems:[
  {n:"Basiswinkelsatz (5.5.3)",s:"Im gleichschenkligen Dreieck (<m>|CA|=|CB|</m>) sind die Basiswinkel gleich: <m>∠CAB≅∠CBA</m>; die Umkehrung gilt ebenfalls.",idea:"sws mit <m>CA,CB</m> und dem Winkel bei <m>C</m> bzw. die Spiegelung an der Winkelhalbierenden durch <m>C</m>: die Kongruenzabbildung tauscht <m>A↔B</m> ⇒ Winkelgleichheit. Umkehrung über wsw."},
  {n:"Scheitel- & Nebenwinkelsatz (5.4.4)",s:"Scheitelwinkel sind kongruent; Nebenwinkel ergänzen sich zum gestreckten Winkel (Maß <m>π</m>).",idea:"Nebenwinkel: zwei Winkel an einer Geraden bilden zusammen den gestreckten Winkel. Scheitelwinkel: beide sind Nebenwinkel desselben Winkels ⇒ gleich."},
  {n:"Mittelsenkrechte als Ort (5.5.18)",s:"<m>|PA|=|PB| ⇔ P∈MiSenk(AB)</m>.",idea:"„⇐\u201c über sws/Spiegelung an <m>MiSenk(AB)</m>. „⇒\u201c: <m>P</m> und der Mittelpunkt sind zwei Punkte gleichen Abstands zu <m>A,B</m> und legen die Mittelsenkrechte eindeutig fest."}
 ],
 sketch:{svg:`<svg viewBox="0 0 340 190" width="360">
   <polygon points="70,160 250,160 160,50" class="s-line"/>
   <circle cx="70" cy="160" r="4" class="s-pt"/><circle cx="250" cy="160" r="4" class="s-pt"/><circle cx="160" cy="50" r="4" class="s-pt"/>
   <text x="56" y="176" class="s-lbl">A</text><text x="254" y="176" class="s-lbl">B</text><text x="153" y="44" class="s-lbl">C</text>
   <path d="M92 155 a24 24 0 0 1 20 0" class="s-res"/><path d="M208 155 a24 24 0 0 0 20 0" class="s-res"/>
   <text x="96" y="140" class="s-lbl-r">α</text><text x="228" y="140" class="s-lbl-r">α</text>
   <line x1="160" y1="50" x2="160" y2="160" class="s-con"/>
   <text x="150" y="185" text-anchor="middle" class="s-lbl-b">|CA|=|CB| ⇒ Basiswinkel gleich</text>
 </svg>`,cap:"Basiswinkelsatz 5.5.3 – Beweis über die Spiegelung an der Symmetrieachse durch C."},
 focus:[
  "Jede Aussage mit <strong>einer prägnanten Beweisidee</strong> koppeln – genau das will die Prüfung sehen.",
  "Basiswinkelsatz elegant über Spiegelung/sws; auch die <strong>Umkehrung</strong> nennen.",
  "Mittelsenkrechte als <strong>geometrischen Ort</strong> (⇔-Aussage 5.5.18) – Basis für den Umkreis (Thema 14).",
  "Neben-/Scheitelwinkel gelten schon in der <strong>absoluten</strong> Geometrie (ohne Parallelenaxiom)."
 ],
 nachfr:[
  {q:"Beweisen Sie den Basiswinkelsatz und seine Umkehrung.",a:"Im Dreieck mit <m>|CA|=|CB|</m> wende sws mit den Seiten <m>CA,CB</m> und dem Winkel bei <m>C</m> an (bzw. spiegle an der Winkelhalbierenden durch <m>C</m>): Die Kongruenzabbildung tauscht <m>A</m> und <m>B</m>, bildet also <m>∠CAB</m> auf <m>∠CBA</m> ab ⇒ Basiswinkel gleich. Umkehrung: Sind die Basiswinkel gleich, folgt aus wsw (Seite <m>AB</m>, anliegende Winkel) die Kongruenz mit dem an <m>AB</m> gespiegelten Dreieck, also <m>|CA|=|CB|</m>."},
  {q:"Zeigen Sie den Scheitelwinkelsatz über Nebenwinkel.",a:"Zwei sich schneidende Geraden bilden vier Winkel. Ein Winkel <m>α</m> und sein Nebenwinkel <m>β</m> ergänzen sich zum gestreckten Winkel: <m>α+β=π</m>. Der Scheitelwinkel <m>α'</m> von <m>α</m> hat denselben Nebenwinkel <m>β</m>, also <m>α'+β=π</m>. Aus beidem folgt <m>α=α'</m> – Scheitelwinkel sind gleich."},
  {q:"Charakterisieren Sie die Mittelsenkrechte als geometrischen Ort.",a:"Die Mittelsenkrechte von <m>AB</m> ist genau die Menge aller <m>P</m> mit <m>|PA|=|PB|</m> (Satz 5.5.18). „⇐\u201c: Liegt <m>P</m> auf ihr, sind die Dreiecke aus <m>P</m>, Mittelpunkt und <m>A</m> bzw. <m>B</m> nach sws kongruent, also <m>|PA|=|PB|</m>. „⇒\u201c: Gilt <m>|PA|=|PB|</m>, legen <m>P</m> und der Mittelpunkt (beide gleich weit von <m>A,B</m>) die Mittelsenkrechte eindeutig fest."}
 ],
 links:[8,10,14]
},
/* ============================== THEMA 10 ============================== */
{
 id:10, chapter:"Kap. 5.7, 6.1", scope:"mittel", school:false,
 title:"Winkelgrößen im Dreieck (ohne Parallelenaxiom)",
 subs:["Winkelgröße und Winkelmaß","Schwacher Außenwinkelsatz","Stufenwinkel, Umkehrung des Stufenwinkelsatzes"],
 overview:"Feines Thema: Was gilt im Dreieck <strong>schon ohne</strong> das Parallelenaxiom (absolute Geometrie)? Der <strong>schwache Außenwinkelsatz</strong> (5.7.2) und die Umkehrung des Stufenwinkelsatzes sind hier die Stars – bewusst <em>ohne</em> Innenwinkelsumme <m>π</m>.",
 defs:[
  {t:"Winkelmaß (5.6.2)",b:"Eine additive Abbildung, die jedem Winkel eine Zahl in <m>[0,π]</m> zuordnet, mit dem rechten Winkel als <m>π/2</m>. Kongruente Winkel haben gleiches Maß."},
  {t:"Außenwinkel (5.7.1)",b:"Die Nebenwinkel der Innenwinkel eines Dreiecks."}
 ],
 plain:[
  {t:"absolute Geometrie",e:"Geometrie mit allen Grundregeln außer der Parallelenregel – der „gemeinsame Kern\u201c, den euklidische und nicht-euklidische Geometrie teilen."},
  {t:"Außenwinkel",e:"Verlängert man eine Dreiecksseite über eine Ecke hinaus, entsteht neben dem Innenwinkel der Außenwinkel – zusammen bilden sie eine gerade Linie (180°)."},
  {t:"Winkelmaß",e:"Die Zahl, die angibt, wie weit ein Winkel geöffnet ist (in Grad oder im Bogenmaß)."}
 ],
 theorems:[
  {n:"Schwacher Außenwinkelsatz (5.7.2)",s:"Für jedes echte Dreieck gilt: Jeder Innenwinkel ist <strong>kleiner</strong> als jeder nicht-anliegende Außenwinkel.",idea:"Sei <m>M=MiPkt(AB)</m>, <m>P</m> auf <m>MC⁻</m> mit <m>|CM|=|MP|</m>. Nach Scheitelwinkelsatz und sws ist <m>AMC≅BMP</m>, also <m>∠BAC≅∠ABP</m>. Da <m>P</m> im Inneren des Außenwinkelfeldes bei <m>B</m> liegt (über HE), ist der Außenwinkel <m>|∠(BA⁺,BC⁻)|</m> echt größer als <m>|∠ABP|=|∠BAC|</m>."},
  {n:"Zwei spitze Innenwinkel (5.7.3)",s:"Jedes echte Dreieck hat mindestens zwei spitze Innenwinkel; die Summe je zweier Innenwinkel ist kleiner als <m>π</m> (5.7.4).",idea:"Direkte Folgerung aus dem schwachen Außenwinkelsatz: wäre höchstens ein Winkel spitz, ergäbe sich ein Widerspruch zur Außenwinkel-Ungleichung."},
  {n:"Umkehrung des Stufenwinkelsatzes",s:"Sind bei einer Schnittgeraden zweier Geraden die Stufenwinkel gleich, so sind die beiden Geraden <strong>parallel</strong> (gilt absolut!).",idea:"Gäbe es einen Schnittpunkt, entstünde ein Dreieck, dessen Außenwinkel gleich einem nicht-anliegenden Innenwinkel wäre – Widerspruch zum schwachen Außenwinkelsatz."}
 ],
 sketch:{svg:`<svg viewBox="0 0 340 190" width="360">
   <polygon points="60,150 230,150 120,60" class="s-line"/>
   <line x1="230" y1="150" x2="300" y2="150" class="s-line"/>
   <text x="50" y="166" class="s-lbl">A</text><text x="120" y="54" class="s-lbl">C</text><text x="225" y="167" class="s-lbl">B</text>

   <text x="256" y="140" class="s-lbl-r">Außenw. δ</text>
   <text x="70" y="140" class="s-lbl-b">α</text><text x="118" y="86" class="s-lbl-b">γ</text>
   <text x="150" y="185" text-anchor="middle" class="s-lbl-r">δ > α  und  δ > γ  (ohne Parallelenaxiom!)</text>
 </svg>`,cap:"Schwacher Außenwinkelsatz 5.7.2: Innenwinkel echt kleiner als die fernen Außenwinkel."},
 focus:[
  "Ganz wichtig: hier <strong>kein</strong> Parallelenaxiom – nur der <em>schwache</em> (Ungleichung), nicht der starke Außenwinkelsatz.",
  "Beweis von 5.7.2 über <strong>Seitenmittelpunkt + Scheitelwinkel + sws</strong> parat haben.",
  "Die Umkehrung des Stufenwinkelsatzes liefert <strong>Existenz</strong> von Parallelen (absolute Geometrie).",
  "Abgrenzung zu Thema 13: <em>starker</em> Außenwinkelsatz & Innenwinkelsumme <m>π</m> brauchen Axiom P."
 ],
 nachfr:[
  {q:"Beweisen Sie den schwachen Außenwinkelsatz.",a:"Sei <m>M=MiPkt(AB)</m> und <m>P</m> der nach Axiom Ger-2 eindeutige Punkt auf <m>MC⁻</m> mit <m>|CM|=|MP|</m>. Nach dem Scheitelwinkelsatz gilt <m>∠CMA≅∠PMB</m>, also sind <m>AMC</m> und <m>BMP</m> nach sws kongruent und <m>∠BAC≅∠ABP</m>. Über das Halbebenenaxiom liegt <m>P</m> in <m>AB.C⁻</m> und in <m>BC.A⁺</m>, also im Inneren des Außenwinkelfeldes bei <m>B</m>. Daher <m>|∠(BA⁺,BC⁻)|=|∠ABP|+|∠(BP⁺,BC⁻)|>|∠ABP|=|∠BAC|</m>."},
  {q:"Warum liefert die Umkehrung des Stufenwinkelsatzes Parallelen ohne Parallelenaxiom?",a:"Sind bei einer Schnittgeraden die Stufenwinkel gleich, können sich die beiden Geraden nicht schneiden: Ein Schnittpunkt erzeugte ein Dreieck, in dem ein Außenwinkel gleich einem nicht-anliegenden Innenwinkel wäre – Widerspruch zum schwachen Außenwinkelsatz 5.7.2. Also sind sie parallel. Das zeigt die Existenz von Parallelen allein in der absoluten Geometrie."},
  {q:"Was ist der Unterschied zwischen schwachem und starkem Außenwinkelsatz?",a:"Der <strong>schwache</strong> (5.7.2) ist eine Ungleichung: Innenwinkel kleiner als jeder ferne Außenwinkel – er gilt schon absolut. Der <strong>starke</strong> (7.1.4) ist eine Gleichung: Außenwinkel gleich der Summe der beiden fernen Innenwinkel – er ist gleichwertig zum Innenwinkelsatz (<m>π</m>) und braucht das Parallelenaxiom."}
 ],
 links:[9,13,8]
},
/* ============================== THEMA 13 ============================== */
{
 id:13, chapter:"Kap. 7.1, 7.2", scope:"mittel", school:true,
 title:"Konsequenzen des Parallelenaxioms",
 subs:["Stufenwinkelsatz, Wechselwinkelsatz mit Umkehrung","Innenwinkelsatz, starker Außenwinkelsatz","Anwendung auf Parallelogramme","Satz über die Mittenlinien im Dreieck"],
 overview:"Jetzt greift Axiom P. Ergebnisse, die Schüler kennen: <strong>Innenwinkelsumme <m>π</m></strong> (7.1.3), starker Außenwinkelsatz (7.1.4), Parallelogrammsätze (7.2) und Mittenliniensatz (7.2.12). Wichtig: sauber trennen, was <em>neu</em> das Parallelenaxiom braucht.",
 defs:[
  {t:"parallel (6.1.4)",b:"Zwei Geraden heißen parallel, wenn sie gleich sind oder keine gemeinsamen Punkte besitzen."},
  {t:"Stufen-/Wechselwinkel (6.1.5–6.1.6)",b:"Über die freien Schenkel definierte Winkelpaare an zwei von einer Geraden geschnittenen Geraden."},
  {t:"Parallelogramm (7.2.1)",b:"Viereck mit zwei Paaren paralleler Seiten; äquivalent: gegenüberliegende Seiten (bzw. Winkel) gleich, Diagonalen halbieren sich (7.2.7)."}
 ],
 plain:[
  {t:"Stufen-/Wechselwinkel",e:"Kreuzt eine Gerade zwei Parallelen, entstehen gleich große Winkelpaare: Stufenwinkel liegen „gleich\u201c an beiden Kreuzungen, Wechselwinkel über Eck."},
  {t:"Innenwinkelsumme π",e:"In jedem ebenen Dreieck ergeben die drei Winkel zusammen immer eine halbe Umdrehung, also 180°."},
  {t:"Parallelogramm",e:"Ein Viereck, bei dem beide Paare gegenüberliegender Seiten parallel sind – z. B. ein „schiefes Rechteck\u201c."}
 ],
 theorems:[
  {n:"Stufen-/Wechselwinkelsatz (7.1.1–7.1.2)",s:"Sind die Trägergeraden der freien Schenkel parallel, so sind die Stufenwinkel (bzw. Wechselwinkel) kongruent. Mit der Umkehrung (Thema 10) eine <strong>Äquivalenz</strong> zur Parallelität.",idea:"Die Existenz einer Parallelen mit gleichen Stufenwinkeln gilt absolut; die <em>Eindeutigkeit</em> aus Axiom P liefert die Rückrichtung ⇒ Gleichheit."},
  {n:"Dreiecksinnenwinkelsatz (7.1.3)",s:"Jedes echte Dreieck hat die Innenwinkelsumme <m>π</m>.",idea:"Nach Axiom P die eindeutige Parallele <m>h</m> zu <m>AB</m> durch <m>C</m>. Der Wechselwinkelsatz überträgt <m>α,β</m> an den Scheitel <m>C</m>, wo sie mit <m>γ</m> den gestreckten Winkel bilden: <m>α+β+γ=π</m>."},
  {n:"Starker Außenwinkelsatz (7.1.4)",s:"Jeder Außenwinkel ist so groß wie die Summe der beiden nicht-anliegenden Innenwinkel.",idea:"Folgt aus dem Innenwinkelsatz: Außenwinkel = <m>π−γ=α+β</m>."},
  {n:"Mittenliniensatz (7.2.12)",s:"Die Verbindung der Mittelpunkte zweier Dreiecksseiten ist parallel zur dritten Seite und halb so lang.",idea:"Ergänzung zu einem Parallelogramm über eine Punktspiegelung am Seitenmittelpunkt; daraus Parallelität und Halbierung (Grundlage der Strahlensätze und des Schwerpunktsatzes)."}
 ],
 sketch:{svg:`<svg viewBox="0 0 340 180" width="360">
   <polygon points="50,150 250,150 130,50" class="s-line"/>
   <line x1="70" y1="50" x2="210" y2="50" class="s-con"/>
   <text x="40" y="166" class="s-lbl">A</text><text x="252" y="166" class="s-lbl">B</text><text x="125" y="44" class="s-lbl">C</text>
   <text x="215" y="48" class="s-lbl-b">h ∥ AB</text>
   <path d="M70 145 a22 22 0 0 1 16 -14" class="s-res"/><text x="72" y="135" class="s-lbl-r">α</text>
   <path d="M230 145 a22 22 0 0 0 -16 -14" class="s-res"/><text x="222" y="135" class="s-lbl-r">β</text>
   <path d="M112 62 a18 18 0 0 1 36 0" class="s-res"/><text x="126" y="80" class="s-lbl-r">α γ β</text>
   <text x="150" y="176" text-anchor="middle" class="s-lbl-b">α+β+γ = π  (über Parallele durch C)</text>
 </svg>`,cap:"Dreiecksinnenwinkelsatz 7.1.3: Parallele durch C überträgt α und β per Wechselwinkel."},
 focus:[
  "Klar herausstellen: erst <strong>Axiom P</strong> macht aus „Parallele existiert\u201c ⇒ „genau eine\u201c, damit Stufenwinkel <em>gleich</em>.",
  "Innenwinkelsatz 7.1.3 elegant über Parallele durch <m>C</m> + Wechselwinkelsatz beweisen.",
  "Parallelogramm-Charakterisierungen (Seiten/Winkel/Diagonalen, 7.2) als Äquivalenzen kennen.",
  "Mittenliniensatz 7.2.12 ist das <strong>Bindeglied</strong> zu Strahlensätzen (17) und Transversalen (14)."
 ],
 nachfr:[
  {q:"Beweisen Sie den Innenwinkelsatz.",a:"Nach Axiom P gibt es genau eine Parallele <m>h</m> zu <m>AB</m> durch <m>C</m>. Wähle <m>A'∈h∩BCA⁻</m>, <m>B'∈h∩ACB⁻</m>. Nach dem Wechselwinkelsatz gelten <m>∠BAC≅∠B'CA</m> und <m>∠CBA≅∠BCA'</m>. Mit der Additivität des Winkelmaßes ist <m>α+β+γ=|∠B'CA|+|∠ACB|+|∠BCA'|=|∠B'CA'|=π</m>."},
  {q:"Welche Rolle spielt genau die Eindeutigkeit im Parallelenaxiom?",a:"Die <em>Existenz</em> einer Parallelen mit gleichen Stufenwinkeln gilt schon absolut. Erst die <em>Eindeutigkeit</em> (genau eine Parallele) erzwingt die Rückrichtung des Stufenwinkelsatzes: Sind zwei Geraden parallel, müssen die Stufenwinkel gleich sein – sonst gäbe es eine zweite Parallele. Daraus folgen Innenwinkelsatz und starker Außenwinkelsatz."},
  {q:"Beweisen Sie den Mittenliniensatz.",a:"Seien <m>M,N</m> die Mittelpunkte von <m>CA,CB</m>. Über eine Punktspiegelung am Seitenmittelpunkt ergänzt man die Figur zu einem Parallelogramm; dessen gegenüberliegende Seiten liefern <m>MN∥AB</m>, und die gleich langen Parallelogrammseiten liefern <m>|MN|=½|AB|</m> (Satz 7.2.12)."}
 ],
 links:[10,14,17]
},
/* ============================== THEMA 14 ============================== */
{
 id:14, chapter:"Kap. 7.4, 7.2.3", scope:"mittel", school:true,
 title:"Transversalen im Dreieck",
 subs:["Schnittpunkte von Winkelhalbierende, Mittelsenkrechten und Höhen","Satz über die Mittenlinien im Dreieck","Schnittpunkt der Seitenhalbierenden"],
 overview:"Die „merkwürdigen Punkte\u201c: Umkreismittelpunkt (Mittelsenkrechten, 7.4.1), Höhenschnittpunkt (7.4.3), Inkreismittelpunkt (Winkelhalbierende, 7.4.6) und Schwerpunkt (Seitenhalbierende, 7.4.8). Beweise laufen über <strong>geometrische Örter</strong> und den Mittenliniensatz.",
 defs:[
  {t:"Mittelsenkrechtenschnittpunkt (7.4.1)",b:"Umkreismittelpunkt <m>M</m>: gleicher Abstand zu allen Ecken."},
  {t:"Winkelhalbierende (7.4.5)",b:"Geometrischer Ort der Punkte im Winkelinneren mit gleichem Abstand zu beiden Schenkeln: <m>d(P,AB)=d(P,AC)</m>."},
  {t:"Seitenhalbierende (7.4.7)",b:"Gerade durch Ecke und Mittelpunkt der Gegenseite; Schnittpunkt = Schwerpunkt <m>S</m>."}
 ],
 plain:[
  {t:"Umkreis / Umkreismittelpunkt",e:"Der Kreis, der durch alle drei Ecken geht. Sein Mittelpunkt ist von allen Ecken gleich weit entfernt."},
  {t:"Inkreis",e:"Der größte Kreis, der ins Dreieck passt und alle drei Seiten von innen berührt."},
  {t:"Schwerpunkt",e:"Der Balancepunkt des Dreiecks – dort könnte man es auf einer Nadelspitze ausbalancieren."}
 ],
 theorems:[
  {n:"Mittelsenkrechtenschnittpunkt (7.4.1)",s:"Die drei Mittelsenkrechten schneiden sich in einem Punkt <m>M</m> mit <m>|MA|=|MB|=|MC|</m> (Umkreismittelpunkt).",idea:"<m>M:=MiSenk(AB)∩MiSenk(AC)</m> (nicht parallel, sonst wären Seiten parallel). Nach der Ortslinien-Charakterisierung 5.5.18 gilt <m>|MA|=|MB|</m> und <m>|MA|=|MC|</m>, also <m>|MB|=|MC|</m> ⇒ <m>M∈MiSenk(BC)</m>."},
  {n:"Winkelhalbierendenschnittpunkt (7.4.6)",s:"Die drei Innenwinkelhalbierenden schneiden sich in <m>W</m> mit gleichem Abstand zu allen Seiten (Inkreis).",idea:"Winkelhalbierende = Ort gleichen Abstands zu den beiden Schenkeln (7.4.5); analoges Schnitt-Argument wie beim Umkreis."},
  {n:"Seitenhalbierendenschnittpunkt (7.4.8)",s:"Die Seitenhalbierenden schneiden sich in <m>S</m> und werden von ihm im Verhältnis <m>2:1</m> geteilt.",idea:"Mittenliniensatz 7.2.12 auf <m>ABC</m> und <m>ABS</m>: das Viereck aus den Seitenmittelpunkten ist ein Parallelogramm ⇒ <m>|AS|=⅔|AA'|</m>, also Teilung <m>2:1</m>; alle drei treffen sich (Punktabtragung)."}
 ],
 sketch:{svg:`<svg viewBox="0 0 320 200" width="340">
   <polygon points="50,170 270,170 170,40" class="s-line"/>
   <line x1="50" y1="170" x2="220" y2="105" class="s-con"/>
   <line x1="270" y1="170" x2="110" y2="105" class="s-con"/>

   <text x="150" y="194" text-anchor="middle" class="s-lbl-b">Seitenhalbierende → Schwerpunkt (2:1)</text>
 </svg>`,cap:"Seitenhalbierendenschnittpunktssatz 7.4.8: Teilung 2:1 im Schwerpunkt S."},
 focus:[
  "Beweisschema für alle Schnittpunkte: <strong>Ort ∩ Ort erfüllt auch die dritte Bedingung</strong>.",
  "Umkreis ↔ Mittelsenkrechte (gleicher Abstand zu <em>Ecken</em>); Inkreis ↔ Winkelhalbierende (gleicher Abstand zu <em>Seiten</em>).",
  "Schwerpunkt teilt <m>2:1</m> – über Mittenliniensatz 7.2.12 begründen.",
  "Höhenschnittpunkt 7.4.3: über das Mittendreieck auf Mittelsenkrechten zurückführen."
 ],
 nachfr:[
  {q:"Beweisen Sie, dass sich die Mittelsenkrechten in einem Punkt schneiden.",a:"Sei <m>M</m> der Schnittpunkt von <m>MiSenk(AB)</m> und <m>MiSenk(AC)</m> (nicht parallel, sonst wären <m>AB,AC</m> nach dem Stufenwinkelsatz parallel). Nach Satz 5.5.18 (Vorwärtsrichtung) gilt <m>|MA|=|MB|</m> und <m>|MA|=|MC|</m>, also <m>|MB|=|MC|</m>; nach der Rückwärtsrichtung folgt <m>M∈MiSenk(BC)</m>. <m>M</m> hat von allen Ecken gleichen Abstand (Umkreismittelpunkt)."},
  {q:"Warum teilt der Schwerpunkt die Seitenhalbierenden im Verhältnis 2:1?",a:"Nach dem Ecktransversalensatz schneidet <m>AA'⁺</m> die Strecke <m>]BB'[</m> in <m>S</m>. Der Mittenliniensatz 7.2.12 auf <m>ABC</m> liefert <m>A'B'∥AB</m>, <m>|A'B'|=½|AB|</m>; angewandt auf <m>ABS</m> liefert er dieselbe Länge für die Mitten von <m>AS,BS</m>. Das entstehende Viereck ist ein Parallelogramm, also <m>|AS|=⅔|AA'|</m>, d. h. Teilung <m>2:1</m>. Mit derselben Argumentation für <m>CC'</m> und Punktabtragung fallen alle Schnittpunkte zusammen."},
  {q:"Welcher Zusammenhang besteht zwischen Höhen und Mittelsenkrechten?",a:"Ergänzt man <m>ABC</m> durch Parallelen zu einem doppelt so großen Dreieck, werden die Höhen von <m>ABC</m> zu Mittelsenkrechten dieses großen Dreiecks. Da sich Mittelsenkrechten in einem Punkt schneiden (7.4.1), tun das auch die Höhen – im Höhenschnittpunkt (7.4.3)."}
 ],
 links:[9,13,17]
},
/* ============================== THEMA 17 ============================== */
{
 id:17, chapter:"Kap. 7.2.3, 9.2", scope:"mittel", school:true,
 title:"Strahlensätze",
 subs:["Satz über die Mittenlinien im Dreieck","Herleitung der Strahlensätze","Umkehrungen und Verallgemeinerung","Anwendungen der Strahlensätze"],
 overview:"Schulnahes Kernthema. Aus dem <strong>Mittenliniensatz</strong> (7.2.12) wird über Induktion (Lemma 9.2.1) und den rationalen Fall (Lemma 9.2.2) der <strong>1. und 2. Strahlensatz</strong> gewonnen; der allgemeine Fall über die zentrische Streckung.",
 defs:[
  {t:"Strahlensatz-Konfiguration",b:"Zwei Strahlen mit gemeinsamem Anfangspunkt <m>O</m>, geschnitten von zwei zueinander <strong>parallelen</strong> Geraden. Abschnitte auf den Strahlen und auf den Parallelen."}
 ],
 plain:[
  {t:"Strahlensatz",e:"Schneiden zwei parallele Linien zwei aus einem Punkt auslaufende Strahlen, so teilen sie beide Strahlen im gleichen Verhältnis – die Grundlage fürs indirekte Messen (z. B. Baumhöhe über den Schatten)."},
  {t:"Verhältnis",e:"Der Vergleich zweier Längen als Bruch. „Im gleichen Verhältnis\u201c heißt: der Bruch der Abschnitte ist auf beiden Strahlen derselbe."}
 ],
 theorems:[
  {n:"Induktionslemma (9.2.1)",s:"Trägt man <m>OA₁</m> auf dem Strahl <m>k</m>-mal ab, so zerlegen die Parallelen das Dreieck <m>OA_kB_k</m> in <m>k²</m> zu <m>OA₁B₁</m> kongruente Teildreiecke; es gelten <m>|OB_k|=k·|OB₁|</m> und <m>|A_kB_k|=k·|A₁B₁|</m>.",idea:"Vollständige Induktion mit dem Mittenliniensatz 7.2.12 als Schritt <m>k→k+1</m>."},
  {n:"1. Strahlensatz",s:"<m>|OA'|:|OA|=|OB'|:|OB|</m> für parallele Schnittgeraden.",idea:"Rationaler Fall über Lemma 9.2.2 (Zerlegung in kongruente Teildreiecke); allgemeiner Fall über Stetigkeit bzw. die zentrische Streckung."},
  {n:"2. Strahlensatz",s:"Zusätzlich <m>|A'B'|:|AB|=|OA'|:|OA|</m> (Abschnitte auf den Parallelen).",idea:"Aus dem Induktionslemma (<m>|A_kB_k|=k·|A₁B₁|</m>) bzw. direkt aus der zentrischen Streckung."},
  {n:"Umkehrung",s:"Gilt die Abschnittsproportion auf beiden Strahlen, so sind die Schnittgeraden parallel (Umkehrung des 1. Strahlensatzes). Für den 2. gilt das nicht uneingeschränkt.",idea:"Über die Eindeutigkeit der Parallelen (Axiom P): eine dritte Gerade mit gleichem Verhältnis müsste mit der Parallelen zusammenfallen."}
 ],
 sketch:{svg:`<svg viewBox="0 0 340 200" width="360">
   <circle cx="40" cy="100" r="4" class="s-pt"/><text x="26" y="104" class="s-lbl">O</text>
   <line x1="40" y1="100" x2="320" y2="40" class="s-line"/>
   <line x1="40" y1="100" x2="320" y2="170" class="s-line"/>
   <line x1="130" y1="81" x2="130" y2="118" class="s-res"/>
   <line x1="250" y1="55" x2="250" y2="152" class="s-res"/>
   <text x="120" y="74" class="s-lbl">A₁</text><text x="120" y="132" class="s-lbl">B₁</text>
   <text x="255" y="50" class="s-lbl">A₂</text><text x="255" y="166" class="s-lbl">B₂</text>
   <text x="180" y="193" text-anchor="middle" class="s-lbl-b">|OA₁|:|OA₂| = |OB₁|:|OB₂| = |A₁B₁|:|A₂B₂|</text>
 </svg>`,cap:"Strahlensatz-Konfiguration: gemeinsamer Punkt O, zwei parallele Schnittgeraden."},
 focus:[
  "Herleitungslinie parat: <strong>Mittenliniensatz 7.2.12 → Induktion 9.2.1 → rationaler Fall 9.2.2 → zentrische Streckung</strong>.",
  "Voraussetzungen exakt: <em>parallele</em> Schnittgeraden, gemeinsamer Scheitel.",
  "Umkehrung des 1. Strahlensatzes gilt; beim 2. auf Ausnahmen hinweisen.",
  "Anwendungen: Streckenteilung, Höhenmessung, Ähnlichkeitsbeweise (Brücke zu Thema 18)."
 ],
 nachfr:[
  {q:"Leiten Sie den 1. Strahlensatz aus dem Mittenliniensatz her.",a:"Zunächst für ganzzahlige Teilungen (Lemma 9.2.1): Trägt man <m>OA₁</m> auf dem Strahl <m>k</m>-mal ab und zieht die Parallelen, zerlegen sie das Dreieck <m>OA_kB_k</m> per Mittenliniensatz 7.2.12 in <m>k²</m> kongruente Teildreiecke. Daraus <m>|OA_k|:|OA₁|=|OB_k|:|OB₁|=k</m>. Für rationale Verhältnisse folgt es durch Teilung (Lemma 9.2.2), für beliebige über Stetigkeit bzw. die zentrische Streckung."},
  {q:"Formulieren und prüfen Sie die Umkehrung.",a:"Umkehrung (1. Strahlensatz): Gilt <m>|OA'|:|OA|=|OB'|:|OB|</m>, so ist <m>A'B'∥AB</m>. Sie ist wahr: Eine zweite, nicht-parallele Gerade durch <m>A'</m> mit demselben Verhältnis widerspräche der Eindeutigkeit der Parallelen (Axiom P). Die Umkehrung des 2. Strahlensatzes gilt dagegen nicht uneingeschränkt."},
  {q:"Wie hängen Strahlensätze und zentrische Streckung zusammen?",a:"Die Strahlensatz-Figur ist das Bild einer zentrischen Streckung mit Zentrum <m>O</m>: <m>A₂=Z_{O,k}(A₁)</m>, <m>B₂=Z_{O,k}(B₁)</m>. Da die Streckung Geraden auf parallele abbildet und Längen mit <m>k</m> multipliziert (9.2.2), sind die Strahlensätze genau deren Längen- und Parallelitätsaussagen – auch für irrationale Faktoren sauber begründet."}
 ],
 links:[13,18,19]
},
/* ============================== THEMA 18 ============================== */
{
 id:18, chapter:"Kap. 9.1–9.3", scope:"breit", school:true,
 title:"Zentrische Streckung und Ähnlichkeit",
 subs:["Gruppeneigenschaften","Invarianzeigenschaften","Existenz- und Eindeutigkeitsaussagen","Ähnlichkeit als Äquivalenzrelation"],
 overview:"Breites Thema: <strong>zentrische Streckungen</strong> (9.1.2) und allgemeine <strong>Ähnlichkeitsabbildungen</strong> (9.1.1). Ähnlichkeit ist – wie Kongruenz – eine über eine Abbildungsgruppe erzeugte Äquivalenzrelation (9.3.1), jetzt mit Streckfaktor.",
 defs:[
  {t:"Ähnlichkeitsabbildung (9.1.1)",b:"Bijektion, die alle Abstände mit einem festen Faktor <m>k>0</m> multipliziert. Die Ähnlichkeitsabbildungen bilden eine Gruppe."},
  {t:"Zentrische Streckung (9.1.2)",b:"<m>Z_{S,k}</m> mit Zentrum <m>S</m>, Faktor <m>k≠0</m>: <m>P↦P'</m> auf <m>SP</m> mit <m>|SP'|=|k|·|SP|</m>. Bildet Geraden auf parallele ab, multipliziert Längen mit <m>|k|</m>, erhält Winkel (9.2.2)."},
  {t:"Ähnlichkeitsrelation (9.3.1)",b:"<m>F∼F' :⇔</m> es gibt eine Ähnlichkeitsabbildung mit <m>φ[F]=F'</m>. Äquivalenzrelation."}
 ],
 plain:[
  {t:"zentrische Streckung",e:"Ein Vergrößern oder Verkleinern von einem festen Zentrum aus – wie ein Beamer, der ein Bild von einem Punkt aus maßstabsgetreu aufbläst."},
  {t:"Ähnlichkeit",e:"Zwei Figuren sind ähnlich, wenn sie dieselbe Form, aber evtl. verschiedene Größe haben – wie ein Foto und sein Abzug in anderer Größe."}
 ],
 theorems:[
  {n:"Invarianzeigenschaften (9.2.2 / 9.2.3)",s:"Ähnlichkeitsabbildungen erhalten Winkel, Teilverhältnisse und Parallelität, multiplizieren Längen mit <m>k</m> und Flächen mit <m>k²</m>.",idea:"Verkettung/Inverse von Streckungen und Kongruenzabbildungen sind wieder solche; Winkel- und Verhältnistreue aus den Strahlensätzen."},
  {n:"Ähnlichkeitssätze (9.3.2)",s:"WW (zwei gleiche Winkel), SsS und SwS – analog zu den Kongruenzsätzen, mit Faktor statt Gleichheit. Insbesondere der <strong>Hauptähnlichkeitssatz</strong> (WW).",idea:"Eine zentrische Streckung passt eine Seite an; danach greift der entsprechende Kongruenzsatz. Ähnlichkeitsabbildung = Streckung ∘ Kongruenzabbildung."},
  {n:"Ähnlichkeit als Äquivalenzrelation (9.3.1)",s:"<m>∼</m> ist reflexiv, symmetrisch und transitiv.",idea:"Von der Gruppe der Ähnlichkeitsabbildungen erzeugt: <m>id</m> (reflexiv), Inverse mit <m>1/k</m> (symmetrisch), Verkettung mit Produktfaktor (transitiv)."}
 ],
 sketch:{svg:`<svg viewBox="0 0 340 190" width="360">
   <circle cx="40" cy="150" r="4" class="s-pt"/><text x="28" y="166" class="s-lbl">S</text>
   <polygon points="90,140 150,140 120,105" class="s-line"/>
   <polygon points="140,120 260,120 200,50" class="s-res"/>
   <line x1="40" y1="150" x2="260" y2="120" class="s-con"/>

   <text x="150" y="184" text-anchor="middle" class="s-lbl-b">Z_{S,k}: vergrößertes, ähnliches Dreieck</text>
 </svg>`,cap:"Zentrische Streckung 9.1.2 mit Zentrum S und Faktor k > 1."},
 focus:[
  "Parallele zu Thema 8: Ähnlichkeit ist Äquivalenzrelation, <strong>weil</strong> die Ähnlichkeitsabbildungen eine Gruppe bilden (9.3.1).",
  "Zentrische Streckung: <strong>geradentreu (→ parallel), winkeltreu, |k|-längentreu</strong> (9.2.2).",
  "Zerlegung: jede Ähnlichkeitsabbildung = Streckung ∘ Kongruenzabbildung.",
  "Flächen skalieren mit <m>k²</m> – wichtig für Anwendungen; Hauptähnlichkeitssatz (WW) parat haben."
 ],
 nachfr:[
  {q:"Zeigen Sie, dass die zentrische Streckung Geraden auf Parallelen abbildet.",a:"Sei <m>g</m> eine Gerade ohne das Zentrum <m>S</m>, <m>A,B∈g</m>. Ihre Bilder liegen auf <m>SA,SB</m> mit <m>|SA'|=k|SA|</m>, <m>|SB'|=k|SB|</m>. Nach dem 1. Strahlensatz (bzw. Lemma 9.2.2) ist <m>A'B'∥AB</m>. Also wird <m>g</m> auf eine parallele Gerade abgebildet (Geraden durch <m>S</m> bleiben fix)."},
  {q:"Beweisen Sie den Hauptähnlichkeitssatz.",a:"Stimmen zwei Dreiecke in zwei (also allen) Winkeln überein, wende zuerst eine zentrische Streckung an, die eine Seite auf die Länge der entsprechenden Seite des zweiten Dreiecks bringt. Das gestreckte Dreieck ist winkelgleich und hat nun eine gleich lange Seite; nach wsw ist es kongruent zum zweiten. Streckung ∘ Kongruenzabbildung ist eine Ähnlichkeitsabbildung – die Dreiecke sind ähnlich."},
  {q:"Warum ist Ähnlichkeit eine Äquivalenzrelation?",a:"Weil die Ähnlichkeitsabbildungen eine Gruppe bilden: die Identität ist eine (reflexiv), zu jeder mit Faktor <m>k</m> gibt es die Inverse mit <m>1/k</m> (symmetrisch), und die Verkettung ist wieder eine mit Produktfaktor (transitiv). Damit ist <m>∼</m> reflexiv, symmetrisch und transitiv (Satz 9.3.1)."}
 ],
 links:[17,8,19]
},
/* ============================== THEMA 19 ============================== */
{
 id:19, chapter:"Kap. 9.4", scope:"eng", school:true,
 title:"Satzgruppe des Pythagoras",
 subs:["Höhensatz, Kathetensatz","Satz des Pythagoras mit Umkehrungen"],
 overview:"Enges, sehr schulnahes Thema – hier musst du alles können. Höhensatz (9.4.4), Kathetensatz (9.4.5) und Satz des Pythagoras (9.4.6) folgen alle aus der <strong>Ähnlichkeit der Teildreiecke</strong> an der Hypotenusenhöhe (Lemma 9.4.3). Umkehrungen (9.4.2) und Äquivalenz (9.4.3) kennen.",
 defs:[
  {t:"Katheten / Hypotenuse (9.4.1)",b:"Die dem rechten Winkel <strong>gegenüberliegende</strong> Seite ist die Hypotenuse, die anliegenden sind die Katheten. Der Höhenfußpunkt teilt die Hypotenuse in zwei <strong>Hypotenusenabschnitte</strong>."}
 ],
 plain:[
  {t:"Kathete / Hypotenuse",e:"Im rechtwinkligen Dreieck sind die beiden Seiten am rechten Winkel die Katheten, die längste Seite ihm gegenüber ist die Hypotenuse."},
  {t:"Satz des Pythagoras",e:"Im rechtwinkligen Dreieck ist die Summe der Quadrate über den beiden kurzen Seiten gleich dem Quadrat über der langen: a²+b²=c²."}
 ],
 theorems:[
  {n:"Grundlemma (9.4.3)",s:"Fällt man im bei <m>C</m> rechtwinkligen Dreieck die Höhe auf <m>AB</m> mit Fußpunkt <m>D</m>, so sind <m>ABC</m>, <m>ADC</m>, <m>BCD</m> paarweise ähnlich, und es gelten <m>|BC|²=|AB|·|BD|</m>, <m>|AC|²=|AB|·|AD|</m>, <m>|CD|²=|AD|·|BD|</m>.",idea:"Alle drei Teildreiecke haben einen rechten Winkel und teilen je einen spitzen Winkel ⇒ Hauptähnlichkeitssatz. Aus den Seitenverhältnissen folgen die drei Produktformeln."},
  {n:"Höhen- & Kathetensatz (9.4.4 / 9.4.5)",s:"Höhensatz: <m>h²=p·q</m>. Kathetensatz: <m>a²=c·p</m>, <m>b²=c·q</m>.",idea:"Unmittelbar aus (9.4.4) bzw. (9.4.2)/(9.4.3) des Grundlemmas."},
  {n:"Satz des Pythagoras & Umkehrung (9.4.6 / 9.4.2)",s:"<m>a²+b²=c²</m>. Umkehrung: gilt <m>a²+b²=c²</m>, so ist das Dreieck bei <m>C</m> rechtwinklig.",idea:"Pythagoras: Kathetensätze addieren, <m>a²+b²=c·p+c·q=c(p+q)=c²</m> wegen <m>A−D−B</m>. Umkehrung über Kongruenz (sss) mit einem konstruierten rechtwinkligen Vergleichsdreieck."}
 ],
 sketch:{svg:`<svg viewBox="0 0 340 200" width="360">
   <polygon points="40,160 300,160 120,50" class="s-line"/>
   <line x1="120" y1="50" x2="120" y2="160" class="s-res"/>
   <rect x="120" y="148" width="12" height="12" fill="none" stroke="#B23B2E" stroke-width="1.4"/>
   <circle cx="120" cy="50" r="3.5" class="s-pt"/>
   <text x="30" y="176" class="s-lbl">A</text><text x="300" y="176" class="s-lbl">B</text><text x="116" y="44" class="s-lbl">C</text><text x="118" y="176" class="s-lbl-r">D</text>
   <text x="78" y="176" class="s-lbl-b">p</text><text x="205" y="176" class="s-lbl-b">q</text><text x="126" y="110" class="s-lbl-r">h</text>
   <text x="170" y="196" text-anchor="middle" class="s-lbl-b">h²=p·q · a²=c·p · b²=c·q · a²+b²=c²</text>
 </svg>`,cap:"Hypotenusenhöhe erzeugt drei ähnliche Dreiecke (Lemma 9.4.3) — Quelle der Satzgruppe."},
 focus:[
  "Alle drei Sätze aus <strong>einem</strong> Ähnlichkeitslemma (9.4.3) herleiten – die elegante Prüfungsantwort.",
  "Pythagoras = Summe der beiden Kathetensätze (Beweis von 9.4.6).",
  "<strong>Umkehrung</strong> sauber formulieren und über sss/Kongruenz beweisen (9.4.2).",
  "Äquivalenz erwähnen (9.4.3): Höhensatz, Kathetensatz und Pythagoras sind logisch gleichwertig."
 ],
 nachfr:[
  {q:"Beweisen Sie den Kathetensatz über Ähnlichkeit.",a:"Fälle im bei <m>C</m> rechtwinkligen Dreieck die Höhe auf <m>AB</m> mit Fußpunkt <m>D</m>. Nach dem Hauptähnlichkeitssatz gilt <m>ABC∼ADC</m> (gemeinsamer Winkel bei <m>A</m>, beide rechtwinklig). Aus <m>|AB|:|AC|=|AC|:|AD|</m> folgt <m>|AC|²=|AB|·|AD|</m> – Kathetenquadrat gleich Hypotenuse mal anliegendem Hypotenusenabschnitt (Satz 9.4.5)."},
  {q:"Leiten Sie Pythagoras aus dem Kathetensatz her.",a:"Der Kathetensatz liefert <m>|BC|²=|AB|·|BD|</m> und <m>|AC|²=|AB|·|AD|</m>. Addiert und mit <m>A−D−B</m> (also <m>|BD|+|AD|=|AB|</m>): <m>|BC|²+|AC|²=|AB|·(|BD|+|AD|)=|AB|²</m>. Das ist <m>a²+b²=c²</m> (Satz 9.4.6)."},
  {q:"Beweisen Sie die Umkehrung des Satzes des Pythagoras.",a:"Gelte <m>a²+b²=c²</m>. Konstruiere ein Vergleichsdreieck mit denselben Kathetenlängen <m>a,b</m>, aber rechtem Winkel dazwischen; seine Hypotenuse hat nach Pythagoras die Länge <m>√(a²+b²)=c</m>. Beide Dreiecke stimmen in allen drei Seiten überein, sind nach sss kongruent – also ist auch das Ausgangsdreieck bei <m>C</m> rechtwinklig."}
 ],
 links:[18,20,17]
},
/* ============================== THEMA 20 ============================== */
{
 id:20, chapter:"Kap. 9.5–9.6", scope:"breit", school:true,
 title:"Trigonometrische Funktionen",
 subs:["Geometrische Definition der trigonometrischen Funktionen","Grundlegende Eigenschaften","Kosinus- und Sinussatz","Monotonie- und Surjektivitätseigenschaften","Additionstheoreme"],
 overview:"Breites Thema: von der geometrischen Definition (9.5.1) zu Sinus-/Kosinussatz (9.5.2) und Additionstheoremen (9.6.1). Dazu Monotonie/Surjektivität (9.6.2) mit Umkehrfunktionen (9.6.3). Verbindung von Geometrie und Analysis.",
 defs:[
  {t:"sin, cos, tan (9.5.1)",b:"Am rechtwinkligen Dreieck: <m>sinα=Gegenkathete/Hypotenuse</m>, <m>cosα=Ankathete/Hypotenuse</m>, <m>tanα=sin/cos</m>. Wohldefiniert, weil ähnliche Dreiecke gleiche Verhältnisse haben. Erweiterung über den Einheitskreis."},
  {t:"Grundbeziehung",b:"<m>sin²α+cos²α=1</m> (Pythagoras am Einheitskreis)."}
 ],
 plain:[
  {t:"Sinus / Kosinus",e:"Verhältniszahlen im rechtwinkligen Dreieck: Sinus = Gegenkathete/Hypotenuse, Kosinus = Ankathete/Hypotenuse. Am Einheitskreis sind es einfach die Höhe und die Breite des Punktes."},
  {t:"Sinussatz / Kosinussatz",e:"Formeln, mit denen man in beliebigen (auch nicht rechtwinkligen) Dreiecken fehlende Seiten und Winkel ausrechnet."}
 ],
 theorems:[
  {n:"Kosinussatz (9.5.10)",s:"<m>c²=a²+b²−2ab·cosγ</m>. Für <m>γ=π/2</m> wird daraus Pythagoras.",idea:"Höhe von <m>A</m> auf <m>BC</m> mit Fußpunkt <m>D</m>; mit <m>b²=h²+q²</m>, <m>c²=h²+p²</m> und <m>q=b·cosγ</m> folgt nach Fallunterscheidung <m>c²=a²+b²−2ab·cosγ</m>."},
  {n:"Sinussatz (9.5.x)",s:"<m>a/sinα=b/sinβ=c/sinγ=2R</m> (<m>R</m> Umkreisradius).",idea:"Höhe <m>h_c=b·sinα=a·sinβ</m> gleichsetzen ⇒ <m>a/sinα=b/sinβ</m>. Der <m>2R</m>-Zusammenhang über den Peripheriewinkelsatz (Thema 23)."},
  {n:"Monotonie/Surjektivität & Additionstheoreme (9.6)",s:"<m>sin</m> ist auf <m>[−π/2,π/2]</m> streng monoton wachsend, <m>cos</m> auf <m>[0,π]</m> fallend (Umkehrfunktionen 9.6.3). Additionstheoreme: <m>sin(α±β)=sinα cosβ ± cosα sinβ</m> usw.",idea:"Geometrisch über Projektionen am Einheitskreis; Monotonie + Surjektivität liefern <m>arcsin, arccos</m>."}
 ],
 sketch:{svg:`<svg viewBox="0 0 340 200" width="360">
   <circle cx="110" cy="120" r="70" class="s-con"/>
   <line x1="40" y1="120" x2="180" y2="120" class="s-line"/><line x1="110" y1="50" x2="110" y2="190" class="s-line"/>
   <line x1="110" y1="120" x2="163" y2="74" class="s-res"/>
   <line x1="163" y1="74" x2="163" y2="120" class="s-line"/>
   <path d="M135 120 A25 25 0 0 0 148 98" class="s-res"/><text x="140" y="114" class="s-lbl-r">α</text>
   <text x="167" y="100" class="s-lbl">sinα</text><text x="128" y="136" class="s-lbl">cosα</text>
   <text x="110" y="196" text-anchor="middle" class="s-lbl-b">Einheitskreis: (cosα, sinα)</text>
   <text x="255" y="90" class="s-lbl-r">sin²α+cos²α=1</text>
   <text x="250" y="120" class="s-lbl-b">a/sinα = 2R</text>
   <text x="248" y="150" class="s-lbl-b">c²=a²+b²−2ab·cosγ</text>
 </svg>`,cap:"Geometrische Definition am Einheitskreis, Basis für Sinus- und Kosinussatz."},
 focus:[
  "Wohldefiniertheit über <strong>Ähnlichkeit</strong> begründen (Verhältnisse unabhängig von der Dreiecksgröße).",
  "Kosinussatz (9.5.10, verallgemeinerter Pythagoras) und Sinussatz je mit Beweisidee.",
  "Kosinussatz für <m>γ=90°</m> → Pythagoras: schöne Einordnung.",
  "Monotonie/Surjektivität (9.6.2) ⇒ Umkehrfunktionen (9.6.3); Additionstheoreme geometrisch motivieren."
 ],
 nachfr:[
  {q:"Beweisen Sie den Kosinussatz.",a:"Sei <m>D</m> der Fußpunkt des Lotes von <m>A</m> auf <m>BC</m>, <m>h=|AD|</m>, <m>p=|BD|</m>, <m>q=|CD|</m>. Nach Pythagoras <m>b²=h²+q²</m> und <m>c²=h²+p²</m>, also <m>c²=b²−q²+p²</m>. Im Fall <m>B−D−C</m> gilt <m>p=a−q</m> und <m>q=b·cosγ</m>; Einsetzen liefert <m>c²=a²+b²−2ab·cosγ</m> (die anderen Lagen von <m>D</m> ergeben dasselbe)."},
  {q:"Zeigen Sie den Grenzfall Pythagoras und beweisen Sie den Sinussatz.",a:"Für <m>γ=90°</m> ist <m>cosγ=0</m>, der Kosinussatz wird zu <m>c²=a²+b²</m>. Sinussatz: Die Höhe <m>h_c</m> von <m>C</m> auf <m>AB</m> erfüllt <m>h_c=b·sinα=a·sinβ</m>, also <m>a/sinα=b/sinβ</m>; analog die dritte Seite. Der gemeinsame Wert ist <m>2R</m> (Umkreisdurchmesser) über den Peripheriewinkelsatz."},
  {q:"Warum sind sin und cos auf geeigneten Intervallen umkehrbar?",a:"Auf <m>[−π/2,π/2]</m> ist <m>sin</m> streng monoton wachsend mit Bild <m>[−1,1]</m>; auf <m>[0,π]</m> ist <m>cos</m> streng monoton fallend mit Bild <m>[−1,1]</m> (9.6.2). Streng monotone, surjektive Funktionen sind bijektiv, also umkehrbar – daraus entstehen <m>arcsin</m> und <m>arccos</m> (9.6.3)."}
 ],
 links:[19,23,18]
},
/* ============================== THEMA 21 ============================== */
{
 id:21, chapter:"Kap. 10.1", scope:"eng", school:true,
 title:"Lagebeziehungen von Kreis und Gerade",
 subs:["Passanten, Sekanten, Tangenten","Satz zu den Berührradien","Tangentenabschnittssatz"],
 overview:"Enges Kreisthema. Klassifikation Gerade–Kreis über den Abstand (10.1.3), der <strong>Berührradius</strong> (Tangente ⊥ Radius) und der Tangentenabschnittssatz. Grundlage für In- und Umkreise (10.1.4).",
 defs:[
  {t:"Passante / Tangente / Sekante (10.1.3)",b:"Gerade mit Abstand <m>d(M,g)</m> zum Mittelpunkt: <m>d>r</m> Passante (0 Punkte), <m>d=r</m> Tangente (1 Berührpunkt), <m>d<r</m> Sekante (2 Punkte)."}
 ],
 plain:[
  {t:"Tangente / Sekante / Passante",e:"Eine Gerade kann einen Kreis streifen (Tangente, ein Berührpunkt), durchschneiden (Sekante, zwei Punkte) oder verfehlen (Passante, kein Punkt)."},
  {t:"Berührradius",e:"Der Radius zum Berührpunkt trifft die Tangente im rechten Winkel – die Tangente „lehnt\u201c rechtwinklig am Radius an."}
 ],
 theorems:[
  {n:"Klassifikation Gerade–Kreis (10.1.3)",s:"Eine Gerade ist Passante, Tangente oder Sekante, je nachdem ob <m>d(M,g)>r</m>, <m>=r</m> oder <m><r</m>.",idea:"Lot von <m>M</m> auf <m>g</m> mit Fußpunkt <m>F</m>, <m>d=|MF|</m>; für <m>P∈g</m> ist <m>|MP|²=d²+|FP|²</m>. Lösbarkeit von <m>|FP|²=r²−d²</m> entscheidet die Anzahl."},
  {n:"Berührradiussatz",s:"Eine Tangente steht im Berührpunkt <strong>senkrecht</strong> auf dem Radius (und umgekehrt).",idea:"Der Berührpunkt ist der nächstgelegene Kreispunkt zu <m>M</m>; der kürzeste Abstand Punkt–Gerade wird auf dem Lot erreicht ⇒ Radius = Lot ⇒ ⊥."},
  {n:"Tangentenabschnittssatz",s:"Die beiden Tangentenabschnitte von einem äußeren Punkt <m>P</m> sind gleich lang: <m>|PT₁|=|PT₂|</m>.",idea:"Die Dreiecke <m>MPT₁</m>, <m>MPT₂</m> sind rechtwinklig (Berührradius), haben <m>MP</m> gemeinsam und <m>|MT₁|=|MT₂|=r</m> ⇒ kongruent (Ssw/Pythagoras) ⇒ gleiche Tangentenlängen."}
 ],
 sketch:{svg:`<svg viewBox="0 0 340 200" width="360">
   <circle cx="120" cy="110" r="60" class="s-line"/><circle cx="120" cy="110" r="3.5" class="s-pt"/><text x="108" y="106" class="s-lbl">M</text>
   <circle cx="290" cy="110" r="4" class="s-pt-r"/><text x="296" y="114" class="s-lbl-r">P</text>
   <line x1="290" y1="110" x2="158" y2="62" class="s-res"/><line x1="290" y1="110" x2="158" y2="158" class="s-res"/>
   <line x1="120" y1="110" x2="158" y2="62" class="s-con"/><line x1="120" y1="110" x2="158" y2="158" class="s-con"/>
   <circle cx="158" cy="62" r="3.5" class="s-pt"/><circle cx="158" cy="158" r="3.5" class="s-pt"/>
   <text x="162" y="56" class="s-lbl">T₁</text><text x="162" y="172" class="s-lbl">T₂</text>
   <text x="170" y="194" text-anchor="middle" class="s-lbl-b">|PT₁|=|PT₂| · Radius ⊥ Tangente</text>
 </svg>`,cap:"Berührradius und gleich lange Tangentenabschnitte von einem äußeren Punkt."},
 focus:[
  "Klassifikation Gerade–Kreis strikt über <strong>Abstand vs. Radius</strong> begründen (Lot + Pythagoras, 10.1.3).",
  "Berührradiussatz als <strong>Minimalabstands</strong>-Argument – sehr elegant.",
  "Tangentenabschnittssatz über zwei kongruente rechtwinklige Dreiecke (Ssw).",
  "Anwendung: Inkreis eines Dreiecks über gleiche Tangentenlängen (10.1.4; Brücke zu Thema 22)."
 ],
 nachfr:[
  {q:"Beweisen Sie, dass die Tangente senkrecht auf dem Berührradius steht.",a:"Der Berührpunkt <m>T</m> ist der einzige gemeinsame Punkt und damit der Punkt der Geraden mit kleinstem Abstand zu <m>M</m> (jeder andere läge weiter als <m>r</m>). Der kürzeste Abstand Punkt–Gerade wird auf dem Lot erreicht. Also ist <m>MT</m> das Lot auf die Tangente, d. h. der Radius <m>MT</m> steht senkrecht auf ihr."},
  {q:"Beweisen Sie den Tangentenabschnittssatz.",a:"Von einem äußeren Punkt <m>P</m> gehen zwei Tangenten mit Berührpunkten <m>T₁,T₂</m>. Die Dreiecke <m>MPT₁</m> und <m>MPT₂</m> sind bei <m>T₁,T₂</m> rechtwinklig (Berührradius), haben die gemeinsame Hypotenuse <m>MP</m> und gleiche Katheten <m>|MT₁|=|MT₂|=r</m>. Nach Pythagoras (bzw. Ssw) sind sie kongruent, also <m>|PT₁|=|PT₂|</m>."},
  {q:"Wie viele Tangenten gibt es von einem inneren/äußeren Punkt?",a:"Von einem Punkt außerhalb des Kreises genau zwei, von einem Punkt auf dem Kreis genau eine (im Berührpunkt), von einem inneren Punkt keine – jede Gerade durch einen inneren Punkt ist Sekante."}
 ],

 overview:"Kreisthema um Sehnen: Sehnenvierecke (Umkreis, 10.3.2) und Tangentenvierecke (Inkreis, 10.3.3) mit ihren charakteristischen Winkel- bzw. Seitenbedingungen, plus der Sekanten-/Sehnenabschnittssatz (10.4.6/10.4.7).",
 defs:[
  {t:"Sehne",b:"Strecke zwischen zwei Kreispunkten. Die Mittelsenkrechte jeder Sehne geht durch den Mittelpunkt."},
  {t:"Sehnen- / Tangentenviereck (10.3)",b:"<strong>Sehnenviereck</strong>: alle Ecken auf einem Kreis (Umkreis). <strong>Tangentenviereck</strong>: alle Seiten berühren einen Kreis (Inkreis)."}
 ],
 plain:[
  {t:"Sehne",e:"Eine gerade Verbindung zwischen zwei Punkten auf dem Kreisrand – wie die Saite („Sehne\u201c) eines Bogens."},
  {t:"Sehnen-/Tangentenviereck",e:"Sehnenviereck: alle vier Ecken liegen auf einem Kreis. Tangentenviereck: alle vier Seiten berühren einen inneren Kreis."},
  {t:"Sehnenabschnitt / Potenz",e:"Teilt man zwei Sehnen an ihrem Schnittpunkt, ist das Produkt der Teilstücke bei beiden gleich – eine Kennzahl dafür, wie der Punkt zum Kreis liegt."}
 ],
 theorems:[
  {n:"Sehnenviereckssatz (10.3.2)",s:"Ein konvexes Viereck besitzt genau dann einen Umkreis, wenn die Summe gegenüberliegender Innenwinkel <m>π</m> beträgt.",idea:"„⇒\u201c über den Peripheriewinkelsatz (gegenüberliegende Winkel sehen komplementäre Bögen). „⇐\u201c über die Umkehrung (Widerspruch, falls die vierte Ecke nicht auf dem Kreis liegt)."},
  {n:"Tangentenviereckssatz (10.3.3)",s:"Ein konvexes Viereck besitzt genau dann einen Inkreis, wenn die Summen gegenüberliegender Seiten gleich sind: <m>a+c=b+d</m>.",idea:"Tangentenabschnittssatz: jede Ecke liefert zwei gleiche Tangentenlängen; Summieren der Seiten ergibt die Gleichheit."},
  {n:"Sekanten-/Sehnenabschnittssatz (10.4.6/10.4.7)",s:"Für zwei Sekanten durch <m>S</m>: <m>|SR₁|·|SQ₁|=|SR₂|·|SQ₂|</m>; für zwei Sehnen durch einen inneren Punkt analog.",idea:"Peripheriewinkel liefern ähnliche Dreiecke ⇒ Verhältnisgleichung ⇒ Produktgleichheit (Potenz des Punktes)."}
 ],
 sketch:{svg:`<svg viewBox="0 0 340 200" width="360">

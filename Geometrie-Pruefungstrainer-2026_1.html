 focus:[
  "Zwei Charakterisierungen gegenüberstellen: <strong>Sehnenviereck ⇔ Gegenwinkel = π</strong>, <strong>Tangentenviereck ⇔ a+c=b+d</strong>.",
  "Sehnenabschnittssatz über <strong>ähnliche Dreiecke</strong> (Peripheriewinkel) beweisen.",
  "Begriff <strong>Potenz eines Punktes</strong> nennen (innerer/äußerer Fall, Sekante/Sehne).",
  "Verbindung zu Thema 23 (Peripheriewinkel) und 21 (Tangentenabschnitt)."
 ],
 nachfr:[
  {q:"Beweisen Sie den Sehnenviereckssatz.",a:"Sei <m>ABCD</m> ein konvexes Viereck mit Umkreis. Die Winkel bei <m>A</m> und <m>C</m> sind Peripheriewinkel über den beiden komplementären Bögen <m>BD</m>. Nach Folgerung 10.4.2 ergänzen sich Peripheriewinkel über komplementären Bögen zum gestreckten Winkel, also <m>α+γ=π</m>. Umkehrung: Gilt <m>α+γ=π</m>, muss <m>D</m> auf dem Umkreis von <m>ABC</m> liegen (sonst Widerspruch über die Umkehrung des Peripheriewinkelsatzes)."},
  {q:"Beweisen Sie den Sehnenabschnittssatz über Ähnlichkeit.",a:"Zwei Sehnen <m>AB,CD</m> schneiden sich in <m>S</m>. Die Peripheriewinkel <m>∠A=∠D</m> (über Bogen <m>BC</m>) und die Scheitelwinkel bei <m>S</m> stimmen überein ⇒ <m>SAC∼SDB</m>. Aus <m>|SA|:|SD|=|SC|:|SB|</m> folgt <m>|SA|·|SB|=|SC|·|SD|</m> – für jede Sehne durch <m>S</m> gleich (Potenz von <m>S</m>). Der Sekantenabschnittssatz 10.4.6 ist der äußere Fall."},
  {q:"Charakterisieren Sie Tangentenvierecke.",a:"Ein konvexes Viereck besitzt genau dann einen Inkreis, wenn <m>a+c=b+d</m> (Satz 10.3.3). Grund ist der Tangentenabschnittssatz: von jeder Ecke sind die beiden Tangentenstücke zum Inkreis gleich lang; summiert man die Seiten geschickt, ergeben beide Summen dieselbe Gesamtlänge der Tangentenstücke."}
 ],
 links:[21,23,18]
},
/* ============================== THEMA 23 ============================== */
{
 id:23, chapter:"Kap. 10.2, 10.4", scope:"mittel", school:true,
 title:"Winkelsätze am Kreis",
 subs:["Kreisbögen","Peripheriewinkelsatz","Satz des Thales und Umkehrungen","Peripherie-Zentriwinkelsatz","Sehnen-Tangentenwinkelsatz"],
 overview:"Die Kreiswinkel-Familie. Herzstück ist der <strong>Peripheriewinkelsatz</strong> (10.4.1), mit Thales (10.2.7) als Spezialfall und dem Zentriwinkelsatz (10.4.5) als Verdopplung; dazu der Sehnen-Tangentenwinkelsatz (10.4.8).",
 defs:[
  {t:"Peripheriewinkel (10.2.5)",b:"Winkel <m>∠APB</m> mit Scheitel <m>P</m> auf dem zum Bogen <m>b</m> komplementären Bogen; Schenkel durch die Bogenendpunkte."},
  {t:"Zentriwinkel (10.4.3)",b:"Orientierter Winkel <m>∠P₁MP₂</m> am Mittelpunkt über demselben Bogen – er „sieht\u201c seinen Bogen."}
 ],
 plain:[
  {t:"Peripheriewinkel",e:"Der Winkel, unter dem man vom Kreisrand aus eine feste Sehne „sieht\u201c. Erstaunlich: von jedem Randpunkt über demselben Bogen ist er gleich groß."},
  {t:"Zentriwinkel",e:"Der Winkel zur selben Sehne, aber vom Mittelpunkt aus gesehen – er ist stets doppelt so groß wie der Peripheriewinkel."},
  {t:"Satz des Thales",e:"Ist die längste Seite eines Dreiecks der Durchmesser eines Kreises und liegt die Spitze auf dem Kreis, so ist der Winkel an der Spitze immer ein rechter (90°)."}
 ],
 theorems:[
  {n:"Peripheriewinkelsatz (10.4.1)",s:"Alle Peripheriewinkel über demselben Kreisbogen sind gleich groß.",idea:"Über den Sehnenviereckssatz: Für Peripheriepunkte <m>R,R'</m> über <m>b</m> und <m>S</m> über dem komplementären Bogen sind <m>PRQS</m> und <m>PR'QS</m> Sehnenvierecke ⇒ <m>|∠PRQ|+|∠QSP|=π=|∠PR'Q|+|∠QSP|</m> ⇒ <m>|∠PR'Q|=|∠PRQ|</m>."},
  {n:"Zentriwinkelsatz (10.4.5)",s:"Jeder Peripheriewinkel ist halb so groß wie der zugehörige Zentriwinkel über demselben Bogen.",idea:"Radius <m>MP</m> einzeichnen: die Teildreiecke sind gleichschenklig (Radien); Basiswinkelsatz + Außenwinkelsatz liefern die Verdopplung (Fallunterscheidung nach Lage von <m>M</m>)."},
  {n:"Satz des Thales & Umkehrung (10.2.7 / 10.2.4)",s:"Jeder Peripheriewinkel über einem Halbkreisbogen ist ein rechter Winkel. Umkehrung: <m>∠ACB=π/2</m> ⇒ <m>C</m> auf dem Thaleskreis über <m>AB</m>.",idea:"Mit <m>|MA|=|MB|=|MC|</m> sind die Teildreiecke gleichschenklig; Basiswinkelsatz und Innenwinkelsatz geben <m>2α+2β=π</m>, also <m>|∠ACB|=α+β=π/2</m>."},
  {n:"Sehnen-Tangentenwinkelsatz (10.4.8)",s:"Der Winkel zwischen Sehne und Tangente im Berührpunkt ist so groß wie jeder Peripheriewinkel über der Sehne im entsprechenden Segment (und halb so groß wie der Zentriwinkel).",idea:"Grenzübergang des Peripheriewinkelsatzes bzw. Berührradius (⊥) + Innenwinkelsumme."}
 ],
 sketch:{svg:`<svg viewBox="0 0 340 210" width="360">
   <circle cx="150" cy="115" r="80" class="s-line"/><circle cx="150" cy="115" r="3.5" class="s-pt"/><text x="138" y="112" class="s-lbl">M</text>

 </svg>`,cap:"Zentriwinkelsatz 10.4.5: Zentriwinkel doppelt so groß wie der Peripheriewinkel."},
 focus:[
  "Aufbau: <strong>Sehnenviereckssatz → Peripheriewinkelsatz 10.4.1 → Zentriwinkelsatz 10.4.5 → Thales (Spezialfall) → Sehnen-Tangentenwinkel</strong>.",
  "Peripheriewinkelsatz im 26er über <strong>Sehnenvierecke</strong> beweisen (nicht nur über Zentriwinkel).",
  "Thales 10.2.7 als Peripheriewinkel über dem Halbkreis; Umkehrungen (10.2.4) nicht vergessen.",
  "Anwendungen: Ortsbogen (Fasskreis), Sinussatz-Bezug <m>2R</m>, Konstruktion rechter Winkel."
 ],
 nachfr:[
  {q:"Beweisen Sie den Peripheriewinkelsatz.",a:"Sei <m>b</m> ein Bogen mit Endpunkten <m>P,Q</m>, <m>b'</m> der komplementäre Bogen, <m>R,R'</m> Peripheriepunkte über <m>b</m>, <m>S</m> ein Peripheriepunkt über <m>b'</m>. Dann sind <m>PRQS</m> und <m>PR'QS</m> konvexe Sehnenvierecke. Nach dem Sehnenviereckssatz gelten <m>|∠PRQ|+|∠QSP|=π</m> und <m>|∠PR'Q|+|∠QSP|=π</m>. Subtraktion liefert <m>|∠PR'Q|=|∠PRQ|</m> – alle Peripheriewinkel über <m>b</m> sind gleich."},
  {q:"Wie folgt der Satz des Thales?",a:"Liegt <m>AB</m> auf einem Durchmesser, ist <m>M</m> der Mittelpunkt und <m>|MA|=|MB|=|MC|</m> für jeden Peripheriepunkt <m>C</m>. Die Teildreiecke <m>MAC</m>, <m>MBC</m> sind gleichschenklig; mit dem Basiswinkelsatz und dem Dreiecksinnenwinkelsatz gilt <m>2α+2β=π</m>, also <m>|∠ACB|=α+β=π/2</m>. Jeder Punkt <m>C</m> auf dem Halbkreis sieht <m>AB</m> unter einem rechten Winkel (Satz 10.2.7)."},
  {q:"Beweisen Sie die Umkehrung des Satzes des Thales.",a:"Gelte <m>∠ACB=π/2</m>; sei <m>k</m> der Kreis mit Durchmesser <m>AB</m> und Mittelpunkt <m>M</m>. Läge <m>C</m> innerhalb von <m>k</m>, wäre der Winkel größer als <m>π/2</m>, außerhalb kleiner (Vergleich mit einem Kreispunkt über den Außenwinkelsatz). Da er genau <m>π/2</m> ist, muss <m>C</m> auf <m>k</m> liegen – dem Thaleskreis (10.2.4)."}
 ],

}

   {t:"parallel", f:"Zwei Geraden heißen parallel, wenn sie gleich sind oder keine gemeinsamen Punkte haben (Def. 6.1.4).", e:"Zwei Geraden, die einander nie schneiden (oder identisch sind) – sie halten überall denselben Abstand."},
   {t:"absolute Geometrie", f:"Axiome Inz-1/2/3, Metrik, Ger-1, Ger-2, HE, K und alle Folgerungen – ohne Parallelenaxiom.", e:"Der gemeinsame Kern, der gilt, egal ob die Parallelenregel stimmt oder nicht – die Basis, die euklidische und nicht-euklidische Geometrie teilen."},
   {t:"Axiom P (Parallelenaxiom)", f:"Zu jeder Geraden <m>g</m> und jedem Punkt <m>P</m> gibt es genau eine zu <m>g</m> parallele Gerade durch <m>P</m>.", e:"Die berühmte Regel: Durch einen Punkt neben einer Geraden geht genau eine Parallele. Das „genau eine“ (Eindeutigkeit) ist der entscheidende Zusatz."},
   {t:"euklidische Ebene", f:"Absolute Geometrie plus Axiom P (6.2.1).", e:"Die Schulgeometrie: absolute Geometrie mit Parallelenaxiom. Hier gilt z. B. die Innenwinkelsumme 180°."},
   {t:"hyperbolische Ebene", f:"Absolute Geometrie mit Negation von P (mehr als eine Parallele) (6.2.2).", e:"Eine nicht-euklidische Welt, in der es durch einen Punkt mehrere Parallelen gibt – die Innenwinkelsumme ist dort kleiner als 180°."}
  ]
 }
];

const GROUPS = [
  {name:"Dreieck & Kongruenz", ids:[6,7,8,9,10]},
  {name:"Parallelen & Transversalen", ids:[13,14]},
  {name:"Ähnlichkeit & Pythagoras", ids:[17,18,19,20]},
  {name:"Geometrie am Kreis", ids:[21,22,23]}
];
const TOTAL = TOPICS.length;

/* ===================== STATE ===================== */
const KEY = "koksch-geo26-fortschritt";
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){ done = {}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(done)); }catch(e){} }
let current = TOPICS[0].id;
const byId = id => TOPICS.find(t=>t.id===id);

/* ===================== NAV ===================== */
const nav = document.getElementById('nav');
function buildNav(){
  nav.innerHTML = "";
  const gh = document.createElement('div');
  gh.className='navgroup'; gh.textContent='Fundament'; nav.appendChild(gh);
  const gItem = document.createElement('div');
  gItem.className='navitem special'+(current==='grund'?' active':'');
  gItem.dataset.id='grund';
  gItem.dataset.search=('grundbegriffe fundament axiome '+GRUND.map(g=>g.gruppe+' '+g.begriffe.map(b=>b.t).join(' ')).join(' ')).toLowerCase();
  gItem.innerHTML='<span class="navnum">§</span><span class="navtitle">Grundbegriffe</span><span class="navcheck"></span>';
  gItem.addEventListener('click',()=>{ showGrundbegriffe(); closeMenu(); });
  nav.appendChild(gItem);
  GROUPS.forEach(g=>{
    const h = document.createElement('div');
    h.className='navgroup'; h.textContent=g.name; nav.appendChild(h);
    g.ids.forEach(id=>{
      const t = byId(id); if(!t) return;
      const item = document.createElement('div');
      item.className='navitem'+(id===current?' active':'')+(done[id]?' done':'');
      item.dataset.id=id;
      item.dataset.search=(t.title+' '+t.subs.join(' ')+' '+t.overview).toLowerCase();
      item.innerHTML=`<span class="navnum">${id}</span><span class="navtitle">${t.title}</span><span class="navcheck">${done[id]?'✓':''}</span>`;
      item.addEventListener('click',()=>{ show(id); closeMenu(); });
      nav.appendChild(item);
    });
  });
}

/* ===================== FORTSCHRITT ===================== */
function updateProgress(){
  const n = TOPICS.filter(t=>done[t.id]).length;
  document.getElementById('progfill').style.width=(n/TOTAL*100)+'%';
  document.getElementById('progcount').textContent=`${n} / ${TOTAL} sicher`;
}

function renderList(arr,fn){ return arr && arr.length ? arr.map(fn).join('') : ''; }

/* ===================== TOPIC ===================== */
function show(id){
  current=id; const t=byId(id);
  document.querySelectorAll('.navitem').forEach(n=>n.classList.toggle('active',+n.dataset.id===id));
  const idx = TOPICS.findIndex(x=>x.id===id);
  const prev = idx>0?TOPICS[idx-1]:null, next = idx<TOPICS.length-1?TOPICS[idx+1]:null;
  const scopeLabel = {breit:"breites Gebiet",eng:"eng — hier (fast) alles wissen",mittel:"mittleres Gebiet"}[t.scope];

  const defs = renderList(t.defs,d=>`<div class="entry"><span class="lbl def">Def</span><span class="name">${d.t}</span><div class="body">${d.b}</div></div>`);
  const plain = renderList(t.plain,p=>`<div class="plainrow"><div class="pt">${p.t}</div><div class="pe">${p.e}</div></div>`);
  const axioms = t.axioms ? renderList(t.axioms,a=>`<div class="entry"><span class="lbl ax">Axiom ${a.n}</span><div class="body inline">${a.b}</div></div>`) : '';
  const saetze = renderList(t.theorems,s=>`<div class="entry"><span class="lbl satz">Satz</span><span class="name">${s.n}</span><div class="body">${s.s}</div>${s.idea?`<details class="idea"><summary>Beweisidee anzeigen</summary><div class="ideabody">${s.idea}</div></details>`:''}</div>`);
  const nachfr = renderList(t.nachfr,n=>`<div class="qa"><div class="q">${n.q}</div><details class="idea answer"><summary>Prüfungsfähige Antwort</summary><div class="ideabody">${n.a}</div></details></div>`);
  const links = renderList(t.links,l=>{const lt=byId(l);return lt?`<span class="linkchip" data-goto="${l}">${l} · ${lt.title.split(',')[0].split(' ').slice(0,3).join(' ')}…</span>`:'';});

  document.getElementById('content').innerHTML = `
   <div class="topic">
     <div class="thead"><div class="tnum">${t.id}</div><h2>${t.title}</h2></div>
     <div class="meta">
       <span class="tag chap">${t.chapter}</span>
       <span class="tag scope-${t.scope}">${scopeLabel}</span>
       ${t.school?'<span class="tag school">★ schulnah — häufiger dran</span>':''}
       ${t.subs.map(s=>`<span class="tag">${s}</span>`).join('')}
     </div>
     <button class="doneBtn ${done[t.id]?'on':''}" id="doneBtn">${done[t.id]?'✓ als sicher markiert':'als „sicher“ markieren'}</button>
     <div class="block"><h3>Überblick</h3><p class="lead">${t.overview}</p></div>
     ${t.sketch?`<div class="block"><h3>Leitskizze</h3><div class="sketch">${t.sketch.svg}<div class="cap">${t.sketch.cap}</div></div></div>`:''}
     ${defs?`<div class="block"><h3>Begriffe & Definitionen</h3>${defs}</div>`:''}
     ${plain?`<div class="block"><h3>In einfachen Worten</h3><div class="plainbox">${plain}</div></div>`:''}
     ${axioms?`<div class="block"><h3>Relevante Axiome</h3>${axioms}</div>`:''}
     ${saetze?`<div class="block"><h3>Zentrale Sätze &amp; Beweisideen</h3>${saetze}</div>`:''}
     <div class="block"><h3>Prüfungsfokus</h3>
       <div class="karte"><h4>So punktest du bei Dr. Koksch</h4><ul>${t.focus.map(f=>`<li>${f}</li>`).join('')}</ul></div>
     </div>
     ${nachfr?`<div class="block"><h3>Mögliche Nachfragen — mit Musterantwort</h3><div class="nachfr">${nachfr}</div></div>`:''}
     ${links?`<div class="block"><h3>Verwandte Themen</h3><div class="links">${links}</div></div>`:''}
     <div class="foot">
       ${prev?`<button class="navbtn prev" data-goto="${prev.id}"><span><span class="dir">◂ Thema ${prev.id}</span>${prev.title.split(',')[0]}</span></button>`:'<span></span>'}
       ${next?`<button class="navbtn next" data-goto="${next.id}"><span><span class="dir">Thema ${next.id} ▸</span>${next.title.split(',')[0]}</span></button>`:'<span></span>'}
     </div>
     <p class="hint">Tastatur: <kbd>←</kbd> / <kbd>→</kbd> blättern · <kbd>m</kbd> als sicher markieren</p>
   </div>`;

  document.getElementById('doneBtn').addEventListener('click',toggleDone);
  document.querySelectorAll('[data-goto]').forEach(el=>el.addEventListener('click',()=>show(+el.dataset.goto)));
  document.querySelector('main').scrollTo({top:0,behavior:'smooth'});
  window.scrollTo({top:0,behavior:'smooth'});
}

function showGrundbegriffe(){
  current='grund';
  document.querySelectorAll('.navitem').forEach(n=>n.classList.toggle('active',n.dataset.id==='grund'));
  const groups = GRUND.map((g,gi)=>{
    const cards = g.begriffe.map(b=>`
      <div class="gb-card">
        <div class="gb-t">${b.t}</div>
        <div class="gb-f">${b.f}</div>
        <div class="gb-e">${b.e}</div>
      </div>`).join('');
    return `<div class="gb-group">
      <h3 class="gb-gh"><span class="gn">${gi+1}</span>${g.gruppe}</h3>
      <p class="gb-intro">${g.intro}</p>
      ${cards}
    </div>`;
  }).join('');

  const first = TOPICS[0];
  document.getElementById('content').innerHTML = `
   <div class="topic">
     <div class="thead"><div class="tnum" style="background:var(--amber)">§</div><h2>Grundbegriffe</h2></div>
     <div class="meta">
       <span class="tag chap">Kap. 2–6 · Fundament</span>
       <span class="tag scope-eng">Vokabular für alle Themen</span>
     </div>
     <div class="block"><h3>Wozu diese Übersicht?</h3>
       <p class="lead">Die Prüfungsthemen 6–23 bauen alle auf demselben <strong>axiomatischen Fundament</strong> auf. Weil die Grundlagen-Themen (1–5) hier nicht als eigene Reiter enthalten sind, sammelt diese Folie die zentralen Grundbegriffe – jeweils mit der <strong>formalen</strong> Fassung aus dem Skript und einer <strong>einfachen Erklärung</strong>. Der rote Streifen zeigt die Reihenfolge, in der die Axiome aufeinander aufbauen.</p></div>
     <div class="block"><h3>Aufbau des Axiomensystems</h3>
       <div class="gb-flow">
         <span class="ax">Inz-1/2/3</span><span class="ar">→</span>
         <span class="ax">Metrik</span><span class="ar">→</span>
         <span class="ax">Ger-1</span><span class="ar">→</span>
         <span class="ax">Ger-2</span><span class="ar">→</span>
         <span class="ax">HE</span><span class="ar">→</span>
         <span class="ax">K</span><span class="ar">→</span>
         <span class="ax">P</span>
       </div>
       <p class="gb-intro" style="margin-left:0;margin-top:8px">Bis einschließlich Axiom K: <strong>absolute Geometrie</strong>. Erst mit Axiom P (Parallelenaxiom) entsteht die <strong>euklidische</strong> Ebene.</p>
     </div>
     ${groups}
     <div class="foot">
       <span></span>
       <button class="navbtn next" data-goto="${first.id}"><span><span class="dir">Thema ${first.id} ▸</span>${first.title.split(',')[0]}</span></button>
     </div>
     <p class="hint">Diese Folie fasst die Grundbegriffe aller Themen zusammen · <kbd>→</kbd> zum ersten Thema</p>
   </div>`;

  document.querySelectorAll('[data-goto]').forEach(el=>el.addEventListener('click',()=>show(+el.dataset.goto)));
  document.querySelector('main').scrollTo({top:0,behavior:'smooth'});
  window.scrollTo({top:0,behavior:'smooth'});
}

function toggleDone(){
  done[current]=!done[current]; save(); updateProgress();
  document.querySelectorAll('.navitem').forEach(n=>{
    const on=!!done[+n.dataset.id];
    n.classList.toggle('done',on);
    n.querySelector('.navcheck').textContent=on?'✓':'';
  });
  const b=document.getElementById('doneBtn');
  b.classList.toggle('on',!!done[current]);
  b.textContent=done[current]?'✓ als sicher markiert':'als „sicher“ markieren';
}

/* ===================== SUCHE ===================== */
document.getElementById('search').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  document.querySelectorAll('.navitem').forEach(n=>{
    n.classList.toggle('hidden', q && !n.dataset.search.includes(q));
  });
  document.querySelectorAll('.navgroup').forEach(g=>{
    let sib=g.nextElementSibling, any=false;
    while(sib && sib.classList.contains('navitem')){ if(!sib.classList.contains('hidden'))any=true; sib=sib.nextElementSibling;}
    g.style.display = q && !any ? 'none':'';
  });
});

/* ===================== RESET ===================== */
document.getElementById('progreset').addEventListener('click',()=>{
  if(confirm('Fortschritt zurücksetzen?')){
    done={}; save(); updateProgress();
    document.querySelectorAll('.navitem').forEach(n=>{n.classList.remove('done');n.querySelector('.navcheck').textContent='';});
    show(current);
  }
});

/* ===================== TASTATUR ===================== */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(current==='grund'){ if(e.key==='ArrowRight')show(TOPICS[0].id); return; }
  const idx=TOPICS.findIndex(x=>x.id===current);
  if(e.key==='ArrowRight' && idx<TOPICS.length-1)show(TOPICS[idx+1].id);
  else if(e.key==='ArrowLeft' && idx>0)show(TOPICS[idx-1].id);
  else if(e.key==='m'||e.key==='M')toggleDone();
});

/* ===================== MOBILE ===================== */
const sidebar=document.getElementById('sidebar'), scrim=document.getElementById('scrim');
function closeMenu(){sidebar.classList.remove('open');scrim.classList.remove('on');}
document.getElementById('menuBtn').addEventListener('click',()=>{sidebar.classList.toggle('open');scrim.classList.toggle('on');});
scrim.addEventListener('click',closeMenu);

/* ===================== INIT ===================== */
buildNav(); updateProgress(); show(current);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schulzentrum Cloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F1F4F3;
  --surface:#FFFFFF;
  --surface-2:#E7ECEA;
  --surface-3:#DCE3E1;
  --border:#D2DAD8;
  --text:#16232A;
  --text-muted:#57696C;
  --text-faint:#8A9B98;
  --accent:#1D8E8C;
  --accent-strong:#136260;
  --accent-soft:#DCEFED;
  --amber:#B96A22;
  --amber-soft:#F5E4D2;
  --danger:#AC4536;
  --danger-soft:#F6DEDA;
  --purple:#63508F;
  --purple-soft:#E4DFF1;
  --focus:#1D8E8C;
  --shadow:0 12px 32px -12px rgba(20,30,28,.28);
  --shadow-sm:0 2px 8px rgba(20,30,28,.10);
  --radius:10px;
  --font-display:'Fraunces',Georgia,serif;
  --font-ui:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11181A;
    --surface:#161F21;
    --surface-2:#1C2729;
    --surface-3:#25322F;
    --border:#2C3B39;
    --text:#E8EFEC;
    --text-muted:#9DB0AC;
    --text-faint:#647573;
    --accent:#4EC0BB;
    --accent-strong:#7DD9D3;
    --accent-soft:#1A3D3B;
    --amber:#E3A15C;
    --amber-soft:#3A2C1B;
    --danger:#E08877;
    --danger-soft:#3B2521;
    --purple:#A995D6;
    --purple-soft:#2B2440;
    --focus:#4EC0BB;
    --shadow:0 12px 32px -12px rgba(0,0,0,.55);
    --shadow-sm:0 2px 8px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#11181A;
  --surface:#161F21;
  --surface-2:#1C2729;
  --surface-3:#25322F;
  --border:#2C3B39;
  --text:#E8EFEC;
  --text-muted:#9DB0AC;
  --text-faint:#647573;
  --accent:#59BBA9;
  --accent-strong:#7FD1C0;
  --accent-soft:#1D3934;
  --amber:#E3A15C;
  --amber-soft:#3A2C1B;
  --danger:#E08877;
  --danger-soft:#3B2521;
  --purple:#A995D6;
  --purple-soft:#2B2440;
  --focus:#59BBA9;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;}
button,input,select{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
h1,h2,h3{font-family:var(--font-display);font-weight:600;text-wrap:balance;margin:0;}
a{color:inherit;}
.app{display:grid;grid-template-columns:250px 1fr;height:100vh;min-height:600px;overflow:hidden;}

/* ---------- Sidebar ---------- */
.sidebar{background:var(--surface-2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 14px;gap:18px;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 8px;}
.brand-mark{width:40px;height:40px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;}
.brand-mark img{width:100%;height:100%;object-fit:cover;display:block;}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1.1;}
.brand-sub{font-size:11px;color:var(--text-faint);margin-top:1px;}

.nav{display:flex;flex-direction:column;gap:2px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:none;background:transparent;color:var(--text-muted);font-size:14px;font-weight:500;text-align:left;width:100%;}
.nav-item svg{width:17px;height:17px;stroke:currentColor;flex:none;}
.nav-item:hover{background:var(--surface-3);color:var(--text);}
.nav-item.active{background:var(--accent-soft);color:var(--accent-strong);}
.nav-count{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-faint);}
.nav-item.active .nav-count{color:var(--accent-strong);}

.sidebar-spacer{flex:1;}

.storage-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 12px;font-size:12px;}
.storage-row{display:flex;justify-content:space-between;color:var(--text-muted);margin-bottom:7px;}
.storage-bar{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;}
.storage-bar > i{display:block;height:100%;background:var(--accent);width:18%;border-radius:3px;}
.storage-plan{margin-top:6px;color:var(--text-faint);font-size:11px;}

.conn-status{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-muted);padding:2px 4px;}
.conn-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;}
.conn-dot.syncing{background:var(--amber);animation:pulse 1.1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
@media (prefers-reduced-motion:reduce){.conn-dot.syncing{animation:none;}}

.reset-link{font-size:11px;color:var(--text-faint);background:none;border:none;text-decoration:underline;text-underline-offset:2px;padding:2px 4px;align-self:flex-start;}
.reset-link:hover{color:var(--text-muted);}

/* ---------- Main ---------- */
.main{display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden;}
.topbar{display:flex;align-items:center;gap:16px;padding:14px 26px;border-bottom:1px solid var(--border);flex:none;}
.crumbs{display:flex;align-items:center;gap:6px;font-size:14.5px;font-weight:500;min-width:0;overflow:hidden;white-space:nowrap;}
.crumb-btn{background:none;border:none;color:var(--text-muted);padding:3px 4px;border-radius:5px;font-weight:500;}
.crumb-btn:last-child,.crumb-btn.current{color:var(--text);}
.crumb-btn:hover{background:var(--surface-2);}
.crumb-sep{color:var(--text-faint);font-size:12px;}

.search-wrap{position:relative;margin-left:auto;width:230px;flex:none;}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--text-faint);}
.search-wrap input{width:100%;padding:8px 10px 8px 32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);}
.search-wrap input:focus{border-color:var(--accent);}

.user-chip{display:flex;align-items:center;gap:9px;padding:4px 6px 4px 4px;border-radius:10px;flex:none;}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;flex:none;font-family:var(--font-ui);}
.user-meta{line-height:1.25;}
.user-name{font-size:13px;font-weight:600;}
.user-role{font-size:11px;color:var(--text-faint);}

.content{flex:1;overflow-y:auto;padding:22px 26px 40px;}

.info-banner{display:flex;align-items:flex-start;gap:12px;background:var(--accent-soft);border:1px solid color-mix(in srgb, var(--accent) 35%, transparent);color:var(--accent-strong);border-radius:var(--radius);padding:12px 14px;font-size:13px;line-height:1.55;margin-bottom:20px;}
.info-banner svg{width:17px;height:17px;flex:none;margin-top:1px;stroke:var(--accent-strong);}
.info-banner button{margin-left:auto;background:none;border:none;color:var(--accent-strong);opacity:.65;flex:none;padding:2px;}
.info-banner button:hover{opacity:1;}

.view-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.view-title{font-size:22px;}
.view-desc{font-size:12.5px;color:var(--text-faint);margin-top:2px;}
.toolbar{display:flex;gap:8px;margin-left:auto;}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;color:var(--text);}
.btn svg{width:15px;height:15px;stroke:currentColor;}
.btn:hover{background:var(--surface-2);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:var(--accent-strong);}
.btn.danger{color:var(--danger);}
.btn.ghost{border-color:transparent;background:none;}
.btn.ghost:hover{background:var(--surface-2);}
.btn.small{padding:6px 10px;font-size:12px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* file grid */
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
.file-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px 12px;display:flex;flex-direction:column;gap:10px;text-align:left;}
.file-card:hover{border-color:var(--accent);box-shadow:var(--shadow-sm);}
.file-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;}
.file-icon{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;}
.file-icon svg{width:20px;height:20px;stroke:var(--accent-strong);}
.chip{font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:.03em;padding:3px 6px;border-radius:5px;}
.file-name{font-size:13px;font-weight:600;line-height:1.35;word-break:break-word;}
.file-open{position:absolute;inset:0;border-radius:var(--radius);}
.file-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text-faint);position:relative;z-index:1;}
.file-sync{display:flex;align-items:center;gap:4px;}
.file-sync svg{width:11px;height:11px;stroke:var(--accent);}
.more-btn{position:relative;z-index:2;background:none;border:none;padding:4px;border-radius:6px;color:var(--text-faint);}
.more-btn:hover{background:var(--surface-2);color:var(--text);}
.more-btn svg{width:16px;height:16px;stroke:currentColor;}
.shared-by{font-size:10.5px;color:var(--text-faint);position:relative;z-index:1;}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:60px 20px;color:var(--text-faint);text-align:center;}
.empty-state svg{width:34px;height:34px;stroke:var(--text-faint);margin-bottom:4px;}
.empty-state b{color:var(--text-muted);font-weight:600;}

/* popover menu */
.popover{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);padding:5px;min-width:172px;}
.popover button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border:none;background:none;border-radius:6px;font-size:13px;text-align:left;color:var(--text);}
.popover button svg{width:14px;height:14px;stroke:currentColor;}
.popover button:hover{background:var(--surface-2);}
.popover button.danger{color:var(--danger);}
.popover hr{border:none;border-top:1px solid var(--border);margin:4px 2px;}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,20,20,.45);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px;}
.modal{background:var(--surface);border-radius:14px;border:1px solid var(--border);box-shadow:var(--shadow);width:100%;max-width:420px;padding:20px 20px 18px;max-height:88vh;overflow-y:auto;}
.modal h3{font-size:17px;margin-bottom:14px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--border);background:var(--bg);}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
.field textarea{resize:vertical;min-height:56px;font-family:inherit;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.link-copy{display:flex;gap:6px;}
.link-copy input{font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted);}
.people-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
.person-row{display:flex;align-items:center;gap:9px;font-size:12.5px;}
.person-row .avatar{width:26px;height:26px;font-size:10.5px;}
.person-row .pname{font-weight:600;}
.person-row .prole{color:var(--text-faint);font-size:11px;margin-left:auto;}
.cat-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

/* calendar */
.cal-wrap{display:grid;grid-template-columns:1fr 240px;gap:20px;align-items:start;}
.cal-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.cal-nav button{background:var(--surface);border:1px solid var(--border);border-radius:7px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;}
.cal-nav button svg{width:15px;height:15px;stroke:var(--text-muted);}
.cal-nav button:hover{background:var(--surface-2);}
.cal-month{font-family:var(--font-display);font-size:18px;font-weight:600;min-width:150px;}
.cal-today-btn{margin-left:6px;}
.weekday-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
.weekday-row span{font-size:10.5px;font-weight:600;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;text-align:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:88px;gap:6px;overflow-x:auto;}
.cal-day{border:1px solid var(--border);border-radius:9px;background:var(--surface);padding:6px 6px;display:flex;flex-direction:column;gap:3px;text-align:left;overflow:hidden;}
.cal-day:hover{border-color:var(--accent);}
.cal-day.out{opacity:.4;}
.cal-day.today{border-color:var(--accent);background:var(--accent-soft);}
.cal-daynum{font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted);font-weight:500;}
.cal-day.today .cal-daynum{color:var(--accent-strong);font-weight:700;}
.cal-evt{font-size:10px;padding:2px 5px;border-radius:4px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;}
.cal-more{font-size:9.5px;color:var(--text-faint);padding:0 5px;}

.side-panel{display:flex;flex-direction:column;gap:14px;}
.panel-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.panel-box h4{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);font-weight:700;margin-bottom:10px;}
.upcoming-item{display:flex;gap:9px;padding:7px 0;border-top:1px solid var(--border);}
.upcoming-item:first-child{border-top:none;padding-top:0;}
.up-date{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);width:34px;flex:none;line-height:1.3;padding-top:1px;}
.up-title{font-size:12.5px;font-weight:600;line-height:1.3;}
.up-time{font-size:11px;color:var(--text-faint);}
.legend{display:flex;flex-direction:column;gap:7px;}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);}

.day-events{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px;}
.day-evt-row{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;}
.day-evt-row .evt-time{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);width:44px;flex:none;padding-top:1px;}
.day-evt-row .evt-title{font-size:13px;font-weight:600;}
.day-evt-row .evt-cat{font-size:10.5px;color:var(--text-faint);margin-top:1px;}
.day-evt-row .del-evt{margin-left:auto;background:none;border:none;color:var(--text-faint);padding:3px;}
.day-evt-row .del-evt:hover{color:var(--danger);}
.day-evt-row .del-evt svg{width:14px;height:14px;stroke:currentColor;}

/* dropzone overlay */
.dropzone{position:fixed;inset:0;background:rgba(31,111,100,.12);border:3px dashed var(--accent);z-index:90;display:none;align-items:center;justify-content:center;pointer-events:none;}
.dropzone.active{display:flex;}
.dropzone-inner{background:var(--surface);padding:22px 30px;border-radius:14px;box-shadow:var(--shadow);text-align:center;}
.dropzone-inner svg{width:30px;height:30px;stroke:var(--accent);margin-bottom:8px;}
.dropzone-inner p{font-weight:600;font-size:14px;}

/* toast */
.toast-stack{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:var(--text);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:12.5px;font-weight:500;box-shadow:var(--shadow);opacity:0;transform:translateY(6px);transition:opacity .18s ease,transform .18s ease;}
.toast.show{opacity:1;transform:translateY(0);}

.list-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.list-toggle button{padding:7px 9px;background:var(--surface);border:none;border-left:1px solid var(--border);}
.list-toggle button:first-child{border-left:none;}
.list-toggle button.active{background:var(--accent-soft);color:var(--accent-strong);}
.list-toggle svg{width:14px;height:14px;stroke:currentColor;}

.file-grid.list-mode{grid-template-columns:1fr;gap:0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.file-grid.list-mode .file-card{flex-direction:row;align-items:center;border:none;border-bottom:1px solid var(--border);border-radius:0;padding:9px 12px;}
.file-grid.list-mode .file-card:last-child{border-bottom:none;}
.file-grid.list-mode .file-icon{width:30px;height:30px;}
.file-grid.list-mode .file-icon svg{width:16px;height:16px;}
.file-grid.list-mode .file-top{flex:1;min-width:0;}
.file-grid.list-mode .file-meta{flex:none;width:190px;justify-content:flex-start;gap:16px;}
.file-grid.list-mode .shared-by{display:none;}

.seg-control{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.seg-btn{flex:1;padding:8px 8px;background:var(--surface);border:none;border-left:1px solid var(--border);font-size:11.5px;font-weight:600;color:var(--text-muted);line-height:1.3;}
.seg-btn:first-child{border-left:none;}
.seg-btn.active{background:var(--accent-soft);color:var(--accent-strong);}
.note-box{font-size:11.5px;color:var(--text-faint);line-height:1.55;background:var(--surface-2);border-radius:7px;padding:9px 10px;margin-top:8px;}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.switch{position:relative;width:38px;height:22px;border-radius:11px;background:var(--surface-3);border:1px solid var(--border);flex:none;padding:0;}
.switch i{position:absolute;top:1px;left:1px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-sm);transition:transform .15s ease;display:block;}
.switch.on{background:var(--accent);border-color:var(--accent);}
.switch.on i{transform:translateX(16px);background:#fff;}
.embed-box textarea{width:100%;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);padding:8px 10px;border-radius:7px;border:1px solid var(--border);background:var(--bg);resize:vertical;min-height:64px;}
.public-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--accent-strong);background:var(--accent-soft);padding:4px 9px;border-radius:20px;margin-left:10px;vertical-align:middle;}
.public-badge svg{width:12px;height:12px;stroke:currentColor;}

.viewer-overlay{position:fixed;inset:0;background:rgba(15,20,20,.55);display:flex;align-items:center;justify-content:center;z-index:85;padding:24px;}
.viewer-modal{background:var(--surface);border-radius:14px;border:1px solid var(--border);box-shadow:var(--shadow);width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;}
.viewer-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);}
.viewer-head .file-name{font-size:14px;}
.viewer-head button{margin-left:auto;background:none;border:none;color:var(--text-faint);padding:4px;}
.viewer-head button svg{width:16px;height:16px;stroke:currentColor;}
.lock-badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--danger);background:var(--danger-soft);padding:3px 8px;border-radius:20px;flex:none;}
.lock-badge svg{width:11px;height:11px;stroke:currentColor;}
.doc-preview{position:relative;flex:1;overflow:hidden;background:var(--surface-2);padding:26px 28px;user-select:none;-webkit-user-select:none;min-height:260px;}
.doc-line{height:9px;background:var(--surface-3);border-radius:3px;margin-bottom:11px;}
.watermark-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.wm{position:absolute;font-size:12px;font-weight:600;color:rgba(120,130,128,.32);white-space:nowrap;transform:rotate(-28deg);font-family:var(--font-mono);}

const STORE_KEY = 'schulwolke_state_v3';
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return seedState();
}
function normalizeState(s){
  if(!s.calendarPublic) s.calendarPublic = {enabled:false, detail:'eingeschraenkt', token:null};
  if(!Array.isArray(s.files)) s.files=[];
  s.files.forEach(f=>{ if(f.downloadBlocked===undefined) f.downloadBlocked=false; });
  return s;
}
let state = normalizeState(load());
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  bumpSync();
}
function bumpSync(){
  const dot = document.getElementById('connDot');
  const txt = document.getElementById('connText');
  if(!dot) return;
  dot.classList.add('syncing');
  txt.textContent = 'Wird synchronisiert …';
  setTimeout(()=>{
    dot.classList.remove('syncing');
    txt.textContent = 'Verbunden mit Microsoft 365';
  }, 850);
}

function uid(p){ return p+Math.random().toString(36).slice(2,9); }
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  const days=['So','Mo','Di','Mi','Do','Fr','Sa'];
  const months=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  return days[d.getDay()]+', '+d.getDate()+'. '+months[d.getMonth()];
}

/* ---------------- Toast ---------------- */
function toast(msg){
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  stack.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),250); }, 2400);
}

/* ---------------- Popover ---------------- */
function closePopover(){ const p=document.getElementById('activePopover'); if(p) p.remove(); }
function openPopover(anchor, items){
  closePopover();
  const pop = document.createElement('div');
  pop.className='popover'; pop.id='activePopover';
  items.forEach(it=>{
    if(it.divider){ pop.appendChild(document.createElement('hr')); return; }
    const b=document.createElement('button');
    if(it.danger) b.classList.add('danger');
    b.innerHTML = (ICONS[it.icon]||'') + '<span>'+it.label+'</span>';
    b.onclick=(e)=>{ e.stopPropagation(); closePopover(); it.action(); };
    pop.appendChild(b);
  });
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  const pw = 180;
  let left = Math.min(r.left, window.innerWidth-pw-10);
  pop.style.left = left+'px';
  pop.style.top = (r.bottom+6)+'px';
}
document.addEventListener('click', closePopover);

/* ---------------- Modal helper ---------------- */
function openModal(html, onMount){
  const ov = document.createElement('div');
  ov.className='overlay';
  ov.innerHTML = '<div class="modal">'+html+'</div>';
  ov.addEventListener('click',(e)=>{ if(e.target===ov) ov.remove(); });
  document.body.appendChild(ov);
  if(onMount) onMount(ov);
  return ov;
}

/* ---------------- Render: shell ---------------- */
function switchView(view){
  currentView = view;
  currentFolder = null;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  render();
}
document.getElementById('navList').addEventListener('click',(e)=>{
  const b = e.target.closest('.nav-item'); if(!b) return;
  switchView(b.dataset.view);
});
document.getElementById('resetDemo').addEventListener('click',()=>{
  state = seedState(); save(); currentFolder=null; searchTerm=''; document.getElementById('searchInput').value='';
  toast('Demo zurückgesetzt'); render();
});
document.getElementById('searchInput').addEventListener('input',(e)=>{
  searchTerm = e.target.value.trim().toLowerCase(); renderContent();
});

function render(){ renderCrumbs(); renderContent(); }

function renderCrumbs(){
  const el = document.getElementById('crumbs');
  const titles = {files:'Dateien', calendar:'Kalender', shared:'Geteilt mit mir', trash:'Papierkorb'};
  if(currentView!=='files'){ el.innerHTML = '<span class="crumb-btn current">'+titles[currentView]+'</span>'; return; }
  const chain = [];
  let f = currentFolder;
  while(f){ const node = state.files.find(x=>x.id===f); if(!node) break; chain.unshift(node); f = node.parent; }
  let html = '<button class="crumb-btn" data-nav="root">Dateien</button>';
  chain.forEach((n,i)=>{
    html += '<span class="crumb-sep">/</span><button class="crumb-btn'+(i===chain.length-1?' current':'')+'" data-nav="'+n.id+'">'+esc(n.name)+'</button>';
  });
  el.innerHTML = html;
  el.querySelectorAll('.crumb-btn').forEach(b=>b.addEventListener('click',()=>{
    currentFolder = b.dataset.nav==='root' ? null : b.dataset.nav; render();
  }));
}

function esc(s){ return (s+'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------------- Content router ---------------- */
function renderContent(){
  const c = document.getElementById('content');
  c.innerHTML = '';
  if(!state.dismissedBanner){
    c.appendChild(banner());
  }
  if(currentView==='files') c.appendChild(filesView(currentFolder));
  else if(currentView==='calendar') c.appendChild(calendarView());
  else if(currentView==='shared') c.appendChild(sharedView());
  else if(currentView==='trash') c.appendChild(trashView());
  document.getElementById('sharedCount').textContent = state.files.filter(f=>f.sharedBy).length || '';
}

function banner(){
  const d=document.createElement('div'); d.className='info-banner';
  d.innerHTML = ICONS.info + '<div>Dieser Klick-Prototyp zeigt, wie ein Nextcloud-ähnliches Portal für das Evangelische Schulzentrum Bad Düben auf Basis von Microsoft&nbsp;365 / OneDrive aussehen könnte. Dateien und Termine werden nur lokal in diesem Browser gespeichert.</div><button aria-label="Hinweis schließen">'+ICONS.x+'</button>';
  d.querySelector('button').addEventListener('click',()=>{ state.dismissedBanner=true; save(); renderContent(); });
  return d;
}

/* ---------------- Files view ---------------- */
function childrenOf(parent){
  return state.files.filter(f=>f.parent===parent);
}
function filesView(folderId){
  const wrap = document.createElement('div');
  const folderNode = folderId ? state.files.find(f=>f.id===folderId) : null;
  let items = childrenOf(folderId);
  if(searchTerm){
    items = state.files.filter(f=> f.type==='file' && f.name.toLowerCase().includes(searchTerm) && f.id!=='' );
  }

  const head = document.createElement('div'); head.className='view-head';
  head.innerHTML = '<div><h2 class="view-title">'+(searchTerm? 'Suchergebnisse' : (folderNode? esc(folderNode.name) : 'Meine Dateien'))+'</h2>'+
    '<div class="view-desc">'+(searchTerm? items.length+' Treffer für „'+esc(searchTerm)+'“' : 'Automatisch synchronisiert mit OneDrive')+'</div></div>';
  const toolbar = document.createElement('div'); toolbar.className='toolbar';

  const toggle = document.createElement('div'); toggle.className='list-toggle';
  toggle.innerHTML = '<button data-m="grid" class="'+(viewMode==='grid'?'active':'')+'">'+ICONS.grid+'</button><button data-m="list" class="'+(viewMode==='list'?'active':'')+'">'+ICONS.list+'</button>';
  toggle.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ viewMode=b.dataset.m; renderContent(); }));

  const newFolderBtn = btn('Neuer Ordner','plus',()=>promptNewFolder(folderId));
  const uploadBtn = btn('Hochladen','upload',()=>document.getElementById('fileInput').click());
  toolbar.append(toggle, newFolderBtn, uploadBtn);
  head.appendChild(toolbar);
  wrap.appendChild(head);

  if(items.length===0){
    const empty = document.createElement('div'); empty.className='empty-state';
    empty.innerHTML = ICONS.emptyFolder + '<div><b>'+(searchTerm?'Keine Treffer':'Dieser Ordner ist leer')+'</b></div><div>'+(searchTerm?'Versuche einen anderen Suchbegriff.':'Lade eine Datei hoch oder lege einen Unterordner an.')+'</div>';
    wrap.appendChild(empty);
    return wrap;
  }

  const grid = document.createElement('div'); grid.className='file-grid'+(viewMode==='list'?' list-mode':'');
  items.sort((a,b)=> (a.type===b.type? a.name.localeCompare(b.name) : (a.type==='folder'?-1:1)) );
  items.forEach(it=> grid.appendChild(fileCard(it)));
  wrap.appendChild(grid);
  return wrap;
}

function btn(label,icon,onClick,opts){
  const b=document.createElement('button'); b.className='btn'+(opts&&opts.primary?' primary':'');
  b.innerHTML=(icon?ICONS[icon]:'')+'<span>'+label+'</span>'; b.addEventListener('click',onClick); return b;
}

function fileCard(it){
  const card = document.createElement('div'); card.className='file-card';
  let iconHtml, metaRight='';
  if(it.type==='folder'){
    iconHtml = '<div class="file-icon" style="background:var(--accent-soft)">'+ICONS.folder+'</div>';
    metaRight = childrenOf(it.id).length+' Elemente';
  } else {
    const st = EXT_STYLE[it.ext]||{bg:'var(--surface-3)',fg:'var(--text-muted)'};
    iconHtml = '<div class="file-icon" style="background:'+st.bg+'"><span class="chip" style="background:transparent;color:'+st.fg+';padding:0;font-size:10px;">'+it.ext.toUpperCase()+'</span></div>';
    metaRight = it.size;
  }
  const openBtn = document.createElement('button'); openBtn.className='file-open'; openBtn.setAttribute('aria-label','Öffnen: '+it.name);
  openBtn.addEventListener('click',()=>{
    if(it.type==='folder'){ currentFolder = it.id; render(); }
    else { openFileViewer(it); }
  });

  const more = document.createElement('button'); more.className='more-btn'; more.innerHTML=ICONS.dots; more.setAttribute('aria-label','Weitere Aktionen');
  more.addEventListener('click',(e)=>{ e.stopPropagation(); openPopover(more, fileMenu(it)); });

  card.innerHTML = '<div class="file-top"></div>';
  const top = card.querySelector('.file-top');
  const iconWrap=document.createElement('div'); iconWrap.innerHTML=iconHtml; top.appendChild(iconWrap.firstChild);
  const nameEl=document.createElement('div'); nameEl.className='file-name'; nameEl.textContent=it.name;
  top.appendChild(nameEl);
  top.appendChild(more);
  card.appendChild(openBtn);

  const meta = document.createElement('div'); meta.className='file-meta';
  meta.innerHTML = '<span>'+(it.type==='folder'?metaRight:esc(it.mod||''))+'</span>'+
    (it.type==='file' ? '<span class="file-sync">'+ICONS.check+' '+metaRight+'</span>' : '');
  card.appendChild(meta);

  if(it.sharedBy){
    const sb=document.createElement('div'); sb.className='shared-by'; sb.textContent='Geteilt von '+it.sharedBy;
    card.appendChild(sb);
  }
  return card;
}

function fileMenu(it){
  const items = [
    {label:'Teilen', icon:'share', action:()=>openShareModal(it)},
    {label:'Umbenennen', icon:'rename', action:()=>promptRename(it)},
  ];
  if(it.type==='file'){
    if(it.downloadBlocked){
      items.push({label:'Herunterladen (gesperrt)', icon:'lock', action:()=>toast('Download ist für dieses Dokument gesperrt – nur Ansicht erlaubt.')});
    } else {
      items.push({label:'Herunterladen', icon:'download', action:()=>toast('„'+it.name+'“ wird heruntergeladen (simuliert).')});
    }
  }
  items.push({divider:true});
  items.push({label:'Löschen', icon:'trash', danger:true, action:()=>moveToTrash(it)});
  return items;
}

function promptNewFolder(parentId){
  openModal(
    '<h3>Neuer Ordner</h3>'+
    '<div class="field"><label>Ordnername</label><input type="text" id="nfName" placeholder="z. B. Klasse 8" autofocus></div>'+
    '<div class="modal-actions"><button class="btn ghost" data-close>Abbrechen</button><button class="btn primary" id="nfCreate">Erstellen</button></div>',
    (ov)=>{
      ov.querySelector('[data-close]').onclick=()=>ov.remove();
      const input = ov.querySelector('#nfName'); input.focus();
      const create=()=>{
        const name = input.value.trim(); if(!name) return;
        state.files.push({id:uid('folder-'), parent:parentId, type:'folder', name});
        save(); ov.remove(); toast('Ordner „'+name+'“ erstellt'); renderContent();
      };
      ov.querySelector('#nfCreate').onclick=create;
      input.addEventListener('keydown',e=>{ if(e.key==='Enter') create(); });
    }
  );
}

function promptRename(it){
  openModal(
    '<h3>Umbenennen</h3>'+
    '<div class="field"><label>Name</label><input type="text" id="rnName" value="'+esc(it.name)+'" autofocus></div>'+
    '<div class="modal-actions"><button class="btn ghost" data-close>Abbrechen</button><button class="btn primary" id="rnSave">Speichern</button></div>',
    (ov)=>{
      ov.querySelector('[data-close]').onclick=()=>ov.remove();
      const input = ov.querySelector('#rnName'); input.focus(); input.select();
      const save2=()=>{
        const val = input.value.trim(); if(!val) return;
        it.name = val; save(); ov.remove(); renderContent();
      };
      ov.querySelector('#rnSave').onclick=save2;
      input.addEventListener('keydown',e=>{ if(e.key==='Enter') save2(); });
    }
  );
}

function moveToTrash(it){
  const idx = state.files.findIndex(f=>f.id===it.id);
  if(idx>-1){ state.trash.push(state.files[idx]); state.files.splice(idx,1); save(); toast('„'+it.name+'“ in den Papierkorb verschoben'); renderContent(); }
}

function openShareModal(it){
  const link = state.shareLinks[it.id] || ('https://cloud.esz-baddueben.de/s/'+Math.random().toString(36).slice(2,10));
  state.shareLinks[it.id] = link;
  const already = [
    {name:'S. Wagner', role:'Kann bearbeiten'},
    {name:'M. Krause', role:'Kann ansehen'},
  ];
  openModal(
    '<h3>„'+esc(it.name)+'“ teilen</h3>'+
    '<div class="field"><label>Link für Kolleg:innen</label><div class="link-copy"><input type="text" id="shareLink" value="'+link+'" readonly><button class="btn small" id="copyLink">Kopieren</button></div></div>'+
    '<div class="field"><label>Link-Berechtigung</label><div class="seg-control" id="permSeg">'+
      '<button type="button" class="seg-btn'+(!it.downloadBlocked?' active':'')+'" data-v="0">Ansehen &amp; Herunterladen</button>'+
      '<button type="button" class="seg-btn'+(it.downloadBlocked?' active':'')+'" data-v="1">Nur Ansehen (kein Download)</button>'+
    '</div><div class="note-box" id="permNote"></div></div>'+
    '<div class="field"><label>Person aus der Schule einladen</label><input type="email" id="inviteEmail" placeholder="name@esz-baddueben.de">'+
    '<select id="invitePerm" style="margin-top:8px;"><option>Kann ansehen</option><option>Kann bearbeiten</option></select></div>'+
    '<button class="btn small" id="inviteBtn" style="margin-bottom:6px;">Einladen</button>'+
    '<div class="field"><label>Bereits freigegeben für</label><div class="people-list" id="peopleList"></div></div>'+
    '<div class="modal-actions"><button class="btn primary" data-close>Fertig</button></div>',
    (ov)=>{
      ov.querySelector('[data-close]').onclick=()=>{ save(); ov.remove(); renderContent(); };
      ov.querySelector('#copyLink').onclick=()=>{
        try{ navigator.clipboard.writeText(link); toast('Link kopiert'); }catch(e){ toast('Link: '+link); }
      };
      function updatePermNote(){
        ov.querySelector('#permNote').textContent = it.downloadBlocked
          ? 'Der Download-Button ist deaktiviert, auch für eingeladene Personen. Hinweis: Screenshots oder Fotos vom Bildschirm lassen sich technisch nicht verhindern – das gilt für jedes System, auch für OneDrive/SharePoint direkt.'
          : 'Eingeladene Personen können die Datei ansehen und herunterladen.';
      }
      updatePermNote();
      ov.querySelectorAll('#permSeg .seg-btn').forEach(b=>b.addEventListener('click',()=>{
        it.downloadBlocked = b.dataset.v==='1';
        ov.querySelectorAll('#permSeg .seg-btn').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        updatePermNote(); save();
      }));
      const list = ov.querySelector('#peopleList');
      function renderPeople(){
        list.innerHTML='';
        already.forEach(p=>{
          const initials = p.name.split(' ').map(s=>s[0]).join('').slice(0,2);
          const row=document.createElement('div'); row.className='person-row';
          row.innerHTML = '<div class="avatar" style="width:26px;height:26px;font-size:10.5px;">'+initials+'</div><span class="pname">'+esc(p.name)+'</span><span class="prole">'+p.role+'</span>';
          list.appendChild(row);
        });
        if(already.length===0){ list.innerHTML='<div style="font-size:12px;color:var(--text-faint);">Noch mit niemandem geteilt.</div>'; }
      }
      renderPeople();
      ov.querySelector('#inviteBtn').onclick=()=>{
        const email = ov.querySelector('#inviteEmail').value.trim();
        const perm = ov.querySelector('#invitePerm').value;
        if(!email || !email.includes('@')){ toast('Bitte gültige E-Mail eingeben'); return; }
        const namePart = email.split('@')[0].replace(/[._]/g,' ');
        already.push({name: namePart.charAt(0).toUpperCase()+namePart.slice(1), role: perm});
        it.sharedBy = it.sharedBy; // unchanged
        ov.querySelector('#inviteEmail').value='';
        renderPeople(); toast('Einladung gesendet an '+email);
      };
    }
  );
}

function openFileViewer(it){
  const ts = new Date().toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const wmText = 'Tim Steiner · '+ts;
  const overlay = document.createElement('div'); overlay.className='viewer-overlay';
  overlay.innerHTML = '<div class="viewer-modal">'+
    '<div class="viewer-head"><div class="file-name">'+esc(it.name)+'</div>'+
    (it.downloadBlocked? '<span class="lock-badge">'+ICONS.lock+'<span>Nur Ansicht</span></span>':'')+
    '<button aria-label="Schließen" id="vClose">'+ICONS.x+'</button></div>'+
    '<div class="doc-preview" id="docPreview"><div class="watermark-layer" id="wmLayer"></div>'+
      Array.from({length:7}).map((_,i)=>'<div class="doc-line" style="width:'+(60+((i*13)%38))+'%"></div>').join('')+
    '</div>'+
    '<div class="viewer-foot">'+
    (it.downloadBlocked
      ? '<span>Screenshots lassen sich technisch nicht verhindern – dieser Modus blockiert nur den Download-Button.</span>'
      : '<span>Automatisch synchronisiert mit OneDrive</span><button class="btn small" id="vDownload">'+ICONS.download+'<span>Herunterladen</span></button>')
    +'</div>'+
  '</div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#vClose').onclick=()=>overlay.remove();
  const dp = overlay.querySelector('#docPreview');
  if(it.downloadBlocked){
    dp.addEventListener('contextmenu',(e)=>{ e.preventDefault(); toast('Rechtsklick ist für dieses Dokument deaktiviert.'); });
    const wmLayer = overlay.querySelector('#wmLayer');
    for(let r=0;r<5;r++){ for(let c=0;c<3;c++){ const s=document.createElement('span'); s.className='wm'; s.textContent=wmText; s.style.top=(r*70-20)+'px'; s.style.left=(c*220-40)+'px'; wmLayer.appendChild(s); } }
  } else {
    const dl = overlay.querySelector('#vDownload'); if(dl) dl.onclick=()=>{ toast('„'+it.name+'“ wird heruntergeladen (simuliert).'); overlay.remove(); };
  }
}

/* hidden file input for upload simulation */
const fileInput = document.createElement('input');
fileInput.type='file'; fileInput.id='fileInput'; fileInput.multiple=true; fileInput.style.display='none';
document.body.appendChild(fileInput);
fileInput.addEventListener('change',()=>{ handleFiles(fileInput.files); fileInput.value=''; });

function handleFiles(fileList){
  if(!fileList || fileList.length===0) return;
  Array.from(fileList).forEach(f=>{
    const ext = (f.name.split('.').pop()||'file').toLowerCase();
    const sizeKB = f.size/1024;
    const size = sizeKB>1024 ? (sizeKB/1024).toFixed(1)+' MB' : Math.max(1,Math.round(sizeKB))+' KB';
    state.files.push({id:uid('file-'), parent: currentView==='files'?currentFolder:null, type:'file', ext: EXT_STYLE[ext]?ext:'file', name:f.name, size, mod:'gerade eben', synced:true});
  });
  save(); toast(fileList.length>1? fileList.length+' Dateien hochgeladen':'„'+fileList[0].name+'“ hochgeladen'); renderContent();
}

/* drag & drop */
let dragCounter=0;
const dz = document.getElementById('dropzone');
window.addEventListener('dragenter', e=>{ e.preventDefault(); dragCounter++; if(currentView==='files'){ dz.classList.add('active'); } });
window.addEventListener('dragover', e=> e.preventDefault());
window.addEventListener('dragleave', e=>{ dragCounter--; if(dragCounter<=0){ dz.classList.remove('active'); dragCounter=0; } });
window.addEventListener('drop', e=>{
  e.preventDefault(); dragCounter=0; dz.classList.remove('active');
  if(currentView!=='files') return;
  if(e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files);
});

/* ---------------- Shared view ---------------- */
function sharedView(){
  const wrap=document.createElement('div');
  const head=document.createElement('div'); head.className='view-head';
  head.innerHTML='<div><h2 class="view-title">Geteilt mit mir</h2><div class="view-desc">Über OneDrive-Freigaben von Kolleg:innen erhalten</div></div>';
  wrap.appendChild(head);
  const items = state.files.filter(f=>f.sharedBy);
  if(items.length===0){
    const empty=document.createElement('div'); empty.className='empty-state';
    empty.innerHTML=ICONS.emptyFolder+'<div><b>Nichts geteilt</b></div><div>Hier erscheinen Dateien, die Kolleg:innen mit dir teilen.</div>';
    wrap.appendChild(empty); return wrap;
  }
  const grid=document.createElement('div'); grid.className='file-grid';
  items.forEach(it=>grid.appendChild(fileCard(it)));
  wrap.appendChild(grid);
  return wrap;
}

/* ---------------- Trash view ---------------- */
function trashView(){
  const wrap=document.createElement('div');
  const head=document.createElement('div'); head.className='view-head';
  head.innerHTML='<div><h2 class="view-title">Papierkorb</h2><div class="view-desc">Gelöschte Elemente bleiben 30 Tage erhalten</div></div>';
  wrap.appendChild(head);
  if(state.trash.length===0){
    const empty=document.createElement('div'); empty.className='empty-state';
    empty.innerHTML=ICONS.emptyTrash+'<div><b>Papierkorb ist leer</b></div><div>Gelöschte Dateien und Ordner erscheinen hier.</div>';
    wrap.appendChild(empty); return wrap;
  }
  const grid=document.createElement('div'); grid.className='file-grid list-mode';
  state.trash.forEach(it=>{
    const card=document.createElement('div'); card.className='file-card';
    const st = it.type==='folder' ? null : (EXT_STYLE[it.ext]||{bg:'var(--surface-3)',fg:'var(--text-muted)'});
    card.innerHTML = '<div class="file-top">'+
      '<div class="file-icon" style="background:'+(it.type==='folder'?'var(--accent-soft)':st.bg)+'">'+(it.type==='folder'?ICONS.folder:'<span class="chip" style="background:transparent;color:'+st.fg+';padding:0;font-size:10px;">'+it.ext.toUpperCase()+'</span>')+'</div>'+
      '<div class="file-name">'+esc(it.name)+'</div></div>'+
      '<div class="file-meta"><span></span></div>';
    const actions=document.createElement('div'); actions.style.cssText='display:flex;gap:6px;position:relative;z-index:1;';
    const restoreBtn = btn('Wiederherstellen','restore',()=>{
      const idx=state.trash.findIndex(x=>x.id===it.id);
      state.trash.splice(idx,1); state.files.push(it); save(); toast('„'+it.name+'“ wiederhergestellt'); renderContent();
    }); restoreBtn.classList.add('small');
    const delBtn = btn('Endgültig löschen',null,()=>{
      const idx=state.trash.findIndex(x=>x.id===it.id);
      state.trash.splice(idx,1); save(); toast('Endgültig gelöscht'); renderContent();
    }); delBtn.classList.add('small','danger');
    actions.append(restoreBtn, delBtn);
    card.querySelector('.file-meta').replaceWith(actions);
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  return wrap;
}

/* ---------------- Calendar view ---------------- */
function pad(n){ return n<10?'0'+n:''+n; }
function isoOf(y,m,d){ return y+'-'+pad(m+1)+'-'+pad(d); }
const TODAY_ISO = '2026-09-05';

function calendarView(){
  const wrap=document.createElement('div');
  const head=document.createElement('div'); head.className='view-head';
  const publicOn = state.calendarPublic && state.calendarPublic.enabled;
  head.innerHTML='<div><h2 class="view-title">Kalender'+(publicOn?' <span class="public-badge">'+ICONS.globe+'<span>Öffentlich eingebettet</span></span>':'')+'</h2><div class="view-desc">Synchronisiert mit deinem Outlook-Kalender (Microsoft 365)</div></div>';
  const publishBtn = btn('Veröffentlichen','globe',()=>openPublishCalendarModal());
  const addBtn = btn('Termin','plus',()=>openEventModal(selectedDay||TODAY_ISO),{primary:true});
  const tb=document.createElement('div'); tb.className='toolbar'; tb.append(publishBtn, addBtn);
  head.appendChild(tb);
  wrap.appendChild(head);

  const grid2 = document.createElement('div'); grid2.className='cal-wrap';

  const left = document.createElement('div');
  const monthNames=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  const nav = document.createElement('div'); nav.className='cal-nav';
  nav.innerHTML = '<button id="prevM">'+ICONS.chevL+'</button><span class="cal-month">'+monthNames[calMonth]+' '+calYear+'</span><button id="nextM">'+ICONS.chevR+'</button><button class="btn small cal-today-btn" id="todayBtn">Heute</button>';
  left.appendChild(nav);

  const wd=document.createElement('div'); wd.className='weekday-row';
  ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(d=>{ const s=document.createElement('span'); s.textContent=d; wd.appendChild(s); });
  left.appendChild(wd);

  const calGrid=document.createElement('div'); calGrid.className='cal-grid';
  const first = new Date(calYear, calMonth, 1);
  let startOffset = first.getDay()===0?6:first.getDay()-1; // Monday-start
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const prevDays = new Date(calYear, calMonth, 0).getDate();
  const cells=[];
  for(let i=startOffset;i>0;i--) cells.push({d:prevDays-i+1, out:true, m:calMonth-1});
  for(let d=1; d<=daysInMonth; d++) cells.push({d, out:false, m:calMonth});
  while(cells.length%7!==0 || cells.length<35) cells.push({d:cells.length, out:true, m:calMonth+1});

  cells.forEach(c=>{
    const y = calYear, m = c.out ? (c.m<0?11:(c.m>11?0:c.m)) : calMonth;
    const iso = c.out ? null : isoOf(y,calMonth,c.d);
    const cell=document.createElement('button'); cell.className='cal-day'+(c.out?' out':'')+((!c.out && iso===TODAY_ISO)?' today':'');
    let inner = '<span class="cal-daynum">'+c.d+'</span>';
    if(!c.out){
      const evts = state.events.filter(e=>e.date===iso).sort((a,b)=>a.time.localeCompare(b.time));
      evts.slice(0,2).forEach(e=>{
        const cat=CATS[e.cat];
        inner += '<span class="cal-evt" style="background:'+cat.soft+';color:'+cat.fg+'">'+esc(e.title)+'</span>';
      });
      if(evts.length>2) inner += '<span class="cal-more">+'+(evts.length-2)+' mehr</span>';
    }
    cell.innerHTML = inner;
    if(!c.out){ cell.addEventListener('click',()=>{ selectedDay=iso; openDayModal(iso); }); }
    else { cell.disabled=true; }
    calGrid.appendChild(cell);
  });
  left.appendChild(calGrid);

  nav.querySelector('#prevM').onclick=()=>{ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderContent(); };
  nav.querySelector('#nextM').onclick=()=>{ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderContent(); };
  nav.querySelector('#todayBtn').onclick=()=>{ calMonth=8; calYear=2026; renderContent(); };

  const right = document.createElement('div'); right.className='side-panel';
  const upcomingBox = document.createElement('div'); upcomingBox.className='panel-box';
  upcomingBox.innerHTML='<h4>Nächste Termine</h4>';
  const upcoming = state.events.filter(e=>e.date>=TODAY_ISO).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
  if(upcoming.length===0) upcomingBox.innerHTML+='<div style="font-size:12px;color:var(--text-faint);">Keine anstehenden Termine.</div>';
  upcoming.forEach(e=>{
    const d=new Date(e.date+'T00:00:00');
    const row=document.createElement('div'); row.className='upcoming-item';
    row.innerHTML='<div class="up-date">'+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.</div><div><div class="up-title">'+esc(e.title)+'</div><div class="up-time">'+e.time+'</div></div>';
    upcomingBox.appendChild(row);
  });
  right.appendChild(upcomingBox);

  const legendBox=document.createElement('div'); legendBox.className='panel-box';
  legendBox.innerHTML='<h4>Kategorien</h4>';
  const legend=document.createElement('div'); legend.className='legend';
  Object.values(CATS).forEach(c=>{
    const row=document.createElement('div'); row.className='legend-row';
    row.innerHTML='<span class="cat-dot" style="background:'+c.color+'"></span>'+c.label;
    legend.appendChild(row);
  });
  legendBox.appendChild(legend);
  right.appendChild(legendBox);

  grid2.append(left, right);
  wrap.appendChild(grid2);
  return wrap;
}

function openDayModal(iso){
  const evts = state.events.filter(e=>e.date===iso).sort((a,b)=>a.time.localeCompare(b.time));
  openModal(
    '<h3>'+fmtDate(iso)+'</h3>'+
    '<div class="day-events" id="dayEvts"></div>'+
    '<button class="btn primary small" id="addEvtBtn">'+ICONS.plus+'<span>Termin hinzufügen</span></button>'+
    '<div class="modal-actions"><button class="btn ghost" data-close>Schließen</button></div>',
    (ov)=>{
      ov.querySelector('[data-close]').onclick=()=>ov.remove();
      function renderEvts(){
        const box=ov.querySelector('#dayEvts'); box.innerHTML='';
        const list = state.events.filter(e=>e.date===iso).sort((a,b)=>a.time.localeCompare(b.time));
        if(list.length===0){ box.innerHTML='<div style="font-size:12.5px;color:var(--text-faint);">Keine Termine an diesem Tag.</div>'; return; }
        list.forEach(e=>{
          const cat=CATS[e.cat];
          const row=document.createElement('div'); row.className='day-evt-row';
          row.innerHTML='<div class="evt-time">'+e.time+'</div><div><div class="evt-title">'+esc(e.title)+'</div><div class="evt-cat"><span class="cat-dot" style="background:'+cat.color+';display:inline-block;margin-right:5px;"></span>'+cat.label+'</div></div><button class="del-evt" aria-label="Löschen">'+ICONS.trash+'</button>';
          row.querySelector('.del-evt').onclick=()=>{
            const idx=state.events.findIndex(x=>x.id===e.id); state.events.splice(idx,1); save(); renderEvts(); renderContent();
          };
          box.appendChild(row);
        });
      }
      renderEvts();
      ov.querySelector('#addEvtBtn').onclick=()=>{ ov.remove(); openEventModal(iso); };
    }
  );
}

function openEventModal(iso){
  openModal(
    '<h3>Neuer Termin</h3>'+
    '<div class="field"><label>Titel</label><input type="text" id="evTitle" placeholder="z. B. Klassenarbeit Kl. 8" autofocus></div>'+
    '<div class="row2"><div class="field"><label>Datum</label><input type="date" id="evDate" value="'+iso+'"></div>'+
    '<div class="field"><label>Uhrzeit</label><input type="text" id="evTime" placeholder="z. B. 09:00" value="09:00"></div></div>'+
    '<div class="field"><label>Kategorie</label><select id="evCat">'+
      Object.entries(CATS).map(([k,v])=>'<option value="'+k+'">'+v.label+'</option>').join('')+
    '</select></div>'+
    '<div class="modal-actions"><button class="btn ghost" data-close>Abbrechen</button><button class="btn primary" id="evSave">Speichern</button></div>',
    (ov)=>{
      ov.querySelector('[data-close]').onclick=()=>ov.remove();
      const titleInp = ov.querySelector('#evTitle'); titleInp.focus();
      ov.querySelector('#evSave').onclick=()=>{
        const title = titleInp.value.trim(); if(!title){ toast('Bitte einen Titel eingeben'); return; }
        const date = ov.querySelector('#evDate').value || iso;
        const time = ov.querySelector('#evTime').value.trim() || '—';
        const cat = ov.querySelector('#evCat').value;
        state.events.push({id:uid('evt-'), date, time, title, cat});
        save(); ov.remove(); toast('Termin gespeichert'); selectedDay=date; renderContent();
      };
    }
  );
}

function openPublishCalendarModal(){
  const cp = state.calendarPublic;
  if(!cp.token) cp.token = Math.random().toString(36).slice(2,10);
  const url = 'https://cloud.esz-baddueben.de/kalender/oeffentlich/'+cp.token;
  const embed = '<iframe src="'+url+'" style="width:100%;height:600px;border:0;" title="Schulkalender"></iframe>';
  openModal(
    '<h3>Kalender veröffentlichen</h3>'+
    '<div class="field switch-row"><label style="margin:0;">Öffentlicher Link für die Homepage</label><button type="button" class="switch'+(cp.enabled?' on':'')+'" id="pubSwitch" aria-label="Veröffentlichung umschalten"><i></i></button></div>'+
    '<div id="pubDetails"></div>'+
    '<div class="modal-actions"><button class="btn primary" data-close>Fertig</button></div>',
    (ov)=>{
      ov.querySelector('[data-close]').onclick=()=>{ save(); ov.remove(); renderContent(); };
      function renderDetails(){
        const box = ov.querySelector('#pubDetails');
        if(!cp.enabled){ box.innerHTML='<div class="note-box">Noch nicht veröffentlicht. Aktiviere den Link, um ihn auf eurer Homepage einzubetten.</div>'; return; }
        box.innerHTML =
          '<div class="field"><label>Detailgrad</label><select id="pubDetail">'+
            '<option value="verfuegbarkeit"'+(cp.detail==='verfuegbarkeit'?' selected':'')+'>Nur Verfügbarkeit (frei/belegt)</option>'+
            '<option value="eingeschraenkt"'+(cp.detail==='eingeschraenkt'?' selected':'')+'>Titel &amp; Kategorie</option>'+
            '<option value="alle"'+(cp.detail==='alle'?' selected':'')+'>Alle Details</option>'+
          '</select></div>'+
          '<div class="field"><label>Öffentlicher Link</label><div class="link-copy"><input type="text" id="pubLink" value="'+url+'" readonly><button class="btn small" id="pubCopy">Kopieren</button></div></div>'+
          '<div class="field embed-box"><label>Einbetten auf der Homepage</label><textarea id="pubEmbed" readonly>'+esc(embed)+'</textarea></div>'+
          '<div class="note-box">Interne Freigaben, Dateien und Notizen sind im öffentlichen Kalender nicht sichtbar.</div>';
        box.querySelector('#pubDetail').onchange=(e)=>{ cp.detail=e.target.value; save(); };
        box.querySelector('#pubCopy').onclick=()=>{ try{ navigator.clipboard.writeText(url); }catch(e){} toast('Link kopiert'); };
      }
      renderDetails();
      ov.querySelector('#pubSwitch').onclick=()=>{
        cp.enabled = !cp.enabled;
        ov.querySelector('#pubSwitch').classList.toggle('on', cp.enabled);
        save(); renderDetails(); toast(cp.enabled?'Kalender veröffentlicht':'Veröffentlichung deaktiviert');
      };
    }
  );
}

/* ---------------- Init ---------------- */
render();
})();
</script>

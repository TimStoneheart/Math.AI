main{min-width:0}.top{position:sticky;top:0;z-index:15;display:flex;justify-content:space-between;align-items:center;gap:15px;padding:13px clamp(17px,4vw,52px);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}

details{border:1px solid var(--line);border-radius:13px;margin:9px 0;background:var(--panel);overflow:hidden}summary{list-style:none;padding:13px 15px;font-weight:800;cursor:pointer;display:flex;justify-content:space-between;gap:10px}summary::-webkit-details-marker{display:none}summary:after{content:"＋";color:var(--blue)}details[open] summary:after{content:"−"}.answer{padding:0 15px 15px}
.svgbox{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:8px;overflow:hidden}.svgbox svg{display:block;width:100%;height:auto;max-height:365px}
.sbg{fill:var(--panel2)}.ln,.axis,.ac,.dash,.soft,.mark,.arrow{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ac{stroke:var(--blue);stroke-width:4}.dash{stroke:var(--cyan);stroke-dasharray:8 7}.soft{stroke:var(--muted);stroke-width:2}.axis{stroke:var(--muted);stroke-width:2}.pt{fill:var(--orange);stroke:var(--panel);stroke-width:2}
.poly{fill:color-mix(in srgb,var(--blue) 10%,transparent);stroke:var(--blue);stroke-width:3}.poly.image{fill:color-mix(in srgb,var(--cyan) 11%,transparent);stroke:var(--cyan)}.poly.bad{fill:color-mix(in srgb,var(--red) 9%,transparent);stroke:var(--red)}
.circ{fill:none;stroke:var(--blue);stroke-width:3}.shade1{fill:color-mix(in srgb,var(--blue) 10%,var(--panel2))}.shade2{fill:color-mix(in srgb,var(--orange) 10%,var(--panel2))}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.wedge{fill:color-mix(in srgb,var(--orange) 25%,transparent);stroke:var(--orange)}.wedge.second{fill:color-mix(in srgb,var(--cyan) 20%,transparent);stroke:var(--cyan)}
.mark{stroke:var(--orange)}.mark.red{stroke:var(--red)}.arrow{stroke:var(--blue);stroke-width:4}.node{fill:var(--panel);stroke:var(--blue);stroke-width:3}.node.good{stroke:var(--green)}.node.badnode{stroke:var(--red)}
.st{font-weight:850;font-size:16px;fill:var(--ink)}svg text{fill:var(--ink);font:14px Inter,Segoe UI,Arial,sans-serif}
.progress{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green))}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.tile{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:14px;text-align:left;min-height:105px;transition:.18s}.tile:hover{border-color:var(--blue);transform:translateY(-2px)}.tile b{display:block;color:var(--blue);margin-bottom:5px}.tile small{color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;background:var(--panel2);padding:12px 14px;border-radius:12px;font-weight:750;margin-top:15px}.check input{width:20px;height:20px;accent-color:var(--green)}
.source{color:var(--muted);font-size:.86rem;border-top:1px solid var(--line);padding-top:12px;margin-top:15px}
.modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:18px;background:rgba(4,10,20,.72);backdrop-filter:blur(8px)}.modal.open{display:grid}.modalcard{width:min(790px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:27px;box-shadow:0 30px 100px rgba(0,0,0,.35)}
.timer{text-align:center;font-size:3rem;font-weight:900;color:var(--blue);font-variant-numeric:tabular-nums;margin:8px 0}.modalactions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hidden{display:none!important}.toast{position:fixed;right:18px;bottom:18px;z-index:90;background:var(--ink);color:var(--panel);padding:11px 15px;border-radius:11px;opacity:0;transform:translateY(10px);transition:.22s;pointer-events:none}.toast.show{opacity:1;transform:none}
.mobile{display:none}hr{border:0;border-top:1px solid var(--line);margin:20px 0}
@media(max-width:980px){.layout{grid-template-columns:1fr}aside{position:fixed;left:0;width:min(345px,88vw);transform:translateX(-102%);transition:.25s;box-shadow:var(--shadow)}aside.open{transform:none}.mobile{display:inline-flex}.card,.card.third{grid-column:1/-1}.terms{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}}

@media print{aside,.top,.modal,.check{display:none!important}.layout{display:block}.content{max-width:none;padding:0}.card{box-shadow:none;break-inside:avoid}body{background:#fff;color:#000}}

<script>
const TOPICS=[{"id": 1, "title": "Axiomensysteme, Modellbildung, Euklidische Axiome, Inzidenzaxiome", "sub": "Wie aus wenigen Grundannahmen eine geometrische Theorie entsteht", "opening": "Ich würde zunächst zwischen undefinierten Grundbegriffen, Axiomen, Definitionen und Sätzen unterscheiden. Ein Axiomensystem legt die Spielregeln eines mathematischen Modells fest. Im Skript wird die ebene Geometrie schrittweise aus Inzidenz-, Abstands-, Anordnungs-, Bewegungs- und später dem Parallelenaxiom aufgebaut.", "core": ["<b>Axiom:</b> innerhalb der Theorie ohne Beweis angenommene Grundaussage.", "<b>Modell:</b> konkrete Interpretation der Grundbegriffe, in der alle Axiome erfüllt sind.", "<b>Inz-1:</b> Durch je zwei verschiedene Punkte verläuft genau eine Gerade.", "<b>Inz-2:</b> Auf jeder Geraden liegen mindestens zwei verschiedene Punkte.", "<b>Inz-3:</b> Es existieren drei paarweise verschiedene, nicht kollineare Punkte.", "<b>Moderne Axiomatik:</b> Grundbegriffe bleiben undefiniert; definierte Begriffe werden daraus aufgebaut."], "terms": [["Axiom", "Eine Spielregel am Anfang der Theorie."], ["Grundbegriff", "Ein absichtlich nicht definierter Startbegriff wie Punkt oder Gerade."], ["Modell", "Eine konkrete Welt, in der man prüft, ob die Axiome gelten."], ["Widerspruchsfrei", "Es kann nicht zugleich eine Aussage und ihr Gegenteil folgen."]], "proof": "Zwei verschiedene Geraden besitzen höchstens einen gemeinsamen Punkt: Hätten sie zwei gemeinsame Punkte A und B, wären beide nach Inz-1 die eindeutig bestimmte Gerade durch A und B.", "qa": [["Was unterscheidet Axiom und Satz?", "Ein Axiom wird vorausgesetzt; ein Satz wird logisch aus Axiomen, Definitionen und bereits bewiesenen Sätzen hergeleitet."], ["Warum sind Euklids Definitionen modern problematisch?", "Formulierungen wie „Ein Punkt ist, was keine Teile hat“ legen keine mathematisch prüfbare Struktur fest. Moderne Systeme lassen Grundbegriffe bewusst undefiniert."], ["Warum ist das fünfte Postulat besonders?", "Es ist komplexer als die übrigen Postulate. Nicht-euklidische Modelle zeigen, dass es nicht aus den Axiomen der absoluten Geometrie folgt."], ["Welche Ziele hat ein Axiomensystem?", "Es soll widerspruchsfrei, möglichst unabhängig beziehungsweise minimal und für die interessierenden Aussagen ausreichend vollständig sein."]], "sketch": "incidence", "connections": "Grundlage aller Themen. In der Prüfung ist stets wichtig, ob eine Aussage Definition, Axiom oder bereits bewiesener Satz ist.", "ref": "Skript: Kap. 1.2–2.1 (Axiomatik, Modelle, Inzidenz)"}, {"id": 2, "title": "Abstands- und Anordnungsaxiome", "sub": "Metrik, Geraden, Zwischenrelation, Strecke und Strahl", "opening": "Nach der reinen Inzidenz wird eine Metrik eingeführt. Sie ordnet je zwei Punkten einen Abstand zu. Das Geradenaxiom Ger-1 verbindet Abstand und Kollinearität. Daraus entstehen die Zwischenrelation und anschließend Strecke, offene Strecke, Halbgerade und Strahl.", "core": ["<b>Metrik:</b> positive Definitheit, Symmetrie und Dreiecksungleichung.", "<b>Ger-1:</b> Drei Punkte liegen genau dann auf einer Geraden, wenn einer der drei Abstände die Summe der beiden anderen ist.", "<b>Zwischenrelation:</b> A–B–C genau dann, wenn die Punkte verschieden sind und d(A,B)+d(B,C)=d(A,C).", "<b>Strecke AB:</b> A, B und alle Punkte zwischen ihnen.", "<b>Strahl AB⁺:</b> Anfangspunkt A und die durch B festgelegte Richtung."], "terms": [["Metrik", "Eine Vorschrift, die sich wie ein vernünftiger Abstand verhält."], ["Dreiecksungleichung", "Der direkte Weg ist nie länger als ein Umweg."], ["Kollinear", "Punkte liegen auf derselben Geraden."], ["Zwischen", "B liegt ohne Umweg auf dem Weg von A nach C."]], "proof": "Aus A–B–C folgt auch C–B–A, weil die Metrik symmetrisch ist. Die Gleichung d(A,B)+d(B,C)=d(A,C) bleibt beim Vertauschen von A und C erhalten.", "qa": [["Welche Eigenschaften muss eine Metrik erfüllen?", "Nichtnegativität mit d(A,B)=0 genau für A=B, Symmetrie und Dreiecksungleichung."], ["Wie wird „B liegt zwischen A und C“ definiert?", "Die Punkte sind paarweise verschieden und d(A,B)+d(B,C)=d(A,C)."], ["Warum genügt eine beliebige Metrik nicht für die üblichen Geraden?", "Sie kann die Metrikaxiome erfüllen, aber Ger-1 mit der gewählten Geradenmenge verletzen, etwa bei Taxi- oder Maximumsmetrik."], ["Wie hängt das Skalarprodukt mit dem Abstand zusammen?", "Im R² gilt ‖x‖=√⟨x,x⟩ und d(x,y)=‖x−y‖. Cauchy-Schwarz liefert die Norm-Dreiecksungleichung."]], "sketch": "between", "connections": "Vorbereitung auf Halbebenen, Winkel, Polygone und alle späteren Längenargumente.", "ref": "Skript: Kap. 3.1–3.3 (Metrik, Geraden, Zwischenrelation)"}, {"id": 3, "title": "Halbebenen", "sub": "Halbebenenaxiom, konvexe Mengen und Winkel", "opening": "Das Halbebenenaxiom macht die Punktmenge zur Ebene: Jede Gerade zerlegt sie in zwei offene Halbebenen und die Gerade selbst. Punkte derselben Halbebene lassen sich durch eine Strecke verbinden, ohne die Randgerade zu schneiden; bei Punkten verschiedener Halbebenen muss die Strecke die Randgerade schneiden.", "core": ["<b>Konvex:</b> Mit je zwei Punkten liegt die ganze Verbindungsstrecke in der Menge.", "<b>HE.1:</b> g sowie zwei nichtleere, disjunkte offene Halbebenen zerlegen die Ebene.", "<b>HE.2:</b> Die Strecke zwischen Punkten derselben Halbebene bleibt in ihr.", "<b>HE.3:</b> Die Strecke zwischen Punkten verschiedener Halbebenen schneidet g.", "<b>Abgeschlossene Halbebene:</b> offene Halbebene zusammen mit g."], "terms": [["Halbebene", "Eine der beiden Seiten einer unendlich langen Geraden."], ["Offen", "Die Randgerade gehört nicht dazu."], ["Abgeschlossen", "Die Randgerade gehört dazu."], ["Konvex", "Es gibt keine Einbuchtung, die eine Verbindungsstrecke hinausführt."]], "proof": "Die offenen Halbebenen sind konvex; das ist genau HE.2. Die Eindeutigkeit des Halbebenenpaares folgt, indem man einen Punkt festhält und über die Schnitt- beziehungsweise Nichtschnitt-Eigenschaft alle weiteren Punkte zuordnet.", "qa": [["Was leistet das Halbebenenaxiom?", "Es formalisiert die zweidimensionale Trennwirkung einer Geraden und ermöglicht präzise Aussagen über dieselbe Seite, Inneres und Überschneidungen."], ["Was ist der Unterschied zwischen offen und abgeschlossen?", "Eine offene Halbebene enthält die Randgerade nicht, eine abgeschlossene enthält sie."], ["Was ist der Unterschied zwischen Winkel und Winkelmaß?", "Der Winkel ist das geometrische Objekt aus zwei Halbgeraden; das Winkelmaß ist die zugehörige Zahl."], ["Ist die Kreislinie konvex?", "Nein. Die Strecke zwischen zwei Kreispunkten liegt meist im Kreisinneren, nicht auf der Kreislinie. Die Kreisscheibe ist dagegen konvex."]], "sketch": "halfplane", "connections": "Das Halbebenenaxiom trägt den Satz von Pasch, Polygoninneres und viele Lagebeweise.", "ref": "Skript: Kap. 3.4–3.5 (Konvexität, Halbebenen, Winkel)"}, {"id": 4, "title": "Polygone und Kreise", "sub": "Polygonlinie, echte und konvexe Polygone, Vierecke und Kreise", "opening": "Bei Polygonen muss man Eckenfolge, Randlinie und Inneres unterscheiden. Ein Polygon kann echt oder unecht, konvex oder nichtkonvex sowie überschlagen oder nichtüberschlagen sein. Ein Kreis ist die Menge aller Punkte mit festem Abstand zu einem Mittelpunkt.", "core": ["<b>n-Eck:</b> geordnete Folge von n Eckpunkten mit den zugehörigen Seiten.", "<b>Echt:</b> keine überflüssigen kollinearen Eckpunkte; die Ecken bilden tatsächlich ein n-Eck.", "<b>Überschlagen:</b> Nicht benachbarte Seiten schneiden sich in inneren Punkten.", "<b>Konvex:</b> Verbindungsstrecken bleiben in der Figur beziehungsweise ihrem Inneren.", "<b>Kreis k(M,r):</b> alle P mit d(M,P)=r; Kreisscheibe mit d(M,P)≤r."], "terms": [["Polygonlinie", "Der aus den Seiten bestehende Rand."], ["Echtes Polygon", "Ein Polygon ohne überflüssige Ecke auf einer geraden Teilstrecke."], ["Überschlagen", "Der Rand kreuzt sich selbst."], ["Kreis", "Alle Punkte im exakt gleichen Abstand vom Mittelpunkt."]], "proof": "Jedes echte Dreieck ist konvex. Formal lässt sich sein Inneres als Schnitt dreier geeigneter Halbebenen beschreiben; Halbebenen sind konvex, und der Schnitt konvexer Mengen ist wieder konvex.", "qa": [["Warum sind Polygon und Polygonlinie nicht dasselbe?", "Durch zusätzliche kollineare Eckpunkte können verschiedene Polygone dieselbe Randpunktmenge besitzen. Die Eckenfolge enthält mehr Information."], ["Wie unterscheiden sich Kreis und Kreisscheibe?", "Der Kreis verwendet Abstand genau r, die Scheibe Abstand höchstens r."], ["Kann ein echtes Polygon überschlagen sein?", "Ja. Echtheit verhindert vor allem degenerierte Ecken; Selbstschnitt ist eine andere Eigenschaft."], ["Wie viele Diagonalen besitzt ein n-Eck?", "n(n−3)/2, weil von jeder Ecke n−3 Diagonalen ausgehen und jede zweimal gezählt wird."]], "sketch": "polygons", "connections": "Dreiecke, Vierecke und Kreise sind die Träger der späteren Kongruenz-, Ähnlichkeits- und Winkelsätze.", "ref": "Skript: Kap. 4.1 und 4.4 (Polygone und Kreise)"}, {"id": 5, "title": "Konstruktion mit Zirkel und Lineal", "sub": "Zulässige Schritte, Beschreibung und Korrektheitsbeweis", "opening": "Eine Konstruktion besteht nicht nur aus einer Zeichnung. Sie braucht eine präzise Konstruktionsbeschreibung, den Nachweis der Ausführbarkeit und einen Korrektheitsbeweis, dass das Ergebnis die geforderte Eigenschaft besitzt.", "core": ["<b>Lineal:</b> Gerade durch zwei konstruierte verschiedene Punkte.", "<b>Zirkel:</b> Kreis mit konstruiertem Mittelpunkt und konstruiertem Radius.", "<b>Schnittoperationen:</b> Gerade–Gerade, Gerade–Kreis und Kreis–Kreis.", "<b>Korrektheitsbeweis:</b> Die Zieleigenschaft folgt aus den Konstruktionsschritten.", "<b>Grundkonstruktionen:</b> Mittelsenkrechte, Winkelhalbierende, Lot, Parallele, Strecken- und Winkelübertragung."], "terms": [["Konstruktionsanalyse", "Rückwärts überlegen, welche bekannten Sätze zur gesuchten Figur führen."], ["Konstruktionsbeschreibung", "Ein Rezept nur aus erlaubten Operationen."], ["Korrektheitsbeweis", "Warum das Rezept das richtige Objekt liefert."], ["Ausführbarkeit", "Warum alle benötigten Schnittpunkte tatsächlich existieren."]], "proof": "Mittelsenkrechte: Kreise gleichen Radius um A und B schneiden sich in P und Q. Wegen PA=PB und QA=QB liegen P und Q auf der Ortslinie gleich weit entfernter Punkte; PQ ist die Mittelsenkrechte.", "qa": [["Was gehört zu einer vollständigen Konstruktionslösung?", "Gegeben, gesucht, nummerierte Schritte, Zeichnung und Korrektheitsbeweis; gegebenenfalls Ausführbarkeit und Lösungsanzahl."], ["Wie konstruiert man die Winkelhalbierende?", "Gleicher Kreisradius auf beiden Schenkeln, dann Kreisschnitt aus den beiden Treffpunkten. SSS liefert zwei kongruente Teildreiecke."], ["Was muss bei zwei Kreisen geprüft werden?", "Für zwei Schnittpunkte gilt |r₁−r₂|<d(M₁,M₂)<r₁+r₂; Gleichheiten führen zu Berührung."], ["Was unterscheidet Zeichnen und Konstruieren?", "Zeichnen darf messen oder annähern; Konstruieren erzeugt das Objekt exakt mit endlich vielen erlaubten Schritten."]], "sketch": "construction", "connections": "Kongruenz, Ortslinien, Strahlensätze, Pythagoras und Kreisgeometrie begründen die Konstruktionen.", "ref": "Skript: Kap. 4.5 (Konstruktion mit Zirkel und Lineal)"}, {"id": 6, "title": "Dreiecke und Winkel", "sub": "Inneres, Satz von Pasch, Ecktransversalensatz und Dreieckseinzigkeit", "opening": "Ein echtes Dreieck ist ein konvexes 3-Eck. Sein Inneres lässt sich über passende Halbebenen beschreiben. Der Satz von Pasch kontrolliert, wie eine Gerade ein Dreieck durchquert; der Ecktransversalensatz beschreibt einen Strahl vom Eckpunkt durch das Innere.", "core": ["<b>Satz von Pasch:</b> Schneidet eine Gerade eine Seite und keinen Eckpunkt, schneidet sie genau eine der beiden anderen Seiten.", "<b>Ecktransversalensatz:</b> Ein Strahl vom Eckpunkt durch das Innenwinkelfeld trifft die Gegenseite im Inneren.", "<b>Dreieckseinzigkeit:</b> Bei fester Grundseite, festgelegter Halbebene und zwei Abständen gibt es höchstens einen dritten Eckpunkt.", "<b>Konvexität:</b> Das Innere eines echten Dreiecks ist konvex."], "terms": [["Transversale", "Eine Gerade oder ein Strahl, der eine Figur durchschneidet."], ["Pasch", "Wer durch eine Seite hineingeht, muss durch genau eine andere hinaus."], ["Innenwinkel", "Der innerhalb des Dreiecks liegende Winkel am Eckpunkt."], ["Dreieckseinzigkeit", "Auf einer festgelegten Seite der Grundgeraden gibt es höchstens eine SSS-Lösung."]], "proof": "Pasch: Die schneidende Gerade zerlegt die Ebene in zwei Halbebenen. Die Endpunkte der geschnittenen Seite liegen verschieden. Der dritte Eckpunkt liegt bei genau einem davon; deshalb bleibt eine weitere Seite in derselben Halbebene, während die andere die Gerade schneiden muss.", "qa": [["Formulieren Sie den Satz von Pasch.", "Schneidet eine Gerade eine Seite eines echten Dreiecks in einem inneren Punkt und verläuft sie durch keinen Eckpunkt, dann schneidet sie genau eine der beiden anderen Seiten."], ["Was sagt Dreieckseinzigkeit nicht?", "Sie garantiert höchstens eine Lösung, nicht deren Existenz. Diese muss etwa über Kreisschnitte gezeigt werden."], ["Warum ist „genau eine“ bei Pasch wichtig?", "Die Halbebenenlage schließt sowohl keinen weiteren als auch zwei weitere Seitenschnitte aus."], ["Warum ist jedes echte Dreieck konvex?", "Sein Inneres ist der Schnitt geeigneter konvexer Halbebenen."]], "sketch": "pasch", "connections": "Pasch verbindet Halbebenen mit Dreiecksgeometrie und wird bei Transversalen und Lagebeweisen benötigt.", "ref": "Skript: Kap. 4.2 (Dreiecke, Pasch, Transversalen)"}, {"id": 7, "title": "Bewegungen", "sub": "Abstandstreue Abbildungen, Gruppe, Invarianten und Fahnensatz", "opening": "Eine Bewegung ist eine abstandserhaltende Abbildung der Ebene auf sich. Alle Bewegungen bilden mit der Verkettung eine Gruppe. Aus der Abstandstreue folgen Geradentreue, Zwischenrelationstreue und Erhaltung von Strecken, Kreisen und Winkelkongruenz.", "core": ["<b>Bewegung:</b> φ:P→P mit d(φ(A),φ(B))=d(A,B) für alle A,B.", "<b>Gruppe:</b> Abschluss, Assoziativität, Identität und inverse Bewegung.", "<b>Invarianten:</b> Abstand, Kollinearität, Zwischenlage, Geraden, Strecken, Halbebenen und Winkelkongruenz.", "<b>Fahne:</b> Halbgerade zusammen mit einer angrenzenden Halbebene.", "<b>Fahnensatz:</b> Zu je zwei Fahnen gibt es genau eine Bewegung, die die erste auf die zweite abbildet."], "terms": [["Bewegung", "Eine starre Abbildung ohne Strecken oder Stauchen."], ["Invariant", "Eine Eigenschaft, die unverändert bleibt."], ["Verkettung", "Abbildungen nacheinander ausführen."], ["Fahne", "Gerichteter Mast plus Information über die Seite des Fahnentuchs."]], "proof": "Bewegungen sind injektiv: Aus φ(A)=φ(B) folgt 0=d(φ(A),φ(B))=d(A,B), also A=B. Geradentreue folgt, weil die für Kollinearität charakteristischen Abstandssummen erhalten bleiben.", "qa": [["Warum ist eine Bewegung injektiv?", "Gleiche Bildpunkte hätten Abstand null; wegen Abstandstreue hätten auch die Urbilder Abstand null und wären gleich."], ["Welche Eigenschaften bleiben erhalten?", "Abstände, Geraden, Zwischenlage, Strecken, Strahlen, Halbebenen, Kreise und Winkelkongruenz."], ["Was besagt der Fahnensatz?", "Mast, Anfangspunkt, Richtung und gewählte Seite legen die Bewegung zwischen zwei Fahnen eindeutig fest."], ["Warum gibt es für zwei Punktpaare typischerweise zwei Bewegungen?", "Die Bildseite der Ausgangsgeraden ist noch offen; die beiden Möglichkeiten unterscheiden sich durch Spiegelung an der Bildgeraden."]], "sketch": "motion", "connections": "Kongruenz wird über Bewegungen definiert; Spiegelung, Drehung, Verschiebung und Schubspiegelung sind spezielle Bewegungen.", "ref": "Skript: Kap. 5.1 und 5.3 (Bewegungen, Fahnensatz)"}, {"id": 8, "title": "Kongruenz", "sub": "Deckungsgleichheit als Äquivalenzrelation und Dreieckskongruenzsätze", "opening": "Zwei Figuren sind kongruent, wenn eine Bewegung die eine auf die andere abbildet. Wegen der Bewegungsgruppe ist Kongruenz eine Äquivalenzrelation. Die Dreieckskongruenzsätze legen eine Figur mit wenigen Daten eindeutig fest.", "core": ["<b>Kongruenz:</b> F₁≅F₂, falls eine Bewegung F₁ auf F₂ abbildet.", "<b>Äquivalenzrelation:</b> reflexiv, symmetrisch und transitiv.", "<b>SSS:</b> drei entsprechende Seiten gleich.", "<b>SWS:</b> zwei Seiten und eingeschlossener Winkel gleich.", "<b>WSW:</b> eine Seite und die beiden anliegenden Winkel gleich.", "<b>SSW:</b> zwei Seiten und der der längeren Seite gegenüberliegende Winkel gleich."], "terms": [["Kongruent", "Deckungsgleich ohne Größenänderung."], ["Äquivalenzrelation", "Gleichheit in einer bestimmten Hinsicht."], ["Eingeschlossener Winkel", "Der Winkel zwischen den beiden genannten Seiten."], ["SSW-Falle", "Der Winkel muss passend zur längeren gegebenen Seite liegen, sonst sind zwei Lösungen möglich."]], "proof": "Kongruenz ist reflexiv durch die Identität, symmetrisch durch die inverse Bewegung und transitiv durch die Verkettung. SWS folgt aus Winkelabtragung und eindeutiger Punktabtragung auf dem zweiten Schenkel.", "qa": [["Warum ist WWW kein Kongruenzsatz?", "Gleiche Winkel legen nur die Form fest. Dreiecke unterschiedlicher Größe können dieselben Winkel haben."], ["Wie lautet SSW korrekt?", "Zwei Seiten und der Winkel gegenüber der jeweils längeren dieser Seiten stimmen überein."], ["Wie hängen gleiche Länge und Streckenkongruenz zusammen?", "Bewegungen erhalten Längen; umgekehrt lässt sich jede Strecke auf eine gleich lange Strecke abbilden."], ["Warum folgt die Äquivalenzrelation aus der Gruppe?", "Identität, inverse Abbildung und Verkettung liefern genau Reflexivität, Symmetrie und Transitivität."]], "sketch": "congruence", "connections": "Kongruenzsätze begründen Basiswinkel, Scheitelwinkel, Lot, Mittelsenkrechte und viele Kreissätze.", "ref": "Skript: Kap. 5.2, 5.4 und 5.5 (Kongruenz)"}, {"id": 9, "title": "Anwendungen von Kongruenzsätzen", "sub": "Basiswinkel, Scheitelwinkel, Nebenwinkel, Lot und Mittelsenkrechte", "opening": "Kongruenzsätze liefern klassische Schulsätze als logische Konsequenzen. Zentral sind Basiswinkelsatz und Umkehrung, Scheitel- und Nebenwinkelsatz sowie Existenz und Eindeutigkeit von Lot und Mittelsenkrechter.", "core": ["<b>Basiswinkelsatz:</b> Im gleichschenkligen Dreieck sind die Basiswinkel kongruent.", "<b>Umkehrung:</b> Gleiche Winkel stehen gleich langen Seiten gegenüber.", "<b>Scheitelwinkelsatz:</b> Gegenüberliegende Winkel an zwei sich schneidenden Geraden sind kongruent.", "<b>Nebenwinkelsatz:</b> Die Maße zweier Nebenwinkel ergeben π beziehungsweise 180°.", "<b>Mittelsenkrechten-Ortslinie:</b> P liegt genau dann darauf, wenn |PA|=|PB|."], "terms": [["Gleichschenklig", "Zwei Dreiecksseiten sind gleich lang."], ["Scheitelwinkel", "Gegenüberliegende Winkel am Geradenschnitt."], ["Nebenwinkel", "Benachbarte Winkel, deren äußere Schenkel eine Gerade bilden."], ["Ortslinie", "Menge aller Punkte mit einer bestimmten Eigenschaft."]], "proof": "Basiswinkelsatz: Vergleiche ABC mit demselben Dreieck in vertauschter Zuordnung A↔B. Drei Seiten stimmen überein; SSS liefert gleiche Basiswinkel. Mittelsenkrechte: PA=PB, AM=BM und PM gemeinsam liefern SSS und rechte Nebenwinkel bei M.", "qa": [["Was ist die Ortslinienaussage der Mittelsenkrechten?", "Sie besteht genau aus allen Punkten, die von den beiden Endpunkten der Strecke gleich weit entfernt sind."], ["Warum ist ein Lot eindeutig?", "Zwei verschiedene Lote würden ein Dreieck mit zwei rechten Innenwinkeln erzeugen, was der Winkelordnung beziehungsweise dem schwachen Außenwinkelsatz widerspricht."], ["Wie folgt der Scheitelwinkelsatz?", "Beide Scheitelwinkel sind Ergänzungen zu demselben Nebenwinkel; die Ergänzung ist eindeutig. Alternativ nutzt man eine passende Bewegung."], ["Welche Voraussetzung hat der Nebenwinkelsatz?", "Ein gemeinsamer Schenkel, während die beiden anderen Schenkel entgegengesetzte Halbgeraden bilden."]], "sketch": "angleapps", "connections": "Diese Aussagen werden in Konstruktionen, bei Dreieckszentren, Spiegelungen und Kreisgeometrie ständig verwendet.", "ref": "Skript: Kap. 5.4–5.5 (Anwendungen der Kongruenzsätze)"}, {"id": 10, "title": "Winkelgrößen im Dreieck – ohne Parallelenaxiom", "sub": "Winkelmaß, schwacher Außenwinkelsatz und Stufenwinkelkriterium", "opening": "Vor dem Parallelenaxiom steht bereits ein Winkelmaß zur Verfügung. Der schwache Außenwinkelsatz sagt: Jeder Innenwinkel ist kleiner als jeder nicht anliegende Außenwinkel. Die Innenwinkelsumme von 180 Grad darf an dieser Stelle noch nicht benutzt werden.", "core": ["<b>Winkelmaß:</b> kongruenztreu, additiv und auf den gestreckten Winkel mit π normiert.", "<b>Schwacher Außenwinkelsatz:</b> Jeder Innenwinkel ist kleiner als jeder nicht anliegende Außenwinkel.", "<b>Folge:</b> Ein Dreieck besitzt höchstens einen rechten oder stumpfen Innenwinkel.", "<b>Parallelitätskriterium:</b> Kongruente geeignete Stufenwinkel erzwingen Parallelität.", "<b>Noch nicht verfügbar:</b> Innenwinkelsumme π und starker Außenwinkelsatz."], "terms": [["Absolute Geometrie", "Der Teil ohne spezielles Parallelenaxiom."], ["Außenwinkel", "Ein Nebenwinkel zu einem Dreiecksinnenwinkel."], ["Nicht anliegend", "Nicht direkt am verglichenen Innenwinkel."], ["Stufenwinkel", "Winkel in gleicher Lage an zwei durch eine Transversale geschnittenen Geraden."]], "proof": "Für den schwachen Außenwinkelsatz halbiert man eine Seite, verlängert eine Seitenhalbierende um dieselbe Länge und erzeugt zwei kongruente Dreiecke nach SWS. Der Innenwinkel erscheint dann als echter Teil des Außenwinkels.", "qa": [["Warum darf man noch nicht α+β+γ=180° verwenden?", "Der übliche Beweis benötigt die eindeutige Parallele durch einen Eckpunkt und damit das euklidische Parallelenaxiom."], ["Wie lautet der schwache Außenwinkelsatz?", "Jeder Innenwinkel eines echten Dreiecks ist kleiner als jeder nicht anliegende Außenwinkel."], ["Was unterscheidet schwachen und starken Außenwinkelsatz?", "Der schwache Satz ist eine Ungleichung; der starke gibt die Gleichheit Außenwinkel = Summe der beiden entfernten Innenwinkel."], ["Welche Stufenwinkelrichtung gilt bereits als Kriterium?", "Sind geeignete Stufenwinkel kongruent, dann sind die Geraden parallel. Die converse Aussage für gegebene Parallelen nutzt das Parallelenaxiom."]], "sketch": "exterior", "connections": "Typische Prüfungsstelle für die Frage, welche Aussage schon absolut und welche erst euklidisch gilt.", "ref": "Skript: Kap. 5.6–6.1 (Winkelmaß, absolute Geometrie)"}, {"id": 11, "title": "Spiegelungen und Drehungen", "sub": "Definitionen, Fixpunkte und Verkettung von Geradenspiegelungen", "opening": "Eine Geradenspiegelung lässt ihre Achse punktweise fest und vertauscht die Halbebenen. Drehungen entstehen als Verkettung zweier Spiegelungen an sich schneidenden Geraden. Das Zentrum ist ihr Schnittpunkt; der Drehwinkel ist doppelt so groß wie der Achsenwinkel.", "core": ["<b>Spiegelung σg:</b> g ist Mittelsenkrechte von Pσg(P) für P außerhalb von g.", "<b>Involution:</b> σg∘σg=id.", "<b>Drehung:</b> δ=σb∘σa bei sich schneidenden Achsen a,b.", "<b>Drehzentrum:</b> a∩b ist Fixpunkt.", "<b>Drehwinkel:</b> doppelte gerichtete Winkelgröße von a zu b; Reihenfolge zählt."], "terms": [["Fixpunkt", "Ein Punkt, der an seinem Ort bleibt."], ["Fixgerade", "Eine Gerade, deren jeder Punkt fest bleibt."], ["Involution", "Zweimal ausführen ergibt die Identität."], ["Drehzentrum", "Der einzige Fixpunkt einer echten Drehung."]], "proof": "Zwei Spiegelungen an sich schneidenden Achsen fixieren deren Schnittpunkt Z. Die Richtungsänderungen addieren sich zum doppelten Achsenwinkel. Vertauscht man die Reihenfolge, erhält man die inverse Drehung.", "qa": [["Wie konstruiert man das Spiegelbild P′ an g?", "Lot von P auf g mit Fuß F; auf der anderen Seite denselben Abstand abtragen. Dann ist g die Mittelsenkrechte von PP′."], ["Welche Fixpunkte hat eine Geradenspiegelung?", "Genau alle Punkte ihrer Achse."], ["Welche Fixpunkte hat eine echte Drehung?", "Genau das Drehzentrum."], ["Warum ist eine 180°-Drehung strukturell keine Spiegelung?", "Sie ist gleichsinnig und hat einen Fixpunkt; eine Geradenspiegelung ist nicht gleichsinnig und besitzt eine Fixgerade."]], "sketch": "reflectionrotation", "connections": "Grundbaustein der Klassifikation aller Bewegungen und der Reduktionssätze.", "ref": "Skript: Kap. 5.8–5.9 (Spiegelungen und Drehungen)"}, {"id": 12, "title": "Absolute, euklidische und nicht-euklidische Geometrie", "sub": "Parallelenaxiome und ihre Konsequenzen", "opening": "Absolute Geometrie ist der gemeinsame Teil ohne spezielles Parallelenaxiom. Mit dem euklidischen Axiom erhält man genau eine Parallele durch einen äußeren Punkt. Hyperbolisch gibt es mehrere; elliptisch keine.", "core": ["<b>Absolute Geometrie:</b> gemeinsames Axiomensystem vor dem Parallelenaxiom.", "<b>Euklidisch:</b> Durch P∉g gibt es genau eine zu g parallele Gerade.", "<b>Hyperbolisch:</b> Durch P gibt es mehrere, tatsächlich unendlich viele, disjunkte Geraden.", "<b>Elliptisch:</b> Es gibt keine Parallelen.", "<b>Innenwinkelsumme:</b> euklidisch =π, hyperbolisch <π, sphärisch anschaulich >π."], "terms": [["Parallel", "Verschiedene Geraden ohne gemeinsamen Punkt."], ["Absolut", "Unabhängig von der gewählten Parallelentheorie."], ["Hyperbolisch", "Geometrie mit mehreren Parallelen."], ["Elliptisch", "Geometrie ohne Parallelen."]], "proof": "Die Unabhängigkeit wird durch Modelle sichtbar: Erfüllen verschiedene Modelle alle absoluten Axiome, aber widersprechen sich beim Parallelenaxiom, kann dieses nicht aus den absoluten Axiomen hergeleitet werden.", "qa": [["Was ist absolute Geometrie?", "Alle Sätze aus den Axiomen vor dem Parallelenaxiom."], ["Formulieren Sie das euklidische Parallelenaxiom.", "Zu g und P außerhalb existiert genau eine Gerade durch P, die g nicht schneidet."], ["Welche sichtbare Konsequenz unterscheidet die Geometrien?", "Die Innenwinkelsumme eines Dreiecks."], ["Ist die Kugel exakt die elliptische Ebene?", "Sie ist ein anschauliches sphärisches Modell. Für ein strenges elliptisches Modell identifiziert man meist antipodale Punkte."]], "sketch": "geometries", "connections": "Erklärt, warum bestimmte Beweise und Sätze erst nach Einführung des Parallelenaxioms zulässig sind.", "ref": "Skript: Kap. 6 (Absolute und nicht-euklidische Geometrie)"}, {"id": 13, "title": "Konsequenzen des Parallelenaxioms", "sub": "Stufenwinkel, Innenwinkelsumme, Außenwinkel, Parallelogramm und Mittenlinie", "opening": "Mit dem euklidischen Parallelenaxiom werden die vertrauten Schulwinkelsätze verfügbar. Parallelen erzeugen kongruente Stufen- und Wechselwinkel; daraus folgen Innenwinkelsumme, starker Außenwinkelsatz und Eigenschaften von Parallelogramm und Mittenlinie.", "core": ["<b>Stufenwinkelsatz:</b> An Parallelen sind entsprechende Winkel kongruent.", "<b>Wechselwinkelsatz:</b> An Parallelen sind Wechselwinkel kongruent.", "<b>Innenwinkelsatz:</b> α+β+γ=π.", "<b>Starker Außenwinkelsatz:</b> Außenwinkel = Summe der beiden nicht anliegenden Innenwinkel.", "<b>Parallelogramm:</b> Gegenseiten und Gegenwinkel kongruent; Diagonalen halbieren einander.", "<b>Mittenlinie:</b> parallel zur dritten Seite und halb so lang."], "terms": [["Stufenwinkel", "Winkel in gleicher Lage an zwei Parallelen."], ["Wechselwinkel", "Winkel auf wechselnden Seiten der Transversalen."], ["Parallelogramm", "Viereck mit zwei Paaren paralleler Gegenseiten."], ["Mittenlinie", "Verbindung zweier Seitenmittelpunkte."]], "proof": "Innenwinkelsatz: Durch C wird die eindeutige Parallele zu AB gezogen. Die Winkel bei A und B erscheinen an C als Wechselwinkel. Zusammen mit γ bilden sie einen gestreckten Winkel.", "qa": [["Wo wird das Parallelenaxiom im Innenwinkelsummenbeweis benutzt?", "Bei der eindeutigen Parallelen durch C und beim daraus gewonnenen Winkelübertrag."], ["Wie lautet der starke Außenwinkelsatz?", "Ein Außenwinkelmaß ist die Summe der beiden nicht anliegenden Innenwinkelmaße."], ["Was folgt für ein konvexes Viereck?", "Eine Diagonale zerlegt es in zwei Dreiecke; die Innenwinkelsumme beträgt 2π."], ["Welche Eigenschaften charakterisieren ein Parallelogramm?", "Unter passenden Voraussetzungen: beide Gegenseitenpaare parallel, beide gleich lang oder die Diagonalen halbieren einander."]], "sketch": "parallelangles", "connections": "Basis für Transversalen, Strahlensätze, Ähnlichkeit und große Teile der Schulgeometrie.", "ref": "Skript: Kap. 7.1–7.2 (Folgerungen des Parallelenaxioms)"}, {"id": 14, "title": "Transversalen im Dreieck", "sub": "Inkreis-, Umkreis-, Höhen- und Schwerpunkt", "opening": "Vier klassische Geradenfamilien besitzen jeweils einen gemeinsamen Schnittpunkt: Winkelhalbierende, Mittelsenkrechten, Höhen und Seitenhalbierende. Die Beweise nutzen ihre Ortslinieneigenschaften.", "core": ["<b>Winkelhalbierende:</b> Schnittpunkt I ist zu allen Seiten gleich weit entfernt; Inkreismittelpunkt.", "<b>Mittelsenkrechten:</b> Schnittpunkt U ist zu allen Ecken gleich weit entfernt; Umkreismittelpunkt.", "<b>Höhen:</b> schneiden sich im Orthozentrum H.", "<b>Seitenhalbierende:</b> schneiden sich im Schwerpunkt S.", "<b>Teilungsverhältnis:</b> S teilt jede Seitenhalbierende von der Ecke aus im Verhältnis 2:1."], "terms": [["Winkelhalbierende", "Teilt einen Winkel in zwei gleiche Winkel."], ["Mittelsenkrechte", "Lot durch den Mittelpunkt einer Strecke."], ["Höhe", "Lot von einer Ecke auf die Gegenseitengerade."], ["Seitenhalbierende", "Verbindung einer Ecke mit dem Gegenseitenmittelpunkt."]], "proof": "Umkreismittelpunkt: Der Schnitt zweier Mittelsenkrechten erfüllt UA=UB und UB=UC, also UA=UC. Damit liegt er auch auf der dritten Mittelsenkrechten. Analog nutzt der Inkreismittelpunkt gleiche Abstände zu den Schenkeln.", "qa": [["Warum genügen zwei Mittelsenkrechten?", "Gleiche Abstände sind transitiv; der Schnittpunkt liegt daher automatisch auch auf der dritten."], ["Wo kann der Umkreismittelpunkt liegen?", "Spitzwinklig innen, rechtwinklig im Hypotenusenmittelpunkt, stumpfwinklig außen."], ["Wo liegt der Inkreismittelpunkt?", "Immer im Inneren des Dreiecks."], ["Wie teilt der Schwerpunkt eine Seitenhalbierende?", "Im Verhältnis 2:1, der längere Abschnitt liegt an der Ecke."]], "sketch": "centers", "connections": "Verbindet Ortslinien aus Kongruenz, Mittenlinien aus Parallelität und Ähnlichkeit.", "ref": "Skript: Kap. 7.4 (Transversalen im Dreieck)"}, {"id": 15, "title": "Verschiebungen und Schubspiegelungen", "sub": "Definitionen, Eigenschaften und Orientierung", "opening": "Eine Verschiebung entsteht aus zwei Spiegelungen an parallelen Geraden. Alle Punkte werden um denselben Vektor bewegt. Eine Schubspiegelung kombiniert eine Spiegelung mit einer Verschiebung entlang der Achse.", "core": ["<b>Verschiebung τ:</b> τ=σb∘σa für parallele Geraden a,b.", "<b>Wirkung:</b> gleicher Verschiebungsvektor für alle Punkte; Geraden gehen in parallele Geraden über.", "<b>Schubspiegelung:</b> Spiegelung an einer Achse plus Verschiebung parallel zu ihr.", "<b>Fixpunkte:</b> echte Verschiebung und echte Schubspiegelung haben keine.", "<b>Orientierung:</b> Verschiebung gleichsinnig, Schubspiegelung nicht gleichsinnig."], "terms": [["Verschiebungsvektor", "Pfeil mit Richtung und Länge der Bewegung."], ["Schubspiegelung", "Spiegeln und entlang der Achse verschieben."], ["Echte Verschiebung", "Nicht die Identität."], ["Orientierung", "Umlaufrichtung einer beschrifteten Figur."]], "proof": "Bei zwei parallelen Spiegelachsen steht der Verschiebungsvektor senkrecht auf ihnen und hat die doppelte Länge ihres Abstands. Ein Fixpunkt einer echten Verschiebung würde einen Nullvektor erzwingen und damit die Identität.", "qa": [["Wie entsteht der Verschiebungsvektor?", "Er zeigt von der ersten zur zweiten Achse in Normalenrichtung und ist doppelt so lang wie der Achsenabstand."], ["Welche Geraden bleiben als Mengen invariant?", "Geraden parallel zum Verschiebungsvektor; andere werden auf echte parallele Geraden abgebildet."], ["Was unterscheidet Schub- und Geradenspiegelung?", "Die Geradenspiegelung hat eine Fixgerade; eine echte Schubspiegelung keine Fixpunkte."], ["Kommutieren Spiegelung und Schub?", "Eine Verschiebung parallel zur Spiegelachse kommutiert mit der Spiegelung an dieser Achse."]], "sketch": "translationglide", "connections": "Teil der vollständigen Bewegungsclassification und eng mit Gleichsinnigkeit verbunden.", "ref": "Skript: Kap. 8.1–8.2 (Verschiebungen, Schubspiegelungen)"}, {"id": 16, "title": "Reduktionssätze", "sub": "Dreispiegelungssatz, Bewegungsarten und Gleichsinnigkeit", "opening": "Reduktionssätze vereinfachen Verkettungen von Spiegelungen. Der Dreispiegelungssatz sagt, dass jede ebene Bewegung aus höchstens drei Geradenspiegelungen besteht. Daraus folgt die Klassifikation in fünf Arten.", "core": ["<b>Dreispiegelungssatz:</b> Jede Bewegung ist Verkettung von höchstens drei Spiegelungen.", "<b>0/1 Spiegelungen:</b> Identität beziehungsweise Geradenspiegelung.", "<b>2 Spiegelungen:</b> Drehung bei schneidenden, Verschiebung bei parallelen Achsen.", "<b>3 Spiegelungen:</b> reduzierbar auf Spiegelung oder echte Schubspiegelung.", "<b>Klassifikation:</b> Identität, Spiegelung, echte Drehung, echte Verschiebung, echte Schubspiegelung.", "<b>Gleichsinnig:</b> gerade Anzahl von Spiegelungen."], "terms": [["Reduktion", "Eine Verkettung durch eine kürzere wirkungsgleiche ersetzen."], ["Gleichsinnig", "Orientierung bleibt erhalten."], ["Nicht gleichsinnig", "Orientierung wird umgekehrt."], ["Gleichsinnige Kongruenz", "Deckung durch eine orientierungserhaltende Bewegung."]], "proof": "Die Fälle 0 bis 3 Spiegelungen werden nach Achslage geordnet. Fixpunktmenge und Orientierung trennen die fünf Arten: Fixgerade, ein Fixpunkt oder keine Fixpunkte sowie gleich- oder nichtgleichsinnig.", "qa": [["Formulieren Sie den Dreispiegelungssatz.", "Jede Bewegung der Ebene ist als Verkettung von höchstens drei Geradenspiegelungen darstellbar."], ["Welche Bewegung entsteht aus zwei Spiegelungen?", "Identität bei gleicher Achse, Verschiebung bei parallelen, Drehung bei schneidenden Achsen."], ["Welche Bewegungen sind gleichsinnig?", "Genau Identität, Drehungen und Verschiebungen."], ["Wie unterscheidet man die fünf Arten?", "Über Fixpunkte beziehungsweise Fixgeraden und über Erhalt oder Umkehrung der Orientierung."]], "sketch": "classification", "connections": "Struktureller Höhepunkt der Bewegungsgeometrie und Basis präziser Orientierungsargumente.", "ref": "Skript: Kap. 5.8 und 8.2–8.4 (Reduktionssätze)"}, {"id": 17, "title": "Strahlensätze", "sub": "Verhältnisse an Strahlen, Umkehrungen und Anwendungen", "opening": "Die Strahlensätze verbinden Parallelität mit proportionalen Strecken. Zwei Strahlen mit gemeinsamem Anfangspunkt werden von parallelen Geraden geschnitten. Dann stimmen die entsprechenden Abschnittsverhältnisse überein. Im axiomatischen Aufbau ist wichtig, keinen Zirkelschluss über Ähnlichkeit zu verwenden, wenn Ähnlichkeit erst später aus den Strahlensätzen entwickelt wird.", "core": ["<b>1. Strahlensatz:</b> Schneiden zwei Parallelen zwei Strahlen mit Zentrum O in A,B beziehungsweise A′,B′, dann gilt |OA|:|OA′| = |OB|:|OB′|.", "<b>2. Strahlensatz:</b> In derselben Figur gilt außerdem |OA|:|OA′| = |AB|:|A′B′|.", "<b>Umkehrung:</b> Geeignete gleiche Teilungsverhältnisse erzwingen die Parallelität der Verbindungsgeraden.", "<b>Mittenlinie:</b> Spezialfall des Strahlensatzes beim Teilungsverhältnis 1:2.", "<b>Verallgemeinerung:</b> Die Aussagen gelten auch bei geeigneter Lage auf entgegengesetzten Halbgeraden; dann ist die Lage sorgfältig zu beachten."], "terms": [["Proportional", "Zwei Quotienten beziehungsweise Teilungsverhältnisse sind gleich."], ["Strahlenzentrum", "Der gemeinsame Anfangspunkt der beiden Strahlen."], ["Parallelschnitt", "Eine Gerade schneidet beide Strahlen; mehrere solche Schnittgeraden sind parallel."], ["Umkehrung", "Aus einer Verhältnisgleichung wird auf Parallelität geschlossen."]], "proof": "Beweisidee der Umkehrung: Man konstruiert durch den betreffenden Punkt die Parallele. Der Strahlensatz liefert für deren Schnittpunkt dasselbe Verhältnis wie für den gegebenen Punkt. Wegen der Eindeutigkeit der Punktabtragung müssen beide Punkte zusammenfallen. Im Skript wird ausdrücklich vor einem Zirkelschluss gewarnt: Der Hauptähnlichkeitssatz darf nicht benutzt werden, wenn er später selbst aus dem Strahlensatz folgt.", "qa": [["Formulieren Sie den ersten Strahlensatz.", "Werden zwei verschiedene Strahlen mit gemeinsamem Anfangspunkt O von zwei parallelen Geraden in A,B und A′,B′ geschnitten, dann gilt |OA|:|OA′| = |OB|:|OB′|."], ["Wie lautet eine typische Umkehrung?", "Liegen A,A′ auf dem einen und B,B′ auf dem anderen Strahl und gilt das passende Verhältnis |OA|:|OA′| = |OB|:|OB′|, dann sind AB und A′B′ parallel, sofern die Punkte entsprechend angeordnet sind."], ["Wie ist der Mittenliniensatz ein Spezialfall?", "Sind A und B Mittelpunkte zweier Dreiecksseiten, betragen beide Teilungsverhältnisse 1:2. Die Verbindungsstrecke ist dann parallel zur dritten Seite und halb so lang."], ["Warum darf man nicht einfach mit Ähnlichkeit beweisen?", "In der logischen Reihenfolge des Skripts wird der Hauptähnlichkeitssatz aus dem Strahlensatz gewonnen. Ein Beweis des Strahlensatzes mit Ähnlichkeit wäre daher zirkulär."], ["Nennen Sie Anwendungen.", "Maßstab, Schattenmessung, Bestimmung unzugänglicher Längen, Teilung einer Strecke in einem vorgegebenen Verhältnis sowie Konstruktion von Produkten und Quotienten."]], "sketch": "intercept", "connections": "Direkter Übergang von Parallelität zu zentrischer Streckung und Ähnlichkeit.", "ref": "Skript: Kap. 9.2 und 12.1 (Strahlensätze und Äquivalenzen)"}, {"id": 18, "title": "Zentrische Streckung und Ähnlichkeit", "sub": "Skalieren mit Zentrum, Invarianten und Hauptähnlichkeitssatz", "opening": "Eine zentrische Streckung mit Zentrum Z und Faktor k bildet jeden Punkt P auf einen Punkt P′ der Geraden ZP ab. Der Abstand vom Zentrum wird mit |k| multipliziert; bei negativem Faktor liegt der Bildpunkt auf der entgegengesetzten Halbgeraden. Ähnlichkeitsabbildungen setzen sich aus einer zentrischen Streckung und einer Bewegung zusammen.", "core": ["<b>Zentrische Streckung ζ<sub>Z,k</sub>:</b> Z bleibt fest; für P≠Z liegt P′ auf ZP und |ZP′|=|k|·|ZP|.", "<b>Vorzeichen:</b> Bei k&gt;0 liegen P und P′ auf derselben, bei k&lt;0 auf entgegengesetzten Halbgeraden von Z.", "<b>Invarianten:</b> Zwischenrelation, Geraden, Parallelität, Strecken, Halbgeraden, Halbebenen und Winkelgrößen.", "<b>Skalierung:</b> Alle Längen werden mit |k|, Flächeninhalte mit k² multipliziert.", "<b>Ähnlichkeit:</b> Zwei Figuren sind ähnlich, wenn eine Ähnlichkeitsabbildung die eine auf die andere abbildet.", "<b>Hauptähnlichkeitssatz:</b> Stimmen zwei Winkelmaße zweier echter Dreiecke überein, sind die Dreiecke ähnlich."], "terms": [["Streckungszentrum", "Der feste Punkt, von dem aus alle Punkte radial abgebildet werden."], ["Streckungsfaktor", "|k| ist der Maßstab; das Vorzeichen legt die Richtung fest."], ["Ähnlich", "Gleiche Form, möglicherweise andere Größe."], ["Winkeltreu", "Winkelgrößen bleiben erhalten."], ["Verhältnistreu", "Quotienten entsprechender Längen bleiben gleich."]], "proof": "Winkeltreue: Eine Gerade, die nicht durch Z verläuft, wird auf eine zu ihr parallele Gerade abgebildet. Stufen- und Wechselwinkel liefern die Gleichheit der Winkelgrößen. Die Längenskalierung folgt aus den Strahlensätzen. Ähnlichkeit ist eine Äquivalenzrelation, weil Identität, inverse Abbildungen und Verkettungen wieder Ähnlichkeitsabbildungen sind.", "qa": [["Welche Fixpunkte hat eine zentrische Streckung?", "Für k≠1 ist nur das Zentrum Z fix. Für k=1 ist die Abbildung die Identität. k=0 wird ausgeschlossen, weil die Abbildung nicht bijektiv wäre."], ["Was passiert bei negativem Faktor?", "Der Bildpunkt liegt auf der entgegengesetzten Halbgeraden. Die Länge wird mit |k| skaliert; anschaulich kommt eine Drehung um 180° um Z hinzu."], ["Welche Eigenschaften bleiben nicht erhalten?", "Absolute Längen und Flächeninhalte bleiben im Allgemeinen nicht erhalten. Nur ihre Verhältnisse und alle Winkelgrößen bleiben gleich."], ["Wie lautet der Hauptähnlichkeitssatz?", "Wenn zwei echte Dreiecke in zwei entsprechenden Winkelmaßen übereinstimmen, dann sind sie ähnlich. Der dritte Winkel stimmt wegen der Innenwinkelsumme ebenfalls überein."], ["Wie hängen Kongruenz und Ähnlichkeit zusammen?", "Kongruenz ist der Spezialfall der Ähnlichkeit mit Maßstab 1."]], "sketch": "dilation", "connections": "Grundlage für die Satzgruppe des Pythagoras, Trigonometrie und viele Kreisbeweise.", "ref": "Skript: Kap. 9.1–9.3 (Streckung und Ähnlichkeit)"}, {"id": 19, "title": "Satzgruppe des Pythagoras", "sub": "Höhensatz, Kathetensatz und Pythagoras samt Umkehrungen", "opening": "In einem rechtwinkligen Dreieck teilt die Höhe auf die Hypotenuse das Dreieck in zwei kleinere Dreiecke. Alle drei Dreiecke sind zueinander ähnlich. Aus den entsprechenden Seitenverhältnissen folgen Höhensatz, Kathetensatz und Satz des Pythagoras.", "core": ["<b>Bezeichnungen:</b> c ist die Hypotenuse, h die Höhe auf c, p und q die Hypotenusenabschnitte.", "<b>Höhensatz:</b> h² = p·q.", "<b>Kathetensätze:</b> a² = c·p und b² = c·q, jeweils passend zur Projektion der Kathete.", "<b>Satz des Pythagoras:</b> a²+b²=c².", "<b>Umkehrung:</b> Erfüllen drei Seitenlängen mit c als längster Seite a²+b²=c², ist der Winkel gegenüber c recht.", "<b>Äquivalenz:</b> Im Skript werden die Sätze und ihre Umkehrungen sowie ihre gegenseitige Herleitbarkeit untersucht."], "terms": [["Hypotenuse", "Die Seite gegenüber dem rechten Winkel; sie ist die längste Seite."], ["Kathete", "Eine der beiden Seiten, die den rechten Winkel bilden."], ["Hypotenusenabschnitt", "Eines der beiden Stücke, in die der Höhenfußpunkt die Hypotenuse teilt."], ["Geometrisches Mittel", "Aus h²=pq folgt h=√(pq)."]], "proof": "Die Höhe erzeugt drei ähnliche Dreiecke. Aus der Ähnlichkeit der beiden kleinen Dreiecke folgt h/p=q/h und damit h²=pq. Aus der Ähnlichkeit eines kleinen Dreiecks mit dem Ausgangsdreieck folgen die Kathetensätze. Durch Addition erhält man a²+b²=c(p+q)=c². Für die Umkehrung konstruiert man ein rechtwinkliges Dreieck mit Katheten a und b und nutzt anschließend SSS.", "qa": [["Wie entstehen die drei ähnlichen Dreiecke?", "Alle besitzen einen rechten Winkel. Jedes kleine Dreieck teilt außerdem einen spitzen Winkel mit dem Ausgangsdreieck. Nach dem Hauptähnlichkeitssatz sind sie paarweise ähnlich."], ["Formulieren Sie den Höhensatz.", "Im rechtwinkligen Dreieck ist das Quadrat der Höhe auf die Hypotenuse gleich dem Produkt der beiden Hypotenusenabschnitte: h²=pq."], ["Formulieren Sie die Kathetensätze.", "Das Quadrat einer Kathete ist gleich dem Produkt aus Hypotenuse und Projektion dieser Kathete auf die Hypotenuse: a²=cp und b²=cq."], ["Wie folgt Pythagoras aus den Kathetensätzen?", "Durch Addition: a²+b²=cp+cq=c(p+q)=c²."], ["Was leistet die Umkehrung?", "Sie weist Rechtwinkligkeit allein anhand der drei Seitenlängen nach."]], "sketch": "pythagoras", "connections": "Verknüpft Ähnlichkeit mit Trigonometrie und Konstruktionen geometrischer Mittel.", "ref": "Skript: Kap. 9.4 und 12.1 (Satzgruppe des Pythagoras)"}, {"id": 20, "title": "Trigonometrische Funktionen", "sub": "Geometrische Definition, Sinus- und Kosinussatz, Monotonie und Addition", "opening": "Sinus und Kosinus werden geometrisch zunächst über Seitenverhältnisse rechtwinkliger Dreiecke und anschließend umfassend über den Einheitskreis beschrieben. Die Ähnlichkeit rechtwinkliger Dreiecke sichert, dass die Quotienten nur vom Winkel abhängen.", "core": ["<b>Im rechtwinkligen Dreieck:</b> sin α = Gegenkathete/Hypotenuse, cos α = Ankathete/Hypotenuse, tan α = sin α/cos α.", "<b>Einheitskreis:</b> Der Punkt zum Winkel α besitzt die Koordinaten (cos α, sin α).", "<b>Grundidentität:</b> sin²α+cos²α=1.", "<b>Kosinussatz:</b> c²=a²+b²−2ab·cos γ.", "<b>Sinussatz:</b> a/sin α=b/sin β=c/sin γ.", "<b>Additionstheoreme:</b> sin(α+β)=sinα cosβ+cosα sinβ und cos(α+β)=cosα cosβ−sinα sinβ.", "<b>Monotonie:</b> Auf geeigneten Intervallen sind Sinus beziehungsweise Kosinus streng monoton und besitzen Umkehrfunktionen."], "terms": [["Sinus", "Vertikale Koordinate am Einheitskreis; im rechtwinkligen Dreieck Gegenkathete durch Hypotenuse."], ["Kosinus", "Horizontale Koordinate am Einheitskreis; im rechtwinkligen Dreieck Ankathete durch Hypotenuse."], ["Tangens", "Quotient sin/cos und zugleich Steigung des zugehörigen Strahls."], ["Surjektiv", "Jeder Wert des angegebenen Zielbereichs wird angenommen."], ["Monoton", "Die Funktionswerte steigen oder fallen ohne Richtungswechsel."]], "proof": "Die Grundidentität folgt aus Pythagoras am Einheitskreis. Für den Kosinussatz fällt man ein Lot und beschreibt Projektion und Höhe mit Kosinus und Sinus; nach Pythagoras vereinfacht sich der Ausdruck. Die Additionstheoreme ergeben sich geometrisch aus der Verkettung zweier Drehungen beziehungsweise aus deren Koordinatendarstellung.", "qa": [["Warum sind die trigonometrischen Quotienten wohldefiniert?", "Alle rechtwinkligen Dreiecke mit demselben spitzen Winkel sind ähnlich. Daher sind die Quotienten entsprechender Seiten unabhängig von der Größe des Dreiecks."], ["Wie verallgemeinert der Kosinussatz Pythagoras?", "Für γ=90° ist cos γ=0; dann wird der Kosinussatz zu c²=a²+b²."], ["Wann verwendet man den Sinussatz?", "Typisch, wenn eine Seite mit ihrem Gegenwinkel bekannt ist und zusätzlich ein weiterer Winkel oder eine weitere Gegenseite."], ["Auf welchem Intervall ist Kosinus bijektiv auf [−1,1]?", "Auf [0,π] ist der Kosinus streng monoton fallend und nimmt jeden Wert von 1 bis −1 genau einmal an."], ["Warum schränkt man für Umkehrfunktionen das Intervall ein?", "Sinus und Kosinus sind auf ganz R periodisch und daher nicht injektiv."]], "sketch": "trig", "connections": "Anwendung von Ähnlichkeit; Werkzeug für Dreieckskonstruktionen, analytische Geometrie und Kreisgeometrie.", "ref": "Skript: Kap. 9.5–9.6 (Trigonometrie)"}, {"id": 21, "title": "Lagebeziehungen von Kreis und Gerade", "sub": "Passante, Tangente, Sekante, Berührungsradius und Tangentenabschnitte", "opening": "Die Lage einer Geraden g zu einem Kreis k(M,r) wird durch den Abstand des Mittelpunktes von der Geraden entschieden. Ist er größer als r, liegt eine Passante vor; ist er gleich r, eine Tangente; ist er kleiner r, eine Sekante.", "core": ["<b>d(M,g)&gt;r:</b> Passante, kein Schnittpunkt.", "<b>d(M,g)=r:</b> Tangente, genau ein Berührungspunkt.", "<b>d(M,g)&lt;r:</b> Sekante, zwei Schnittpunkte.", "<b>Berührungsradius:</b> Der Radius zum Berührungspunkt steht senkrecht auf der Tangente.", "<b>Umkehrung:</b> Eine Gerade durch einen Kreispunkt, die dort senkrecht auf dem Radius steht, ist Tangente.", "<b>Tangentenabschnittssatz:</b> Die beiden Tangentenstrecken von demselben äußeren Punkt an einen Kreis sind gleich lang."], "terms": [["Passante", "Eine Gerade, die am Kreis vorbeigeht."], ["Tangente", "Eine Gerade, die den Kreis in genau einem Punkt berührt."], ["Sekante", "Eine Gerade, die den Kreis in zwei Punkten schneidet."], ["Berührungsradius", "Die Strecke vom Mittelpunkt zum Berührungspunkt."], ["Tangentenabschnitt", "Die Strecke vom äußeren Punkt zum Berührungspunkt."]], "proof": "Berührungsradius: Wäre der Radius MT nicht senkrecht zur Tangente, hätte der Lotfuß L einen kleineren Abstand zum Mittelpunkt als r. Dann gäbe es auf der Geraden zwei Punkte im Abstand r von M – ein Widerspruch zur eindeutigen Berührung. Der Tangentenabschnittssatz folgt aus zwei kongruenten rechtwinkligen Dreiecken mit gemeinsamer Hypotenuse.", "qa": [["Wie entscheidet d(M,g) die Lage?", "Größer als r bedeutet Passante, gleich r Tangente, kleiner als r Sekante."], ["Formulieren Sie den Berührungsradius-Satz.", "Die Tangente steht im Berührungspunkt senkrecht auf dem Radius. Umgekehrt ist die Senkrechte zum Radius durch einen Kreispunkt die Tangente."], ["Wie konstruiert man Tangenten von einem äußeren Punkt P?", "Man konstruiert den Kreis mit Durchmesser MP. Seine Schnittpunkte mit dem gegebenen Kreis liefern nach dem Satz des Thales die Berührungspunkte."], ["Warum gibt es an einem Kreispunkt genau eine Tangente?", "Das Lot zur Radiusgeraden durch diesen Punkt ist eindeutig."], ["Was sagt der Tangentenabschnittssatz?", "Von demselben äußeren Punkt sind die beiden Tangentenabschnitte an einen Kreis gleich lang."]], "sketch": "circleline", "connections": "Pythagoras entscheidet die Schnittpunktzahl; der Satz des Thales ermöglicht die Tangentenkonstruktion.", "ref": "Skript: Kap. 10.1 (Kreise und Geraden)"}, {"id": 22, "title": "Sehnen", "sub": "Sehnen, Sehnenvierecke, Sehnenabschnitte und Tangentenvierecke", "opening": "Eine Sehne verbindet zwei Punkte eines Kreises. Ein Sehnenviereck besitzt vier Eckpunkte auf einem Kreis. Ein Tangentenviereck besitzt einen Kreis, der alle vier Seiten berührt. Produkt- und Winkelsätze charakterisieren diese Figuren.", "core": ["<b>Sehne:</b> Strecke zwischen zwei Kreispunkten; ein Durchmesser ist eine Sehne durch den Mittelpunkt.", "<b>Sehnenviereck:</b> Alle vier Eckpunkte liegen auf einem Kreis.", "<b>Winkelkriterium:</b> Im konvexen Sehnenviereck ergänzen sich gegenüberliegende Innenwinkel zu π; die Umkehrung gilt.", "<b>Sehnenabschnittssatz:</b> Schneiden sich Sehnen AB und CD in P, gilt |PA|·|PB|=|PC|·|PD|.", "<b>Tangentenviereck:</b> Alle vier Seiten sind Tangenten an einen gemeinsamen Kreis.", "<b>Seitensummen:</b> Im Tangentenviereck sind die Summen gegenüberliegender Seiten gleich."], "terms": [["Sehne", "Gerade Verbindung zweier Punkte auf derselben Kreislinie."], ["Sehnenviereck", "Ein Viereck, das in einen Kreis eingeschrieben ist."], ["Tangentenviereck", "Ein Viereck, dessen vier Seiten einen Kreis berühren."], ["Abschnittssatz", "Eine Produktgleichung für Teilstrecken an einem Schnittpunkt."], ["Umkreis/Inkreis", "Kreis durch alle Ecken beziehungsweise Kreis, der alle Seiten berührt."]], "proof": "Sehnenabschnittssatz: Geeignete Dreiecke am Schnittpunkt besitzen einen Scheitelwinkel und gleiche Peripheriewinkel; sie sind ähnlich. Aus der Proportion folgt die Produktgleichung. Beim Tangentenviereck sind die beiden Tangentenabschnitte von jeder Ecke gleich. Werden diese vier Längen mit x,y,z,w bezeichnet, ergeben beide Summen gegenüberliegender Seiten x+y+z+w.", "qa": [["Wann ist ein konvexes Viereck ein Sehnenviereck?", "Genau dann, wenn sich ein Paar gegenüberliegender Innenwinkel zu π beziehungsweise 180° ergänzt."], ["Formulieren Sie den Sehnenabschnittssatz.", "Schneiden sich zwei Sehnen AB und CD in P, dann gilt |PA|·|PB|=|PC|·|PD|."], ["Welche Seiteneigenschaft hat ein Tangentenviereck?", "Die Summen der Längen gegenüberliegender Seiten sind gleich."], ["Ist jedes Viereck ein Sehnen- oder Tangentenviereck?", "Nein. Beide Begriffe verlangen zusätzliche Bedingungen."], ["Was ist die längste Sehne eines Kreises?", "Jeder Durchmesser. Je näher eine Sehne am Mittelpunkt liegt, desto länger ist sie."]], "sketch": "chords", "connections": "Verwendet Peripheriewinkel, Ähnlichkeit und Tangentenabschnitte.", "ref": "Skript: Kap. 10.3–10.4 (Sehnen- und Tangentenvierecke)"}, {"id": 23, "title": "Winkelsätze am Kreis", "sub": "Peripheriewinkel, Thales, Zentriwinkel und Sehnen-Tangentenwinkel", "opening": "Winkel am Kreis werden über den zugehörigen Kreisbogen geordnet. Alle Peripheriewinkel über demselben Kreisbogen sind kongruent. Der zugehörige Zentriwinkel ist doppelt so groß. Der Satz des Thales ist der Spezialfall des Halbkreises.", "core": ["<b>Peripheriewinkelsatz:</b> Alle Peripheriewinkel über demselben Kreisbogen sind kongruent.", "<b>Satz des Thales:</b> Ein Peripheriewinkel über einem Durchmesser ist ein rechter Winkel.", "<b>Umkehrung:</b> Ist ∠APB recht, liegt P auf dem Kreis mit Durchmesser AB.", "<b>Peripherie-Zentriwinkelsatz:</b> Der Zentriwinkel ist doppelt so groß wie ein Peripheriewinkel über demselben Bogen.", "<b>Sehnen-Tangentenwinkelsatz:</b> Der Winkel zwischen Tangente und Sehne stimmt mit dem Peripheriewinkel über dem zugehörigen Bogen überein."], "terms": [["Peripheriepunkt", "Ein Punkt auf der Kreislinie."], ["Peripheriewinkel", "Ein Winkel mit Scheitel auf dem Kreis und Schenkeln durch zwei weitere Kreispunkte."], ["Zentriwinkel", "Ein Winkel mit Scheitel im Kreismittelpunkt."], ["Kreisbogen", "Ein zusammenhängender Teil der Kreislinie zwischen zwei Punkten."], ["Thaleskreis", "Der Kreis, dessen Durchmesser die gegebene Strecke AB ist."]], "proof": "Peripherie-Zentriwinkelsatz: Man verbindet den Peripheriepunkt mit dem Mittelpunkt. Es entstehen gleichschenklige Dreiecke. Basiswinkelsatz und Innenwinkelsumme liefern nach einer Lage-Fallunterscheidung den Faktor 2. Daraus folgt der Peripheriewinkelsatz unmittelbar; bei einem Durchmesser beträgt der Zentriwinkel π, also der Peripheriewinkel π/2.", "qa": [["Was bedeutet „über demselben Kreisbogen“?", "Die Winkelschenkel enden in denselben Kreispunkten A und B, und die Scheitel liegen auf derselben Seite beziehungsweise auf dem zugehörigen Gegenbogen."], ["Formulieren Sie den Satz des Thales samt Umkehrung.", "Liegt P auf dem Kreis mit Durchmesser AB, ist ∠APB recht. Umgekehrt liegt ein Punkt P mit rechtem Winkel ∠APB auf diesem Kreis."], ["Wie hängen Zentri- und Peripheriewinkel zusammen?", "Über demselben Kreisbogen ist der Zentriwinkel doppelt so groß wie der Peripheriewinkel."], ["Wie lautet der Sehnen-Tangentenwinkelsatz?", "Der Winkel zwischen Tangente in A und Sehne AB ist kongruent zu einem Peripheriewinkel über dem entsprechenden Bogen AB."], ["Wie folgt das Sehnenviereck-Kriterium?", "Gegenüberliegende Peripheriewinkel stehen über ergänzenden Bögen. Die zugehörigen Zentriwinkel ergeben zusammen 2π, die Peripheriewinkel also π."]], "sketch": "circleangles", "connections": "Vereinigt Kreisgeometrie, Winkelmaß, gleichschenklige Dreiecke und Ähnlichkeit.", "ref": "Skript: Kap. 10.2 und 10.4 (Winkelsätze am Kreis)"}, {"id": 24, "title": "Elementargeometrische Grundlegung der Analytischen Geometrie", "sub": "Vom axiomatischen Punkt zur Koordinate in R²", "opening": "Die analytische Geometrie wird elementargeometrisch begründet, indem man ein Koordinatensystem aus Ursprung, Achsen, Orientierung und Einheit aufbaut. Jedem geometrischen Punkt wird eindeutig ein Zahlenpaar zugeordnet und umgekehrt. Danach werden Abstand, Geraden und Winkel in Koordinaten ausgedrückt und die Axiome im Modell R² überprüft.", "core": ["<b>Koordinatenabbildung:</b> κ:P→R² ist bijektiv.", "<b>Abstand:</b> d(P,Q)=√((xP−xQ)²+(yP−yQ)²).", "<b>Gerade:</b> x=p+t·v mit v≠0 oder als Lösungsmenge ax+by=c.", "<b>Kollinearität:</b> Q−P und R−P sind linear abhängig.", "<b>Winkel:</b> cos α=⟨u,v⟩/(‖u‖·‖v‖).", "<b>Halbebenen:</b> ax+by&lt;c und ax+by&gt;c liegen auf den beiden Seiten der Geraden ax+by=c.", "<b>Modellnachweis:</b> Die konkret definierten Objekte müssen alle abstrakten Axiome erfüllen."], "terms": [["Bijektion", "Jeder geometrische Punkt erhält genau ein Zahlenpaar und jedes Zahlenpaar genau einen Punkt."], ["Ortsvektor", "Der Pfeil vom Ursprung zum Punkt; seine Komponenten sind die Koordinaten."], ["Richtungsvektor", "Ein Vektor, der die Richtung einer Geraden angibt."], ["Skalarprodukt", "Eine Rechenoperation, die Längen und Winkel verbindet."], ["Modellprüfung", "Man zeigt für jedes abstrakte Axiom, dass es mit den konkreten Formeln erfüllt ist."]], "proof": "Inz-1: Für verschiedene Punkte A,B ist B−A≠0; die Menge A+t(B−A) ist die eindeutig bestimmte Gerade durch beide. Die Metrikaxiome folgen aus den Normeigenschaften, insbesondere aus Cauchy-Schwarz und der Dreiecksungleichung. Ger-1 folgt aus dem Gleichheitsfall der Dreiecksungleichung. Orthogonalität wird durch ⟨u,v⟩=0 beschrieben.", "qa": [["Welche Daten braucht man für ein Koordinatensystem?", "Einen Ursprung, zwei senkrechte orientierte Achsen und eine Längeneinheit; äquivalent eine orthonormale Basis mit Ursprung."], ["Warum ist die Koordinatenabbildung bijektiv?", "Jeder Punkt besitzt durch seine Achsenkoordinaten genau ein Paar (x,y). Umgekehrt bestimmen x und y durch die entsprechenden Parallelen genau einen Schnittpunkt."], ["Wie wird eine Gerade analytisch beschrieben?", "Als Punkt-Richtungs-Form x=p+t·v mit v≠0 oder als Lösungsmenge einer linearen Gleichung ax+by=c."], ["Wie berechnet man einen Winkel?", "Für u,v≠0 gilt cos α=⟨u,v⟩/(‖u‖‖v‖), wobei α im Intervall [0,π] gewählt wird."], ["Was bedeutet „Erfüllung der Axiome“?", "Man weist nach, dass R² mit den üblichen Geraden und dem euklidischen Abstand sämtliche geforderten Inzidenz-, Metrik-, Anordnungs-, Halbebenen-, Bewegungs- und Parallelaussagen erfüllt."]], "sketch": "coordinates", "connections": "Schließt den axiomatischen Aufbau durch ein konkretes algebraisches Modell ab.", "ref": "Skript: Kap. 11.1 (Grundlegung analytischer Geometrien)"}];

const store={get:(k,d=null)=>{try{return localStorage.getItem(k)??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const app={page:"home",done:JSON.parse(store.get("geo-done","{}"))};
if(store.get("geo-theme","")==="dark")document.body.classList.add("dark");
const content=document.getElementById("content"),crumb=document.getElementById("crumb"),side=document.getElementById("side"),navtopics=document.getElementById("navtopics");
const escapeHtml=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function stats(){const n=TOPICS.filter(t=>app.done[t.id]).length;return {n,p:Math.round(n/24*100)}}
function nav(filter=""){const q=filter.trim().toLowerCase();navtopics.innerHTML=TOPICS.filter(t=>!q||(t.title+" "+t.sub+" "+t.core.join(" ")+" "+t.qa.flat().join(" ")).toLowerCase().includes(q)).map(t=>`<button class="nav ${app.page==String(t.id)?"active":""}" data-page="${t.id}"><span class="num">${t.id}</span><span class="navtitle">${escapeHtml(t.title)}</span><span class="dot ${app.done[t.id]?"on":""}"></span></button>`).join("");bind()}
function bind(){document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(String(b.dataset.page)))}
function go(p){app.page=p;render();side.classList.remove("open");scrollTo({top:0,behavior:"smooth"})}
function render(){app.page==="home"?home():topic(TOPICS.find(t=>String(t.id)===app.page)||TOPICS[0]);nav(document.getElementById("search").value)}
function home(){const s=stats();crumb.textContent="Start · Lernplan";content.innerHTML=`
<section class="hero"><div class="badges"><span class="badge">24 Themen</span><span class="badge">104 Prüfungsfragen</span><span class="badge">Offline nutzbar</span></div><div class="eyebrow">Elementargeometrie · Norbert Koksch</div><h2>Vom Axiom bis zum Winkelsatz am Kreis.</h2><p>Die App trainiert genau den Ablauf einer mündlichen Prüfung: frei sprechen, Definitionen präzisieren, Hauptsätze formulieren, Skizzen nutzen und auf Nachfragen eine Beweisidee entwickeln.</p><div class="callout"><b>Bewährte Antwortstruktur:</b> 1. Begriffe definieren · 2. zentralen Satz formulieren · 3. Skizze beschreiben · 4. Beweisidee geben · 5. Voraussetzungen und Verbindungen nennen.</div><br><button class="btn primary" onclick="openExam()">Zufällige Prüfungskarte ziehen</button></section>
<div class="grid"><section class="card third"><h3>Lernfortschritt</h3><div class="progress"><span style="width:${s.p}%"></span></div><p><b>${s.n} von 24</b> Themen als sicher markiert · ${s.p}%</p></section>
<section class="card third"><h3>5-Minuten-Routine</h3><p>60 Sekunden gliedern · 3 Minuten frei sprechen · 60 Sekunden Beweisidee und mögliche Rückfragen.</p></section>
<section class="card third"><h3>Koksch-Fokus</h3><p>Sauber unterscheiden: <b>Definition, Axiom, Satz, Umkehrung, Existenz, Eindeutigkeit und benötigte Voraussetzungen.</b></p></section>
<section class="card full"><h3>Alle Themen</h3><div class="tiles">${TOPICS.map(t=>`<button class="tile" onclick="go('${t.id}')"><b>${t.id} · ${escapeHtml(t.title)}</b><small>${escapeHtml(t.sub)}</small></button>`).join("")}</div></section>
<section class="card full"><h3>Arbeitsweise</h3><div class="terms"><div class="term"><b>Aktiv abrufen</b>Ziehe zuerst eine Karte und sprich, bevor du die Antwort liest.</div><div class="term"><b>Präzisieren</b>Vergleiche deine Formulierungen mit dem Kernwissen.</div><div class="term"><b>Beweisidee</b>Merke Ausgangspunkt, entscheidende Konstruktion und verwendeten Satz.</div><div class="term"><b>Vernetzen</b>Übe Themenwechsel über den Abschnitt „Zusammenhang“.</div></div><div class="source">Quellenbasis: „Geometrie-Themen“ und „Elementargeometrie – Norbert Koksch, 2025“. Die Skizzen sind für diese Lernapp neu erstellt.</div></section></div>`}
function topic(t){crumb.textContent=`Thema ${t.id} · ${t.title}`;content.innerHTML=`
<section class="hero"><div class="badges"><span class="badge">Thema ${t.id} / 24</span><span class="badge">${escapeHtml(t.ref)}</span></div><div class="eyebrow">Mündliche Prüfung · Elementargeometrie</div><h2>${escapeHtml(t.title)}</h2><p>${escapeHtml(t.sub)}</p><label class="check"><input id="done" type="checkbox" ${app.done[t.id]?"checked":""}> Dieses Thema kann ich mindestens drei Minuten frei und strukturiert erklären.</label></section>
<div class="grid"><section class="card"><div class="eyebrow">Prüfungsstart</div><h3>So könntest du beginnen</h3><p class="opening">${t.opening}</p></section>
<section class="card"><div class="eyebrow">Visualisieren</div><h3>Skizze für das Prüfungsgespräch</h3><div class="svgbox">${SKETCHES[t.sketch]}</div><p style="color:var(--muted)">Beim Zeichnen laut benennen: Voraussetzungen, Punkte, Geraden und die Aussage, die sichtbar werden soll.</p></section>
<section class="card"><div class="eyebrow">Präzision</div><h3>Kernwissen</h3><ul class="clean">${t.core.map(x=>`<li>${x}</li>`).join("")}</ul></section>
<section class="card"><div class="eyebrow">Beweisfähigkeit</div><h3>Zentrale Beweisidee</h3><p>${t.proof}</p></section>
<section class="card full"><div class="eyebrow">Einfach erklärt</div><h3>Begriffe ohne Fachnebel</h3><div class="terms">${t.terms.map(x=>`<div class="term"><b>${escapeHtml(x[0])}</b>${escapeHtml(x[1])}</div>`).join("")}</div></section>
<section class="card full"><div class="eyebrow">Prüfungsgespräch</div><h3>Mögliche Fragen mit prüfungsfähigen Antworten</h3>${t.qa.map(x=>`<details><summary>${escapeHtml(x[0])}</summary><div class="answer">${escapeHtml(x[1])}</div></details>`).join("")}</section>
<section class="card full"><div class="eyebrow">Vernetzung</div><h3>Zusammenhang mit anderen Themen</h3><p>${t.connections}</p><div class="source">${escapeHtml(t.ref)}</div></section></div>`;
document.getElementById("done").onchange=e=>{app.done[t.id]=e.target.checked;store.set("geo-done",JSON.stringify(app.done));nav(document.getElementById("search").value);toast(e.target.checked?"Als sicher markiert.":"Markierung entfernt.")}}
function toast(m){const x=document.getElementById("toast");x.textContent=m;x.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove("show"),1800)}
document.getElementById("search").oninput=e=>nav(e.target.value);
document.getElementById("theme").onclick=()=>{document.body.classList.toggle("dark");store.set("geo-theme",document.body.classList.contains("dark")?"dark":"light")};
document.getElementById("menu").onclick=()=>side.classList.toggle("open");
document.getElementById("prev").onclick=()=>{if(app.page==="home")return;const n=+app.page;go(n<=1?"home":String(n-1))};
document.getElementById("next").onclick=()=>{if(app.page==="home")return go("1");const n=+app.page;go(n>=24?"home":String(n+1))};
document.getElementById("random").onclick=()=>openExam();document.getElementById("exam").onclick=()=>openExam();
let et=null,sec=300,handle=null;
function choose(){et=TOPICS[Math.floor(Math.random()*TOPICS.length)];document.getElementById("examtitle").textContent=`${et.id} · ${et.title}`;document.getElementById("guide").classList.add("hidden");document.getElementById("guide").innerHTML="";reset()}
function openExam(){choose();document.getElementById("modal").classList.add("open")}
function closeExam(){document.getElementById("modal").classList.remove("open");clearInterval(handle);handle=null}
function draw(){document.getElementById("timer").textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
function reset(){clearInterval(handle);handle=null;sec=300;draw()}
function toggle(){if(handle){clearInterval(handle);handle=null;return}handle=setInterval(()=>{sec--;draw();if(sec<=0){clearInterval(handle);handle=null;toast("Zeit – jetzt Rückfragen beantworten!")}},1000)}
document.getElementById("starttimer").onclick=toggle;document.getElementById("resettimer").onclick=reset;document.getElementById("newexam").onclick=choose;document.getElementById("close").onclick=closeExam;
document.getElementById("guidebtn").onclick=()=>{const g=document.getElementById("guide");g.innerHTML=`<hr><h3>Stichworte</h3><ul class="clean">${et.core.slice(0,5).map(x=>`<li>${x}</li>`).join("")}</ul><button class="btn primary" onclick="closeExam();go('${et.id}')">Thema vollständig öffnen</button>`;g.classList.toggle("hidden")};
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeExam()};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeExam();if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();document.getElementById("search").focus()}});
nav();render();
</script>
</body></html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lernbaustein Terme Klasse 8</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* VOICE everyday learning: calm, clear, encouraging
   IDEA a squared maths exercise book (Karopapier) with algebra tiles laid on it
   PICTURE per Baustein one live model: dot frame, term check table, area rectangle, binomial square, equation table, number line
   COLOUR white graph paper, ink navy, tile blue / orange / yellow, red pencil for corrections
   TYPE Lexend headings + Atkinson Hyperlegible text
   LAYOUT title + six Baustein tabs; panel = text and tasks left, live model right (sticky); phone: intro, model, tasks */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1420);--grid:light-dark(#e6edf7,#182031);--ink:light-dark(#14213a,#e8edf6);--muted:light-dark(#4a5670,#a9b4c8);--panel:light-dark(#ffffff,#161d2c);--soft:light-dark(#f2f5fa,#1c2536);--line:light-dark(#cfd8e6,#2c374b);--t1:light-dark(#2556c4,#7aa2ff);--t2:light-dark(#d9700f,#f4a24d);--t3:light-dark(#f2c230,#e3bd45);--t4:light-dark(#b8366f,#ee7aa9);--red:light-dark(#cc3324,#ff7a6b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:17px/1.55 'Atkinson Hyperlegible',Verdana,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Lexend,'Trebuchet MS',sans-serif;line-height:1.1;letter-spacing:-.02em;margin:0}
h1{font-size:clamp(30px,4.4vw,48px);text-wrap:balance}
h2{font-size:clamp(26px,3vw,36px)}
h3{font-size:19px}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(20px,3vw,40px) max(4vw,16px) 64px}
.top{display:flex;flex-wrap:wrap;gap:12px 32px;align-items:end;justify-content:space-between;margin-bottom:24px}
.top p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.prog{font-family:Lexend,sans-serif;font-size:15px;color:var(--muted);white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:24px}
.tab{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:center;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--panel);min-height:44px}
.tab b{grid-row:span 2;font:700 30px/1 Lexend,sans-serif;color:var(--t1)}
.tab span{font-weight:700;font-size:15px;line-height:1.2}
.tab small{font-size:13px;color:var(--muted)}
.tab:hover{border-color:var(--t1)}
.tab:focus-visible{outline:3px solid var(--t2);outline-offset:2px}
.tab[aria-selected=true]{background:var(--t1);border-color:var(--t1);color:#fff}
.tab[aria-selected=true] b,.tab[aria-selected=true] small{color:#fff}
.panel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);grid-template-areas:"intro fig" "tasks fig";gap:24px 36px;align-items:start}
.intro{grid-area:intro}.tasks{grid-area:tasks}.figwrap{grid-area:fig;position:sticky;top:16px}
.core{margin:16px 0 0;padding:16px 18px;background:var(--soft);border-left:6px solid var(--t2);border-radius:4px 12px 12px 4px;font-size:19px;font-weight:700}
.intro p{margin:12px 0 0}
.card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:18px}
.figwrap .card{padding:16px}
.fig{position:relative;min-height:340px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
svg text{font-family:'Atkinson Hyperlegible',sans-serif;font-size:15px;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.ctrl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:12px}
.ctrl label{display:flex;gap:8px;align-items:center;font-weight:700;white-space:nowrap}
input[type=range]{accent-color:var(--t1);width:130px;height:44px}
input[type=text],select{font:16px 'Atkinson Hyperlegible',sans-serif;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:44px}
input[type=text]:focus,select:focus{outline:3px solid var(--t1);outline-offset:1px}
.btn{font:700 15px 'Atkinson Hyperlegible',sans-serif;min-height:44px;padding:8px 14px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--t1)}.btn:focus-visible{outline:3px solid var(--t2);outline-offset:2px}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.out{font-family:Lexend,sans-serif;font-size:clamp(18px,2.2vw,22px);margin:12px 0 0}
.note{color:var(--muted);font-size:15px;margin:6px 0 0}
.task{padding:16px 0;border-top:2px dashed var(--line)}
.task:first-of-type{border-top:0}
.task .q{font-weight:700;margin:0 0 10px}
.task .term{font-family:Lexend,sans-serif;font-size:20px;color:var(--t1);white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row input{flex:1 1 180px}
.fb{margin:10px 0 0;padding:10px 12px;border-radius:10px;font-size:16px}
.fb.ok{background:color-mix(in srgb,var(--t1) 14%,transparent);border-left:5px solid var(--t1)}
.fb.no{background:color-mix(in srgb,var(--red) 12%,transparent);border-left:5px solid var(--red)}
.fb.mid{background:color-mix(in srgb,var(--t2) 15%,transparent);border-left:5px solid var(--t2)}
.hint{color:var(--muted);font-size:15px;margin:8px 0 0}
.pro{margin-top:8px;padding:14px 16px;border-radius:14px;background:var(--soft)}
.pro .tag{font-family:Lexend,sans-serif;font-size:14px;color:var(--t4);font-weight:700}
.done{font-size:14px;color:var(--t1);font-weight:700;margin-left:6px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-family:Lexend,sans-serif;font-size:14px;color:var(--muted);font-weight:500}
th:first-child,td:first-child{text-align:left}
tr.eq td{background:color-mix(in srgb,var(--t1) 13%,transparent);font-weight:700}
td.ne{color:var(--red);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:15px;margin-top:8px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.mirror circle{transition:transform .7s ease}
@media (prefers-reduced-motion:reduce){.mirror circle{transition:none}}
@media(max-width:860px){.panel{grid-template-columns:minmax(0,1fr);grid-template-areas:"intro" "fig" "tasks"}.figwrap{position:static}}
@media(max-width:600px){.fig{min-height:290px}table{font-size:14px}th,td{padding:6px 5px}.tab b{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div><h1>Terme und Gleichungen verstehen</h1>
<p>Wähle den Baustein, den dir der Check-In empfohlen hat. Probiere das Modell aus, dann löse die Aufgaben – du bekommst sofort Rückmeldung.</p></div>
<div class="prog" id="prog"></div>
</header>
<nav class="tabs" id="tabs" role="tablist" aria-label="Bausteine"></nav>
<main class="panel" id="panel"></main>
</div>
<script>
{
const B=[
{id:'a',name:'Variable & Term',ci:'1–3',core:'Ein Buchstabe steht für eine Zahl – nie für ein Ding. Ein Term beschreibt eine Rechnung, die für jede passende Zahl funktioniert.',text:'Im Modell siehst du einen quadratischen Rahmen aus Punkten. Zähle ihn zuerst selbst und schreibe deine Zählweise als Term mit n. Danach vergleichst du mit anderen Zählweisen: Verschiedene Terme können dasselbe beschreiben.',fig:'dots',tasks:[
{k:'choice',q:'An einer Schule gibt es 6-mal so viele Schüler (S) wie Lehrer (L). Welche Gleichung stimmt?',opts:['6S = L','S = 6L'],ans:1,why:'Probe: 10 Lehrer → 60 Schüler. S = 6 · 10 = 60 passt. S und L sind Anzahlen, keine Abkürzungen.',hint:'Setze eine Zahl für L ein, z. B. 10.'},
{k:'num',q:'Berechne für a = 3:',t:'4a²',ans:36,hint:'Erst die Potenz: a² = 9, dann mal 4.'},
{k:'num',q:'Berechne für a = 3:',t:'(4a)²',ans:144,hint:'Erst die Klammer: 4 · 3 = 12, dann quadrieren.'},
{k:'term',q:'Ein Rechteck hat die Seiten 3x und y. Gib einen Term für den Umfang an.',ans:'2*3x+2y',hint:'Umfang = 2 · Länge + 2 · Breite.'},
{k:'term',pro:1,q:'Zahlenzauber: Denk dir eine Zahl x, verdopple sie, addiere 6, halbiere, ziehe x ab. Schreibe den Term auf.',ans:'(2x+6)/2-x',hint:'Schritt für Schritt: 2x, dann 2x + 6, dann (2x + 6) : 2, dann … − x.',why:'Vereinfacht ergibt der Term immer 3 – egal welche Zahl man denkt.'}]},
{id:'b',name:'Zusammen&shy;fassen',ci:'4',core:'Zusammenfassen heißt: gleiche Sorte zählen. 3x + 2x = (3 + 2) · x. x und x² sind verschiedene Sorten.',text:'Der Einsetz-Check zeigt, ob zwei Terme gleichwertig sind: Setze Zahlen ein. Ist auch nur ein Ergebnis verschieden, ist die Umformung falsch. Probiere die typischen Fehler unten aus.',fig:'check',tasks:[
{k:'term',q:'Vereinfache:',t:'3x + 2y + x',ans:'4x+2y',form:'short',hint:'Nur x-Terme zusammen: 3x + x.'},
{k:'term',q:'Vereinfache:',t:'2x · 3x',ans:'6x^2',form:'short',hint:'Zahlen multiplizieren, Variablen multiplizieren: x · x = x².'},
{k:'term',q:'Vereinfache:',t:'5a − (−a)',ans:'6a',form:'short',hint:'Minus minus ergibt plus.'},
{k:'term',q:'Vereinfache:',t:'12pq − 5qp − 3p − q + pq',ans:'8pq-3p-q',form:'short',hint:'qp ist dasselbe wie pq.'},
{k:'term',pro:1,q:'Vereinfache so weit wie möglich:',t:'7 · 3a − 2a · 3a + a²',ans:'21a-5a^2',form:'short',hint:'Erst die Produkte: 21a und 6a². Dann a²-Terme zusammenfassen.'}]},
{id:'c',name:'Klammern',ci:'5–6',core:'Eine Klammer auflösen heißt: ein Rechteck in Teilrechtecke zerlegen. Jedes Glied mal jedes Glied – jede Teilfläche zählt.',text:'Stelle die Seitenlängen ein. Das große Rechteck hat den Flächeninhalt (x + p)(x + q). Die vier Teilflächen ergeben zusammen denselben Wert – das ist das Ausmultiplizieren. Rückwärts gelesen ist es Ausklammern.',fig:'area',tasks:[
{k:'term',q:'Löse die Klammer auf:',t:'5(x + y)',ans:'5x+5y',form:'noParen',hint:'Beide Glieder mal 5.'},
{k:'term',q:'Löse die Klammern auf und fasse zusammen:',t:'(x + 3)(x + 5)',ans:'x^2+8x+15',form:'noParen',hint:'Vier Teilflächen: x², 5x, 3x, 15.'},
{k:'term',q:'Löse die Klammern auf:',t:'(2a + 3)(b − 3)',ans:'2ab-6a+3b-9',form:'noParen',hint:'Jedes Glied der ersten Klammer mit jedem der zweiten.'},
{k:'term',q:'Klammere aus:',t:'6x + 9',ans:'3(2x+3)',form:'product',hint:'Welche Zahl steckt in 6 und in 9?'},
{k:'term',q:'Klammere so viel wie möglich aus:',t:'8ab + 4ac',ans:'4a(2b+c)',form:'product',hint:'Gemeinsam sind 4 und a. Probe: wieder ausmultiplizieren.'},
{k:'term',pro:1,q:'Löse die Klammer auf (Minus davor!):',t:'x − (2x − 3)',ans:'-x+3',form:'noParen',hint:'−(2x − 3) = (−1) · (2x − 3).'}]},
{id:'d',name:'Binomische Formeln',ci:'7',core:'(a + b)² ist ein Quadrat mit Seite a + b. Es besteht aus a², b² und zwei Rechtecken ab – deshalb a² + 2ab + b².',text:'Verändere a und b. Schalte dann „Toms Behauptung“ ein: Er glaubt, (a + b)² = a² + b². Welche Flächen hat er vergessen?',fig:'square',tasks:[
{k:'term',q:'Wende eine binomische Formel an:',t:'(x + 4)²',ans:'x^2+8x+16',form:'noParen',hint:'a = x, b = 4. Mittelglied 2 · x · 4.'},
{k:'term',q:'Wende eine binomische Formel an:',t:'(3x − 5)²',ans:'9x^2-30x+25',form:'noParen',hint:'(3x)² = 9x², nicht 3x².'},
{k:'term',q:'Wende eine binomische Formel an:',t:'(p + 2q)(p − 2q)',ans:'p^2-4q^2',form:'noParen',hint:'3. Formel: a² − b².'},
{k:'term',q:'Faktorisiere:',t:'x² + 10x + 25',ans:'(x+5)^2',form:'product',hint:'Quadrate x² und 25 = 5². Passt 2 · x · 5?'},
{k:'term',q:'Rebecca schreibt (2u + 8v)². Faktorisiere richtig:',t:'4u² + 16uv + 16v²',ans:'(2u+4v)^2',form:'product',hint:'16v² = (4v)². Prüfe das Mittelglied.'},
{k:'num',pro:1,q:'Rechne im Kopf mit der 2. binomischen Formel: 49² = (50 − 1)² =',ans:2401,hint:'2500 − 100 + 1.'}]},
{id:'e',name:'Gleichungen',ci:'8–9',core:'Eine Gleichung ist eine Frage: Für welche Zahl sind beide Seiten gleich? Bei Brüchen darf kein Nenner 0 werden.',text:'Wähle eine Gleichung. Die Tabelle rechnet beide Seiten für viele x aus. Wo beide gleich sind, steht die Lösung. Achte auf „geteilt durch 0“.',fig:'eq',tasks:[
{k:'choice',q:'Ist x = 5 eine Lösung von 3x − 4 = 2x + 1? Setze ein, ohne umzuformen.',opts:['Ja','Nein'],ans:0,why:'Links 3 · 5 − 4 = 11, rechts 2 · 5 + 1 = 11. Beide gleich.'},
{k:'num',q:'Welche Zahl muss bei 6 / (x − 2) = 3 ausgeschlossen werden?',ans:2,hint:'Für welches x wird der Nenner 0?'},
{k:'num',q:'Löse: 6 / (x − 2) = 3. x =',ans:4,hint:'Beide Seiten mal (x − 2): 6 = 3x − 6.'},
{k:'num',q:'Löse: 3 / (x + 4) = 4 / (2x). x =',ans:8,hint:'Über Kreuz: 3 · 2x = 4 · (x + 4).'},
{k:'choice',pro:1,q:'x / (x − 3) = 3 / (x − 3). Welche Lösungsmenge stimmt?',opts:['L = {3}','L = { }'],ans:1,why:'Umgeformt kommt x = 3 heraus – aber für x = 3 wird der Nenner 0. Die Probe scheitert, also gibt es keine Lösung.'}]},
{id:'f',name:'Ungleichungen',ci:'10',core:'Mal oder geteilt durch eine negative Zahl spiegelt die Zahlengerade – deshalb dreht sich das Zeichen um.',text:'Wähle eine Ungleichung. Gefüllte Punkte erfüllen sie, leere nicht. Unten siehst du, warum mal (−1) die Reihenfolge umdreht.',fig:'line',tasks:[
{k:'choice',q:'Ist x = −5 eine Lösung von −2x < 6?',opts:['Ja','Nein'],ans:1,why:'−2 · (−5) = 10, und 10 < 6 ist falsch.'},
{k:'choice',q:'−2x < 6 wird durch (−2) geteilt. Was kommt heraus?',opts:['x < −3','x > −3'],ans:1,why:'Durch eine negative Zahl geteilt: Zeichen umdrehen.'},
{k:'choice',q:'Mia rechnet: 3x + 12 ≤ 9 → 3x ≤ −3 → x ≥ −1. Stimmt das?',opts:['Ja','Nein, x ≤ −1'],ans:1,why:'Mia hat durch +3 geteilt – da bleibt das Zeichen. Test: x = 0 liegt in Mias Bereich, aber 12 ≤ 9 ist falsch.'},
{k:'choice',q:'Löse: −5x + 3 > −17',opts:['x > 4','x < 4'],ans:1,why:'−5x > −20, geteilt durch (−5): x < 4.'},
{k:'choice',pro:1,q:'Löse: 8x − 11 ≤ 4x + 9',opts:['x ≤ 5','x ≥ 5','x ≤ −5'],ans:0,why:'4x ≤ 20, also x ≤ 5. Geteilt durch +4, Zeichen bleibt.'}]}
];
const $=s=>document.querySelector(s);
let solved=new Set();
try{solved=new Set(JSON.parse(localStorage.getItem('tg8')||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem('tg8',JSON.stringify([...solved]))}catch(e){}};
const fmt=v=>{if(!isFinite(v))return'–';const r=Math.round(v*1000)/1000;return String(r).replace('.',',').replace('-','−')};

function norm(s){return s.replace(/[−–]/g,'-').replace(/[·×]/g,'*').replace(/:/g,'/').replace(/²/g,'^2').replace(/³/g,'^3').replace(/(\d),(\d)/g,'$1.$2').replace(/\s+/g,'')}
function parse(src){
const s=norm(src);if(!s)throw Error('Bitte einen Term eingeben.');
const T=[];let i=0;
while(i<s.length){const c=s[i];
if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;T.push({t:'n',v:parseFloat(s.slice(i,j))});i=j}
else if(/[a-zA-Z]/.test(c)){T.push({t:'v',v:c});i++}
else if('+-*/^()'.includes(c)){T.push({t:c});i++}
else throw Error('Das Zeichen „'+c+'“ kenne ich nicht.')}
let p=0;const eat=t=>{if(T[p]&&T[p].t===t){p++;return true}return false};
const expr=()=>{let f=term();for(;;){if(eat('+')){const a=f,b=term();f=e=>a(e)+b(e)}else if(eat('-')){const a=f,b=term();f=e=>a(e)-b(e)}else return f}};
const term=()=>{let f=unary();for(;;){const k=T[p];if(!k)return f;
if(k.t==='*'){p++;const a=f,b=unary();f=e=>a(e)*b(e)}
else if(k.t==='/'){p++;const a=f,b=unary();f=e=>a(e)/b(e)}
else if(k.t==='n'||k.t==='v'||k.t==='('){const a=f,b=power();f=e=>a(e)*b(e)}
else return f}};
const unary=()=>{if(eat('-')){const a=unary();return e=>-a(e)}if(eat('+'))return unary();return power()};
const power=()=>{const b=prim();if(eat('^')){const x=unary();return e=>Math.pow(b(e),x(e))}return b};
const prim=()=>{const k=T[p++];if(!k)throw Error('Der Term ist unvollständig.');
if(k.t==='n'){const v=k.v;return()=>v}
if(k.t==='v'){const n=k.v;return e=>e[n]}
if(k.t==='('){const f=expr();if(!eat(')'))throw Error('Eine Klammer wird nicht geschlossen.');return f}
throw Error('An der Stelle „'+k.t+'“ fehlt etwas.')};
const f=expr();if(p<T.length)throw Error('Ich verstehe den Term ab „'+(T[p].v??T[p].t)+'“ nicht.');
return{f,vars:[...new Set(T.filter(t=>t.t==='v').map(t=>t.v))].sort()}}
const VALS=[2,3,-1,5,-2,0.5,1.5,4];
function assign(vars,k){const e={};vars.forEach((v,i)=>e[v]=VALS[(k+i*3)%VALS.length]);return e}
function equiv(a,b){const vs=[...new Set([...a.vars,...b.vars])];
for(let k=0;k<VALS.length;k++){const e=assign(vs,k),A=a.f(e),Bv=b.f(e);if(!isFinite(A)||!isFinite(Bv))continue;
if(Math.abs(A-Bv)>1e-7*Math.max(1,Math.abs(A),Math.abs(Bv)))return{ok:false,e,A,B:Bv}}return{ok:true}}
const envText=e=>Object.keys(e).map(k=>k+' = '+fmt(e[k])).join(', ');
function isProduct(s){const n=norm(s);let d=0;for(let i=0;i<n.length;i++){const c=n[i];if(c==='(')d++;else if(c===')')d--;else if(d===0&&i>0&&(c==='+'||c==='-')&&n[i-1]!=='^'&&n[i-1]!=='*'&&n[i-1]!=='/')return false}return n.includes('(')}

function checkTask(t,val){
if(t.k==='num'){const v=parseFloat(norm(val));if(isNaN(v))return['no','Bitte eine Zahl eingeben.'];return Math.abs(v-t.ans)<1e-9?['ok','Richtig! '+(t.why||'')]:['no','Noch nicht. '+(t.hint||'')]}
let u;try{u=parse(val)}catch(e){return['no',e.message]}
const r=equiv(u,parse(t.ans));
if(!r.ok)return['no','Noch nicht gleichwertig. Probe mit '+envText(r.e)+': richtig wäre '+fmt(r.B)+', dein Term ergibt '+fmt(r.A)+'.'];
if(t.form==='noParen'&&/[()]/.test(norm(val)))return['mid','Gleichwertig – aber es sind noch Klammern drin. Löse sie ganz auf.'];
if(t.form==='product'&&!isProduct(val))return['mid','Gleichwertig – aber noch eine Summe. Schreibe es als Produkt mit Klammer.'];
if(t.form==='short'&&norm(val).length>norm(t.ans).length+3)return['mid','Gleichwertig – aber es geht noch kürzer. Fasse gleichartige Terme zusammen.'];
return['ok','Richtig! '+(t.why||'')]}

function tabsHTML(cur){return B.map(b=>{const n=b.tasks.filter((t,i)=>solved.has(b.id+i)).length;return`<button class="tab" role="tab" id="tab-${b.id}" aria-selected="${b.id===cur}" data-id="${b.id}"><b>${b.id.toUpperCase()}</b><span>${b.name}</span><small>Check-In ${b.ci} · ${n}/${b.tasks.length} gelöst</small></button>`}).join('')}
function taskHTML(b,t,i){const id=b.id+i,done=solved.has(id);
const head=`<p class="q">${t.q}${t.t?` <span class="term">${t.t}</span>`:''}${done?'<span class="done">gelöst</span>':''}</p>`;
const body=t.k==='choice'?`<div class="row">${t.opts.map((o,j)=>`<button class="btn" data-task="${i}" data-opt="${j}">${o}</button>`).join('')}</div>`
:`<form class="row" data-task="${i}"><input type="text" id="in-${id}" aria-label="Antwort" autocomplete="off" placeholder="${t.k==='num'?'Zahl':'Term, z. B. 3x^2 + 2x'}"><button class="btn" type="submit">Prüfen</button><button class="btn" type="button" data-hint="${i}">Tipp</button></form>`;

s.innerHTML=h+d;out.textContent=yes.length?`Erfüllt für die gefüllten Punkte (${yes.length} von 17 ganzen Zahlen von −8 bis 8).`:'Keine ganze Zahl von −8 bis 8 erfüllt die Ungleichung.'};
const drawM=(s,W,H)=>{const [h,X]=axis(W,H/2-6,-6,6);const dx=v=>X(flip?-v:v)-X(0);
s.innerHTML=h+`<circle cx="${X(0)}" cy="${H/2-6}" r="11" fill="var(--t2)" style="transform:translateX(${dx(2)}px)"/><circle cx="${X(0)}" cy="${H/2-6}" r="11" fill="var(--t4)" style="transform:translateX(${dx(5)}px)"/>`};
const rl=svgEl(r.querySelector('#lsvg').parentNode,drawL);const ms=r.querySelector('#msvg');const rm=svgEl(ms.parentNode,drawM);
sel.addEventListener('change',()=>{own.hidden=!!sel.value;rl()});own.addEventListener('input',rl);
r.querySelector('#mb').addEventListener('click',e=>{flip=!flip;e.currentTarget.classList.toggle('on',flip);e.currentTarget.setAttribute('aria-pressed',flip);
const cs=ms.querySelectorAll('circle'),X0=ms.clientWidth;const step=(X0-40)/12;cs[0].style.transform=`translateX(${(flip?-2:2)*step}px)`;cs[1].style.transform=`translateX(${(flip?-5:5)*step}px)`;
r.querySelector('#mout').textContent=flip?'−2 > −5: Die Reihenfolge ist gespiegelt, das Zeichen dreht sich um.':'2 < 5'})}}
};
const P=$('#panel');
P.addEventListener('submit',ev=>{ev.preventDefault();if(!ev.target.dataset.task)return;const b=cur,i=+ev.target.dataset.task,t=b.tasks[i],id=b.id+i;const [c,m]=checkTask(t,$('#in-'+id).value);show(b,i,c,m)});
P.addEventListener('click',ev=>{const b=cur;const o=ev.target.closest('[data-opt]');if(o){const i=+o.dataset.task,t=b.tasks[i],j=+o.dataset.opt;show(b,i,j===t.ans?'ok':'no',j===t.ans?'Richtig! '+t.why:'Noch nicht. '+(t.hint||'Prüfe durch Einsetzen.'))}
const h=ev.target.closest('[data-hint]');if(h){const el=$('#hint-'+b.id+h.dataset.hint);el.hidden=!el.hidden}});
const route=()=>{const h=location.hash.slice(1);render(B.some(b=>b.id===h)?h:'a')};
$('#tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;if(location.hash!=='#'+t.dataset.id)location.hash=t.dataset.id;else render(t.dataset.id)});
addEventListener('hashchange',route);route();
}

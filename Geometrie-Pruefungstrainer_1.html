 </svg>`,cap:"Innenwinkelsatz: Parallele durch C überträgt α und β per Wechselwinkel."},
 focus:[
  "Klar herausstellen: erst <strong>Axiom P</strong> macht aus „Parallele existiert\u201c ⇒ „genau eine\u201c, damit Stufenwinkel <em>gleich</em>.",
  "Innenwinkelsatz elegant über Parallele durch <m>C</m> + Wechselwinkel beweisen.",
  "Parallelogramm‑Charakterisierungen (Seiten/Winkel/Diagonalen) als Äquivalenzen kennen.",
  "Starker Außenwinkelsatz: Außenwinkel = <strong>Summe</strong> der beiden fernen Innenwinkel."
 ],
 nachfr:[{q:"Beweisen Sie den Innenwinkelsatz.",a:"Zeichne durch <m>C</m> die (nach dem Parallelenaxiom eindeutige) Parallele zu <m>AB</m>. Die Schenkel <m>CA</m> und <m>CB</m> erzeugen dort Wechselwinkel zu <m>α</m> (bei <m>A</m>) und <m>β</m> (bei <m>B</m>); bei Parallelen sind Wechselwinkel gleich, also treten <m>α</m> und <m>β</m> am Scheitel <m>C</m> auf. Mit <m>γ</m> füllen sie den gestreckten Winkel: <m>α+β+γ=π</m>. Die Innenwinkelsumme ist 180°."},{q:"Welche Rolle spielt genau die Eindeutigkeit im Parallelenaxiom?",a:"Die <em>Existenz</em> einer Parallelen gilt schon absolut. Erst die <em>Eindeutigkeit</em> (genau eine) erzwingt die Rückrichtung des Stufenwinkelsatzes: Sind zwei Geraden parallel, müssen die Stufenwinkel gleich sein – sonst gäbe es eine zweite Parallele. Daraus folgen Innenwinkelsatz und starker Außenwinkelsatz."},{q:"Beweisen Sie den Mittenliniensatz.",a:"Seien <m>M,N</m> die Mittelpunkte von <m>CA</m> und <m>CB</m>. Über eine Punktspiegelung am Seitenmittelpunkt ergänzt man die Figur zu einem Parallelogramm; dessen gegenüberliegende Seiten liefern <m>MN∥AB</m>, und die gleich langen Parallelogrammseiten liefern <m>|MN|=½|AB|</m>. (Gleichwertig über sws bzw. den Strahlensatz mit Faktor ½.)"}],
 plain:[{t:"Stufen-/Wechselwinkel",e:"Kreuzt eine Gerade zwei Parallelen, entstehen gleich große Winkelpaare: Stufenwinkel liegen „gleich“ an beiden Kreuzungen, Wechselwinkel über Eck."},{t:"Innenwinkelsumme 180°",e:"In jedem ebenen Dreieck ergeben die drei Winkel zusammen immer eine halbe Umdrehung, also 180°."},{t:"Parallelogramm",e:"Ein Viereck, bei dem beide Paare gegenüberliegender Seiten parallel sind – z. B. ein „schiefes Rechteck“."}],
 links:[10,12,14,17]
},
/* ============================== THEMA 14 ============================== */
{
 id:14, chapter:"Kap. 7.4, 7.2.3", scope:"mittel", school:true,
 title:"Transversalen im Dreieck",
 subs:["Schnittpunkte von Winkelhalbierenden, Mittelsenkrechten, Höhen","Mittenlinien","Schnittpunkt der Seitenhalbierenden"],
 overview:"Die vier „merkwürdigen Punkte\u201c: Inkreismittelpunkt (Winkelhalbierende), Umkreismittelpunkt (Mittelsenkrechte), Höhenschnittpunkt, Schwerpunkt (Seitenhalbierende). Beweise laufen elegant über <strong>Ortslinien</strong> und den Mittenliniensatz.",
 defs:[
  {t:"Merkwürdige Punkte",b:"Inzenter <m>I</m> (Winkelhalbierende), Umzenter <m>U</m> (Mittelsenkrechte), Höhenschnittpunkt <m>H</m>, Schwerpunkt <m>S</m> (Seitenhalbierende). <m>U,S,H</m> liegen auf der <strong>Euler‑Geraden</strong>."}
 ],
 theorems:[
  {n:"Umkreismittelpunkt",s:"Die drei Mittelsenkrechten schneiden sich in einem Punkt <m>U</m> mit <m>|UA|=|UB|=|UC|</m> (Umkreismittelpunkt).",idea:"Ortslinien‑Argument: <m>U:=MiSenk(AB)∩MiSenk(BC)</m> erfüllt <m>|UA|=|UB|</m> und <m>|UB|=|UC|</m>, also <m>|UA|=|UC|</m> ⇒ <m>U∈MiSenk(AC)</m>."},
  {n:"Inkreismittelpunkt",s:"Die drei Winkelhalbierenden schneiden sich in <m>I</m> mit gleichem Abstand zu allen drei Seiten (Inkreis).",idea:"Winkelhalbierende = Ortslinie gleichen Abstands zu den beiden Schenkeln; analoges Schnitt‑Argument wie beim Umzenter."},
  {n:"Schwerpunkt teilt 2:1",s:"Die Seitenhalbierenden schneiden sich in <m>S</m>, der sie im Verhältnis <m>2:1</m> teilt.",idea:"Mittenliniensatz: die Mittenlinie ist halb so lang und parallel; ähnliche Dreiecke liefern das Teilverhältnis. (Höhen: über das Mittendreieck als Mittelsenkrechte auf einen Höhenschnittpunkt zurückführen.)"}
 ],
 sketch:{svg:`<svg viewBox="0 0 320 200" width="340">
   <polygon points="50,170 270,170 170,40" class="s-line"/>
   <line x1="50" y1="170" x2="220" y2="105" class="s-con"/>
   <line x1="270" y1="170" x2="110" y2="105" class="s-con"/>
   <line x1="170" y1="40" x2="160" y2="170" class="s-con"/>
   <circle cx="163" cy="127" r="4" class="s-pt-r"/><text x="170" y="124" class="s-lbl-r">S</text>
   <circle cx="50" cy="170" r="3.5" class="s-pt"/><circle cx="270" cy="170" r="3.5" class="s-pt"/><circle cx="170" cy="40" r="3.5" class="s-pt"/>
   <text x="150" y="194" text-anchor="middle" class="s-lbl-b">Seitenhalbierende → Schwerpunkt (2:1)</text>
 </svg>`,cap:"Die drei Seitenhalbierenden schneiden sich im Schwerpunkt S."},
 focus:[
  "Beweisschema für alle drei Schnittpunkte: <strong>Ortslinie ∩ Ortslinie erfüllt auch die dritte Bedingung</strong>.",
  "Umkreis ↔ Mittelsenkrechte (gleicher Abstand zu <em>Ecken</em>); Inkreis ↔ Winkelhalbierende (gleicher Abstand zu <em>Seiten</em>).",
  "Schwerpunkt teilt <m>2:1</m> — über Mittenliniensatz/Ähnlichkeit begründen.",
  "Höhenschnittpunkt über das <strong>Mittendreieck</strong> auf Mittelsenkrechten zurückführen."
 ],
 nachfr:[{q:"Beweisen Sie, dass sich die Mittelsenkrechten in einem Punkt schneiden.",a:"Sei <m>U</m> der Schnittpunkt der Mittelsenkrechten von <m>AB</m> und <m>BC</m>. Aus <m>U∈MiSenk(AB)</m> folgt <m>|UA|=|UB|</m>, aus <m>U∈MiSenk(BC)</m> folgt <m>|UB|=|UC|</m>. Also <m>|UA|=|UC|</m>, d. h. <m>U∈MiSenk(AC)</m>. Alle drei gehen durch <m>U</m>; <m>U</m> ist gleich weit von allen Ecken entfernt – der Umkreismittelpunkt."},{q:"Warum teilt der Schwerpunkt die Seitenhalbierenden im Verhältnis 2:1?",a:"Die Mittenlinie (Verbindung zweier Seitenmittelpunkte) ist parallel zur dritten Seite und halb so lang. Die dadurch entstehenden ähnlichen Dreiecke zeigen, dass der Schnittpunkt <m>S</m> zweier Seitenhalbierender jede im Verhältnis <m>2:1</m> (von der Ecke aus) teilt. Da das für jedes Paar gilt, treffen sich alle drei in <m>S</m>."},{q:"Welcher Zusammenhang besteht zwischen Höhen und Mittelsenkrechten?",a:"Ergänzt man <m>ABC</m> durch Parallelen zu einem doppelt so großen Dreieck, werden die Höhen von <m>ABC</m> zu Mittelsenkrechten dieses großen Dreiecks. Da sich Mittelsenkrechten in einem Punkt schneiden, tun das auch die Höhen – im Höhenschnittpunkt."}],
 plain:[{t:"Umkreis / Umkreismittelpunkt",e:"Der Kreis, der durch alle drei Ecken geht. Sein Mittelpunkt ist von allen Ecken gleich weit entfernt."},{t:"Inkreis",e:"Der größte Kreis, der ins Dreieck passt und alle drei Seiten von innen berührt."},{t:"Schwerpunkt",e:"Der Balancepunkt des Dreiecks – dort könnte man es auf einer Nadelspitze ausbalancieren."}],
 links:[9,13,17,5]
},
/* ============================== THEMA 15 ============================== */
{
 id:15, chapter:"Kap. 8.1–8.2", scope:"mittel", school:false,
 title:"Verschiebungen und Schubspiegelungen",
 subs:["Definitionen","Eigenschaften"],
 overview:"Zwei weitere Bewegungstypen. <strong>Verschiebung</strong> = Produkt zweier Spiegelungen an parallelen Achsen (fixpunktfrei, gleichsinnig). <strong>Schubspiegelung</strong> = Verschiebung ∘ Spiegelung entlang der Achse (fixpunktfrei, gegensinnig).",
 defs:[
  {t:"Verschiebung τ",b:"Bewegung ohne Fixpunkt, die jede Gerade in Richtung des Verschiebungsvektors auf eine Parallele abbildet; gleichsinnig. <m>τ=σ_b∘σ_a</m> mit <m>a∥b</m>, Betrag = doppelter Achsenabstand."},
  {t:"Schubspiegelung",b:"Verkettung einer Spiegelung an einer Geraden <m>g</m> mit einer Verschiebung <em>längs</em> <m>g</m>. Gegensinnig, fixpunktfrei; das Quadrat ist eine Verschiebung."}
 ],
 theorems:[
  {n:"Darstellung der Verschiebung",s:"Jede Verschiebung ist Produkt zweier Spiegelungen an parallelen Achsen; umgekehrt ist jedes solche Produkt eine Verschiebung.",idea:"Bild eines Punktes unter <m>σ_b∘σ_a</m> berechnen: senkrecht zu den Achsen, Betrag doppelter Abstand, Richtung fest ⇒ fixpunktfrei & richtungstreu."},
  {n:"Verschiebungen bilden Gruppe",s:"Die Verschiebungen bilden eine <strong>kommutative</strong> Untergruppe von <m>B(P)</m>; Verkettung entspricht Vektoraddition.",idea:"Über die Vektor-/Parallelogramm‑Darstellung; Reihenfolge egal ⇒ abelsch."},
  {n:"Schubspiegelung",s:"Eine gegensinnige Bewegung ohne Fixpunkt ist eine Schubspiegelung (mit eindeutiger Achse).",idea:"Reduktion von drei Spiegelungen (Dreispiegelungssatz): bei nicht kopunktalen/parallelen Achsen entsteht eine Schubspiegelung."}
 ],
 sketch:{svg:`<svg viewBox="0 0 340 190" width="360">
   <line x1="70" y1="20" x2="70" y2="175" class="s-con"/><line x1="150" y1="20" x2="150" y2="175" class="s-con"/>
   <text x="60" y="16" class="s-lbl-b">a</text><text x="142" y="16" class="s-lbl-b">b</text>
   <polygon points="30,130 55,130 42,95" class="s-line"/>
   <polygon points="178,130 203,130 190,95" class="s-res"/>
   <path d="M60 150 L180 150" class="s-line"/><path d="M172 145 L180 150 L172 155" class="s-line"/>
   <text x="105" y="168" class="s-lbl-b">2·Abstand(a,b)</text>
   <text x="250" y="100" class="s-lbl-r">σ_b∘σ_a</text><text x="250" y="120" class="s-lbl-r">= Verschiebung</text>
 </svg>`,cap:"Verschiebung als Produkt zweier Spiegelungen an parallelen Achsen."},
 focus:[
  "Merksatz‑Tabelle: <strong>2 Spiegel. || → Verschiebung; ∦ → Drehung; 3 Spiegel. → Spiegelung od. Schubspiegelung</strong>.",
  "Verschiebung: fixpunktfrei, gleichsinnig, richtungstreu; Betrag = doppelter Achsenabstand.",
  "Schubspiegelung: gegensinnig, fixpunktfrei — der „vierte\u201c Bewegungstyp.",
  "Verschiebungen bilden abelsche Gruppe ≅ Vektoren (Brücke zur analytischen Geometrie)."
 ],
 nachfr:[{q:"Was ergibt das Produkt zweier Spiegelungen an parallelen Achsen?",a:"Eine Verschiebung – senkrecht zu den Achsen, in Richtung von der ersten zur zweiten, um den <strong>doppelten</strong> Achsenabstand. Sie hat keinen Fixpunkt und ist gleichsinnig (orientierungserhaltend)."},{q:"Warum ist eine Schubspiegelung fixpunktfrei?",a:"Sie ist eine Spiegelung an einer Achse <m>g</m>, gefolgt von einer Verschiebung <em>längs</em> <m>g</m> (Vektor <m>≠0</m>). Der Spiegelanteil fixiert höchstens Punkte auf <m>g</m>, aber der Verschiebeanteil bewegt jeden Punkt von <m>g</m> echt weiter. Kein Punkt bleibt fest – fixpunktfrei (und gegensinnig)."},{q:"Zeigen Sie, dass Verschiebungen kommutieren.",a:"Jede Verschiebung entspricht einem Vektor; Hintereinanderausführen entspricht der Vektoraddition. Da <m>v+w=w+v</m>, ist die Reihenfolge egal. Die Verschiebungen bilden daher eine abelsche (kommutative) Untergruppe der Bewegungen."}],
 plain:[{t:"Verschiebung",e:"Die ganze Ebene ohne Drehen in eine feste Richtung schieben – jeder Punkt wandert um denselben Pfeil (Vektor)."},{t:"Schubspiegelung",e:"Erst spiegeln, dann entlang der Spiegelachse weiterschieben – wie eine Reihe Fußspuren im Sand: links, rechts, links versetzt."}],
 links:[11,7,16]
},
/* ============================== THEMA 16 ============================== */
{
 id:16, chapter:"Kap. 8.3–8.4", scope:"mittel", school:false,
 title:"Reduktionssätze",
 subs:["Grundaussagen","Gleichsinnige Bewegungen","Gleichsinnige Kongruenz"],
 overview:"Das <strong>Klassifikationsthema</strong>: Jede Bewegung ist Produkt von höchstens drei Spiegelungen. Daraus folgt die vollständige Einteilung der Bewegungen und der Begriff der Gleichsinnigkeit.",
 defs:[
  {t:"Gleich-/gegensinnig",b:"Eine Bewegung ist <strong>gleichsinnig</strong> (orientierungserhaltend), wenn sie Produkt einer <em>geraden</em> Anzahl von Spiegelungen ist, sonst <strong>gegensinnig</strong>. Wohldefiniert, da die Parität eindeutig ist."},
  {t:"Gleichsinnige Kongruenz",b:"Figuren, die durch eine gleichsinnige Bewegung ineinander übergehen (ohne „Umklappen\u201c)."}
 ],
 theorems:[
  {n:"Dreispiegelungssatz",s:"Jede Bewegung lässt sich als Produkt von <strong>höchstens drei</strong> Geradenspiegelungen darstellen.",idea:"Fahnensatz: bilde Anfangspunkt (1 Spiegelung), dann Richtung (2.), dann Halbebene (3.) der Fahne schrittweise ab. Danach identisch."},
  {n:"Reduktion von vier Spiegelungen",s:"Ein Produkt von vier Spiegelungen ist stets auf zwei reduzierbar.",idea:"Achsen paarweise geeignet drehen/verschieben (Spiegelungen an schneidenden/parallelen Achsen frei „umhängen\u201c), bis zwei sich wegheben."},
  {n:"Vollständige Einteilung",s:"Jede Bewegung ist Identität, Spiegelung, Drehung, Verschiebung oder Schubspiegelung.",idea:"Fallunterscheidung nach Spiegelungszahl (1/2/3) und Achsenlage (schneidend/parallel/allgemein) + Fixpunktverhalten."}
 ],
 sketch:{svg:`<svg viewBox="0 0 360 190" width="370">
   <rect x="20" y="30" width="150" height="130" rx="10" fill="rgba(44,96,121,.06)" stroke="#2C6079" stroke-width="1.4"/>
   <text x="95" y="52" text-anchor="middle" class="s-lbl-b">gleichsinnig</text>
   <text x="95" y="76" text-anchor="middle" class="s-lbl">id</text>
   <text x="95" y="100" text-anchor="middle" class="s-lbl">Verschiebung</text>
   <text x="95" y="124" text-anchor="middle" class="s-lbl">Drehung</text>
   <rect x="190" y="30" width="150" height="130" rx="10" fill="rgba(178,59,46,.06)" stroke="#B23B2E" stroke-width="1.4"/>
   <text x="265" y="52" text-anchor="middle" class="s-lbl-r">gegensinnig</text>
   <text x="265" y="82" text-anchor="middle" class="s-lbl">Spiegelung</text>
   <text x="265" y="112" text-anchor="middle" class="s-lbl">Schubspiegelung</text>
   <text x="180" y="182" text-anchor="middle" class="s-lbl-b">Parität der Spiegelungszahl entscheidet</text>
 </svg>`,cap:"Vollständige Klassifikation der ebenen Bewegungen."},
 focus:[
  "Zentraler Satz: <strong>≤ 3 Spiegelungen</strong> genügen — Beweis über den Fahnensatz erklären.",
  "Gleichsinnigkeit = <strong>Parität</strong> der Spiegelungszahl; Wohldefiniertheit betonen.",
  "Reduktion 4→2 als Schlüssellemma für die Klassifikation.",
  "Endergebnis: nur <strong>fünf</strong> Bewegungstypen — Tabelle nach gleich/gegensinnig × Fixpunkte."
 ],
 nachfr:[{q:"Beweisen Sie den Dreispiegelungssatz.",a:"Eine Bewegung ist durch das Bild einer Fahne (Punkt, Richtung, Seite) eindeutig bestimmt. Man bildet die Fahne schrittweise mit je einer Geradenspiegelung ab: die erste bringt den Anfangspunkt aufs Ziel, die zweite die Richtung, die dritte die Seite. Die Verkettung dieser höchstens drei Spiegelungen bildet die Fahne exakt wie die gegebene Bewegung ab, stimmt also mit ihr überein."},{q:"Warum ist Gleichsinnigkeit wohldefiniert?",a:"Zu zeigen ist, dass die Anzahl der Spiegelungen in jeder Darstellung derselben Bewegung stets gerade oder stets ungerade ist. Das folgt aus der Reduktion: vier Spiegelungen lassen sich immer auf zwei reduzieren (drei auf eine). Die Parität kann sich nie ändern; „gleichsinnig = gerade Anzahl“ ist eindeutig."},{q:"Klassifizieren Sie alle ebenen Bewegungen.",a:"Nach Spiegelungszahl und Achsenlage: 0 = Identität; 1 = Geradenspiegelung; 2 = Drehung (schneidende Achsen) oder Verschiebung (parallele Achsen); 3 = Geradenspiegelung (reduzierbar) oder Schubspiegelung. Insgesamt genau fünf Typen: Identität, Verschiebung, Drehung (gleichsinnig) sowie Geradenspiegelung und Schubspiegelung (gegensinnig)."}],
 plain:[{t:"Reduktionssatz",e:"Die Erkenntnis, dass jede noch so komplizierte Bewegung schon aus höchstens drei Spiegelungen zusammengesetzt werden kann – Spiegelungen sind die „Grundbausteine“."},{t:"gleichsinnig / gegensinnig",e:"Gleichsinnig = ohne Umklappen (Drehungen, Verschiebungen); gegensinnig = mit Umklappen, wobei aus links rechts wird (Spiegelungen)."}],
 links:[11,15,7]
},
/* ============================== THEMA 17 ============================== */
{
 id:17, chapter:"Kap. 7.2.3, 9.2", scope:"mittel", school:true,
 title:"Strahlensätze",
 subs:["Mittenlinien im Dreieck","Herleitung der Strahlensätze","Umkehrungen & Verallgemeinerung","Anwendungen"],
 overview:"Schulnahes Kernthema. Aus dem <strong>Mittenliniensatz</strong> wird über Induktion und zentrische Streckung der <strong>1. und 2. Strahlensatz</strong> gewonnen. Wichtig: exakte Voraussetzungen, Umkehrungen und typische Anwendungen.",
 defs:[
  {t:"Strahlensatz-Konfiguration",b:"Zwei Strahlen mit gemeinsamem Anfangspunkt <m>O</m>, geschnitten von zwei zueinander <strong>parallelen</strong> Geraden. Es entstehen Abschnitte auf den Strahlen und auf den Parallelen."}
 ],
 theorems:[
  {n:"1. Strahlensatz",s:"Werden zwei Strahlen aus <m>O</m> von zwei Parallelen geschnitten, so verhalten sich die Abschnitte auf dem einen Strahl wie die entsprechenden auf dem anderen: <m>|OA₁|:|OA₂| = |OB₁|:|OB₂|</m>.",idea:"Rationaler Fall über den Mittenliniensatz + Induktion (Verkleinern in kongruente Teildreiecke). Allgemeiner Fall per Stetigkeit/Approximation; sauberer über <strong>zentrische Streckung</strong>."},
  {n:"2. Strahlensatz",s:"Zusätzlich verhalten sich die Abschnitte <em>auf den Parallelen</em> wie die auf den Strahlen: <m>|A₁B₁|:|A₂B₂| = |OA₁|:|OA₂|</m>.",idea:"Folgt aus dem 1. Strahlensatz durch Verschieben einer Parallelen und erneutes Anwenden bzw. direkt aus der zentrischen Streckung."},
  {n:"Umkehrung",s:"Gilt die Abschnittsproportion auf beiden Strahlen, so sind die Schnittgeraden parallel (Umkehrung des 1. Strahlensatzes). Für den 2. gilt das nicht uneingeschränkt.",idea:"Über die Eindeutigkeit der Parallelen (Axiom P): eine dritte Gerade mit gleichem Verhältnis müsste mit der Parallelen zusammenfallen."}
 ],
 sketch:{svg:`<svg viewBox="0 0 340 200" width="360">
   <circle cx="40" cy="100" r="4" class="s-pt"/><text x="26" y="104" class="s-lbl">O</text>
   <line x1="40" y1="100" x2="320" y2="40" class="s-line"/>
   <line x1="40" y1="100" x2="320" y2="170" class="s-line"/>
   <line x1="130" y1="81" x2="130" y2="118" class="s-res"/>
   <line x1="250" y1="55" x2="250" y2="152" class="s-res"/>
   <text x="120" y="74" class="s-lbl">A₁</text><text x="120" y="132" class="s-lbl">B₁</text>
   <text x="255" y="50" class="s-lbl">A₂</text><text x="255" y="166" class="s-lbl">B₂</text>
   <text x="180" y="193" text-anchor="middle" class="s-lbl-b">|OA₁|:|OA₂| = |OB₁|:|OB₂| = |A₁B₁|:|A₂B₂|</text>
 </svg>`,cap:"Strahlensatz-Konfiguration: gemeinsamer Punkt O, zwei parallele Schnittgeraden."},
 focus:[
  "Herleitungslinie parat: <strong>Mittenliniensatz → Induktion (rational) → zentrische Streckung (allgemein)</strong>.",
  "Voraussetzungen exakt: <em>parallele</em> Schnittgeraden, gemeinsamer Scheitel.",
  "Umkehrung des 1. Strahlensatzes gilt; beim 2. auf Ausnahmen hinweisen.",
  "Anwendungen: Streckenteilung, Höhenmessung, Ähnlichkeitsbeweise."
 ],
 nachfr:[{q:"Leiten Sie den 1. Strahlensatz aus dem Mittenliniensatz her.",a:"Zunächst für ganzzahlige Teilungen: Trägt man <m>OA₁</m> auf dem Strahl <m>k</m>‑mal ab und zieht Parallele zur ersten Schnittgeraden, zerlegen die Parallelen das große Dreieck per Mittenliniensatz in lauter kongruente Teildreiecke. Daraus <m>|OA_k|:|OA₁|=|OB_k|:|OB₁|</m> für ganze <m>k</m>, per Teilung für rationale, über Stetigkeit bzw. zentrische Streckung für beliebige Verhältnisse. Die Abschnitte verhalten sich auf beiden Strahlen gleich."},{q:"Formulieren und prüfen Sie die Umkehrung.",a:"Umkehrung (1. Strahlensatz): Gilt <m>|OA₁|:|OA₂|=|OB₁|:|OB₂|</m>, so sind die Schnittgeraden parallel. Sie ist wahr: Eine zweite, nicht‑parallele Gerade durch <m>B₁</m> mit demselben Verhältnis widerspräche der Eindeutigkeit der Parallelen (Parallelenaxiom). Die Umkehrung des 2. Strahlensatzes gilt dagegen nicht uneingeschränkt."},{q:"Wie hängen Strahlensätze und zentrische Streckung zusammen?",a:"Die Strahlensatz‑Figur ist das Bild einer zentrischen Streckung mit Zentrum <m>O</m>: <m>A₂=Z_{O,k}(A₁)</m>, <m>B₂=Z_{O,k}(B₁)</m>. Da die Streckung Geraden auf parallele abbildet und Längen mit <m>k</m> multipliziert, sind die Strahlensätze genau deren Längen‑ und Parallelitätsaussagen – auch für irrationale Faktoren sauber begründet."}],
 plain:[{t:"Strahlensatz",e:"Schneiden zwei parallele Linien zwei aus einem Punkt auslaufende Strahlen, so teilen sie beide Strahlen im gleichen Verhältnis – die Grundlage fürs indirekte Messen (z. B. Baumhöhe über den Schatten)."}],
 links:[13,18,19,14]
},
/* ============================== THEMA 18 ============================== */
{
 id:18, chapter:"Kap. 9.1–9.3", scope:"breit", school:true,
 title:"Zentrische Streckung und Ähnlichkeit",
 subs:["Gruppeneigenschaften","Invarianzeigenschaften","Existenz & Eindeutigkeit","Ähnlichkeit als Äquivalenzrelation"],
 overview:"Breites Thema: <strong>zentrische Streckung</strong> und allgemeine <strong>Ähnlichkeitsabbildungen</strong>. Ähnlichkeit ist — wie Kongruenz — eine über eine Abbildungsgruppe erzeugte Äquivalenzrelation, jetzt mit Streckfaktor.",
 defs:[
  {t:"Zentrische Streckung",b:"<m>Z_{S,k}</m> mit Zentrum <m>S</m>, Faktor <m>k≠0</m>: <m>P↦P'</m> mit <m>P'</m> auf <m>SP</m> und <m>|SP'|=|k|·|SP|</m> (Seite je nach Vorzeichen). Bildet Geraden auf parallele Geraden ab, multipliziert Längen mit <m>|k|</m>, erhält Winkel."},
  {t:"Ähnlichkeitsabbildung",b:"Bijektion, die alle Abstände mit einem festen Faktor <m>k>0</m> multipliziert. = Verkettung einer zentrischen Streckung mit einer Bewegung."},
  {t:"Ähnlichkeit ~",b:"<m>F~F' :⇔</m> es gibt eine Ähnlichkeitsabbildung mit <m>φ(F)=F'</m>. Äquivalenzrelation (von der Gruppe der Ähnlichkeitsabbildungen erzeugt)."}
 ],
 theorems:[
  {n:"Gruppen-/Invarianzeigenschaften",s:"Ähnlichkeitsabbildungen bilden eine Gruppe; sie erhalten Winkel, Teilverhältnisse und Parallelität, multiplizieren Längen und Flächen mit <m>k</m> bzw. <m>k²</m>.",idea:"Verkettung/Inverse von Streckungen und Bewegungen sind wieder solche; Winkel- und Verhältnistreue aus den Strahlensätzen."},
  {n:"Hauptähnlichkeitssatz (WW)",s:"Stimmen zwei Dreiecke in zwei Winkeln überein, so sind sie ähnlich.",idea:"Streckung, die eine Seite auf die entsprechende abbildet, gefolgt von einer Bewegung (Winkelantragen) ⇒ Deckung; Eindeutigkeit über wsw."},
  {n:"Ähnlichkeitssätze",s:"WW, SS:S (Seitenverhältnisse), SWS (zwei Seitenverhältnisse + eingeschl. Winkel) — analog zu den Kongruenzsätzen mit Faktor.",idea:"Auf Kongruenzsätze zurückführen, nachdem eine zentrische Streckung die Größen angepasst hat."}
 ],
 sketch:{svg:`<svg viewBox="0 0 340 190" width="360">
   <circle cx="40" cy="150" r="4" class="s-pt"/><text x="28" y="166" class="s-lbl">S</text>
   <polygon points="90,140 150,140 120,105" class="s-line"/>
   <polygon points="140,120 260,120 200,50" class="s-res"/>
   <line x1="40" y1="150" x2="260" y2="120" class="s-con"/>
   <line x1="40" y1="150" x2="200" y2="50" class="s-con"/>
   <line x1="40" y1="150" x2="140" y2="120" class="s-con"/>
   <text x="150" y="184" text-anchor="middle" class="s-lbl-b">Z_{S,k}: bildlich vergrößertes, ähnliches Dreieck</text>
 </svg>`,cap:"Zentrische Streckung mit Zentrum S und Faktor k > 1."},
 focus:[
  "Parallele zu Thema 8: Ähnlichkeit ist Äquivalenzrelation, <strong>weil</strong> die Ähnlichkeitsabbildungen eine Gruppe bilden.",
  "Zentrische Streckung: <strong>geradentreu (→ parallel), winkeltreu, |k|-längentreu</strong>.",
  "Zerlegung: jede Ähnlichkeitsabbildung = Streckung ∘ Bewegung.",
  "Flächen skalieren mit <m>k²</m> — wichtig für Anwendungen."
 ],
 nachfr:[{q:"Zeigen Sie, dass die zentrische Streckung Geraden auf Parallelen abbildet.",a:"Sei <m>g</m> eine Gerade ohne das Zentrum <m>S</m>, <m>A,B∈g</m>. Ihre Bilder liegen auf <m>SA,SB</m> mit <m>|SA'|=k|SA|</m>, <m>|SB'|=k|SB|</m>. Nach dem Strahlensatz ist <m>A'B'∥AB</m>. Also wird <m>g</m> auf eine parallele Gerade abgebildet (Geraden durch <m>S</m> bleiben fix)."},{q:"Beweisen Sie den Hauptähnlichkeitssatz.",a:"Stimmen zwei Dreiecke in zwei (also allen) Winkeln überein, wende zuerst eine zentrische Streckung an, die eine Seite auf die Länge der entsprechenden Seite des zweiten Dreiecks bringt. Das gestreckte Dreieck ist winkelgleich und hat nun eine gleich lange Seite; nach wsw ist es kongruent zum zweiten. Streckung ∘ Bewegung ist eine Ähnlichkeitsabbildung – die Dreiecke sind ähnlich."},{q:"Warum ist Ähnlichkeit eine Äquivalenzrelation?",a:"Weil die Ähnlichkeitsabbildungen eine Gruppe bilden: die Identität ist eine (reflexiv), zu jeder mit Faktor <m>k</m> gibt es die Inverse mit <m>1/k</m> (symmetrisch), und die Verkettung ist wieder eine mit Produktfaktor (transitiv). Damit ist <m>~</m> reflexiv, symmetrisch und transitiv – wie Kongruenz, nur mit Größenänderung."}],
 plain:[{t:"zentrische Streckung",e:"Ein Vergrößern oder Verkleinern von einem festen Zentrum aus – wie ein Beamer, der ein Bild von einem Punkt aus maßstabsgetreu aufbläst."},{t:"Ähnlichkeit",e:"Zwei Figuren sind ähnlich, wenn sie dieselbe Form, aber evtl. verschiedene Größe haben – wie ein Foto und sein Abzug in anderer Größe."}],
 links:[17,8,19,12]
},
/* ============================== THEMA 19 ============================== */
{
 id:19, chapter:"Kap. 9.4", scope:"eng", school:true,
 title:"Satzgruppe des Pythagoras",
 subs:["Höhensatz, Kathetensatz","Satz des Pythagoras mit Umkehrungen"],
 overview:"Enges, sehr schulnahes Thema — hier musst du alles können. Höhensatz, Kathetensatz und Satz des Pythagoras folgen alle aus der <strong>Ähnlichkeit der Teildreiecke</strong> an der Hypotenusenhöhe. Umkehrungen und Äquivalenz kennen.",
 defs:[
  {t:"Katheten / Hypotenuse",b:"Im rechtwinkligen Dreieck: die dem rechten Winkel <strong>anliegenden</strong> Seiten sind Katheten, die <strong>gegenüberliegende</strong> ist die Hypotenuse. Die Höhe auf die Hypotenuse teilt diese in zwei <strong>Hypotenusenabschnitte</strong> <m>p,q</m>."}
 ],
 theorems:[
  {n:"Grundlemma (Ähnlichkeit)",s:"Fällt man im bei <m>C</m> rechtwinkligen Dreieck die Höhe auf <m>AB</m> mit Fußpunkt <m>D</m>, so sind <m>ABC</m>, <m>ADC</m>, <m>CDB</m> paarweise ähnlich.",idea:"Alle drei haben einen rechten Winkel und teilen je einen spitzen Winkel ⇒ WW-Ähnlichkeit. Daraus folgen die drei Produktformeln."},
  {n:"Höhen- & Kathetensatz",s:"Höhensatz: <m>h² = p·q</m>. Kathetensatz: <m>a² = c·p</m> und <m>b² = c·q</m>.",idea:"Direkt aus den Verhältnissen der ähnlichen Teildreiecke: <m>h/p=q/h</m> bzw. <m>a/c=p/a</m>."},
  {n:"Satz des Pythagoras & Umkehrung",s:"<m>a²+b²=c²</m>. Umkehrung: gilt <m>a²+b²=c²</m>, so ist das Dreieck bei <m>C</m> rechtwinklig.",idea:"Pythagoras: Kathetensatz addieren, <m>a²+b²=c·p+c·q=c(p+q)=c²</m>. Umkehrung über Kongruenz mit einem konstruierten rechtwinkligen Vergleichsdreieck (sss)."}
 ],
 sketch:{svg:`<svg viewBox="0 0 340 200" width="360">
   <polygon points="40,160 300,160 120,50" class="s-line"/>
   <line x1="120" y1="50" x2="120" y2="160" class="s-res"/>
   <rect x="120" y="148" width="12" height="12" fill="none" stroke="#B23B2E" stroke-width="1.4"/>
   <circle cx="120" cy="50" r="3.5" class="s-pt"/>
   <rect x="107" y="61" width="13" height="13" fill="none" stroke="#1B2436" stroke-width="1.3" transform="rotate(-31 120 50)"/>
   <text x="30" y="176" class="s-lbl">A</text><text x="300" y="176" class="s-lbl">B</text><text x="116" y="44" class="s-lbl">C</text><text x="118" y="176" class="s-lbl-r">D</text>
   <text x="78" y="176" class="s-lbl-b">p</text><text x="205" y="176" class="s-lbl-b">q</text><text x="126" y="110" class="s-lbl-r">h</text>
   <text x="170" y="196" text-anchor="middle" class="s-lbl-b">h²=p·q · a²=c·p · b²=c·q · a²+b²=c²</text>
 </svg>`,cap:"Hypotenusenhöhe erzeugt drei ähnliche Dreiecke — Quelle der ganzen Satzgruppe."},
 focus:[
  "Alle drei Sätze aus <strong>einem</strong> Ähnlichkeitslemma herleiten — das ist die elegante Prüfungsantwort.",
  "Pythagoras = Summe der beiden Kathetensätze.",
  "<strong>Umkehrung</strong> sauber formulieren und über sss/Kongruenz beweisen.",
  "Äquivalenz erwähnen: Höhensatz, Kathetensatz, Pythagoras sind (mit Zusatz) logisch gleichwertig."
 ],
 nachfr:[{q:"Beweisen Sie den Kathetensatz über Ähnlichkeit.",a:"Fälle im bei <m>C</m> rechtwinkligen Dreieck die Höhe auf <m>AB</m> mit Fußpunkt <m>D</m>. Die Teildreiecke <m>ADC</m> und <m>ABC</m> haben je einen rechten Winkel und den Winkel bei <m>A</m> gemeinsam, sind also ähnlich. Aus <m>|AB|:|AC|=|AC|:|AD|</m> folgt <m>|AC|²=|AB|·|AD|</m> – Kathetenquadrat gleich Hypotenuse mal anliegendem Hypotenusenabschnitt."},{q:"Leiten Sie Pythagoras aus dem Kathetensatz her.",a:"Der Kathetensatz liefert <m>|AC|²=|AB|·|AD|</m> und <m>|BC|²=|AB|·|BD|</m>. Addiert und mit <m>|AD|+|BD|=|AB|</m> (<m>D</m> liegt zwischen <m>A,B</m>): <m>|AC|²+|BC|²=|AB|·(|AD|+|BD|)=|AB|²</m>. Das ist <m>a²+b²=c²</m>."},{q:"Beweisen Sie die Umkehrung des Satzes des Pythagoras.",a:"Gelte <m>a²+b²=c²</m>. Konstruiere ein Vergleichsdreieck mit denselben Kathetenlängen <m>a,b</m>, aber rechtem Winkel dazwischen; seine Hypotenuse hat nach Pythagoras die Länge <m>√(a²+b²)=c</m>. Beide Dreiecke stimmen in allen drei Seiten überein, sind nach sss kongruent – also ist auch das Ausgangsdreieck rechtwinklig."}],
 plain:[{t:"Kathete / Hypotenuse",e:"Im rechtwinkligen Dreieck sind die beiden Seiten am rechten Winkel die Katheten, die längste Seite ihm gegenüber ist die Hypotenuse."},{t:"Satz des Pythagoras",e:"Im rechtwinkligen Dreieck ist die Summe der Quadrate über den beiden kurzen Seiten gleich dem Quadrat über der langen: a²+b²=c²."}],
 links:[18,20,17,14]
},
/* ============================== THEMA 20 ============================== */
{
 id:20, chapter:"Kap. 9.5–9.6", scope:"breit", school:true,
 title:"Trigonometrische Funktionen",
 subs:["Geometrische Definition","Grundlegende Eigenschaften","Kosinus- & Sinussatz","Monotonie & Surjektivität","Additionstheoreme"],
 overview:"Breites Thema: von der geometrischen Definition am rechtwinkligen Dreieck (bzw. Einheitskreis) zu Sinus-/Kosinussatz und Additionstheoremen. Verbindung von Geometrie und Analysis.",
 defs:[
  {t:"sin, cos, tan",b:"Am rechtwinkligen Dreieck: <m>sinα = Gegenkathete/Hypotenuse</m>, <m>cosα = Ankathete/Hypotenuse</m>, <m>tanα = sin/cos</m>. Wohldefiniert, weil ähnliche Dreiecke gleiche Verhältnisse haben. Erweiterung auf <m>[0,π]</m> bzw. den Einheitskreis."},
  {t:"Grundbeziehung",b:"<m>sin²α + cos²α = 1</m> (Pythagoras am Einheitskreis)."}
 ],
 theorems:[
  {n:"Sinussatz",s:"In jedem Dreieck gilt <m>a/sinα = b/sinβ = c/sinγ = 2R</m> (<m>R</m> Umkreisradius).",idea:"Höhe <m>h_c=b·sinα=a·sinβ</m> gleichsetzen ⇒ <m>a/sinα=b/sinβ</m>. Der <m>2R</m>-Zusammenhang über den Peripheriewinkelsatz."},
  {n:"Kosinussatz",s:"<m>c² = a² + b² − 2ab·cosγ</m>. Für <m>γ=π/2</m> wird daraus Pythagoras.",idea:"Höhe fällen, Hypotenusenabschnitte über <m>cosγ</m> ausdrücken, Pythagoras in den Teildreiecken anwenden und zusammensetzen."},
  {n:"Additionstheoreme",s:"<m>sin(α±β)=sinα cosβ ± cosα sinβ</m>, <m>cos(α±β)=cosα cosβ ∓ sinα sinβ</m>.",idea:"Geometrisch über Projektionen am Einheitskreis / Drehmatrizen; Monotonie & Surjektivität liefern die Umkehrfunktionen arcsin/arccos."}
 ],
 sketch:{svg:`<svg viewBox="0 0 340 200" width="360">
   <circle cx="110" cy="120" r="70" class="s-con"/>
   <line x1="40" y1="120" x2="180" y2="120" class="s-line"/><line x1="110" y1="50" x2="110" y2="190" class="s-line"/>
   <line x1="110" y1="120" x2="163" y2="74" class="s-res"/>
   <line x1="163" y1="74" x2="163" y2="120" class="s-line"/>
   <path d="M135 120 A25 25 0 0 0 148 98" class="s-res"/><text x="140" y="114" class="s-lbl-r">α</text>
   <text x="167" y="100" class="s-lbl">sinα</text><text x="128" y="136" class="s-lbl">cosα</text>
   <text x="110" y="196" text-anchor="middle" class="s-lbl-b">Einheitskreis: (cosα, sinα)</text>
   <text x="255" y="90" class="s-lbl-r">sin²α+cos²α=1</text>
   <text x="250" y="120" class="s-lbl-b">a/sinα = 2R</text>
   <text x="250" y="150" class="s-lbl-b">c²=a²+b²−2ab·cosγ</text>
 </svg>`,cap:"Geometrische Definition am Einheitskreis, Basis für Sinus- und Kosinussatz."},
 focus:[
  "Wohldefiniertheit über <strong>Ähnlichkeit</strong> begründen (Verhältnisse unabhängig von der Dreiecksgröße).",
  "Sinussatz (Höhe gleichsetzen) und Kosinussatz (verallgemeinerter Pythagoras) je mit Beweisidee.",
  "Kosinussatz für <m>γ=90°</m> → Pythagoras: schöne Einordnung.",
  "Monotonie/Surjektivität ⇒ Umkehrfunktionen; Additionstheoreme geometrisch motivieren."
 ],
 nachfr:[{q:"Beweisen Sie den Sinussatz.",a:"Fälle die Höhe <m>h_c</m> von <m>C</m> auf <m>AB</m>. Dann <m>h_c=b·sinα</m> (Teildreieck bei <m>A</m>) und <m>h_c=a·sinβ</m> (bei <m>B</m>). Gleichsetzen: <m>a·sinβ=b·sinα</m>, also <m>a/sinα=b/sinβ</m>; analog die dritte Seite. Der gemeinsame Wert ist <m>2R</m> (Umkreisdurchmesser, über den Peripheriewinkelsatz)."},{q:"Leiten Sie den Kosinussatz her und zeigen Sie den Grenzfall Pythagoras.",a:"Fälle die Höhe von <m>C</m>; der Fußpunkt teilt <m>c</m> in <m>p,q</m> mit <m>p=b·cosα</m>. Setzt man Pythagoras in den Teildreiecken zusammen, folgt <m>c²=a²+b²−2ab·cosγ</m>. Für <m>γ=90°</m> ist <m>cosγ=0</m>, es bleibt <m>c²=a²+b²</m> – Pythagoras als Spezialfall."},{q:"Warum sind sin und cos auf geeigneten Intervallen umkehrbar?",a:"Auf <m>[−π/2,π/2]</m> ist <m>sin</m> streng monoton wachsend mit Bild <m>[−1,1]</m>; auf <m>[0,π]</m> ist <m>cos</m> streng monoton fallend mit Bild <m>[−1,1]</m>. Streng monotone, surjektive Funktionen sind bijektiv, also umkehrbar – daraus entstehen <m>arcsin</m> und <m>arccos</m>."}],
 plain:[{t:"Sinus / Kosinus",e:"Verhältniszahlen im rechtwinkligen Dreieck: Sinus = Gegenkathete/Hypotenuse, Kosinus = Ankathete/Hypotenuse. Am Einheitskreis sind es einfach die Höhe und die Breite des Punktes."},{t:"Sinussatz / Kosinussatz",e:"Formeln, mit denen man in beliebigen (auch nicht rechtwinkligen) Dreiecken fehlende Seiten und Winkel ausrechnet."}],
 links:[19,23,18]
},
/* ============================== THEMA 21 ============================== */
{
 id:21, chapter:"Kap. 10.1", scope:"eng", school:true,
 title:"Lagebeziehungen von Kreis und Gerade",
 subs:["Passanten, Sekanten, Tangenten","Satz zu den Berührradien","Tangentenabschnittssatz"],
 overview:"Enges Kreisthema. Klassifikation Gerade–Kreis über den Abstand, der <strong>Berührradius</strong> (Tangente ⊥ Radius) und der Tangentenabschnittssatz. Kompakt und beweisbar.",
 defs:[
  {t:"Passante / Tangente / Sekante",b:"Gerade mit Abstand <m>d(M,g)</m> zum Mittelpunkt: <m>d>r</m> Passante (0 Punkte), <m>d=r</m> Tangente (1 Punkt, Berührpunkt), <m>d<r</m> Sekante (2 Punkte)."}
 ],
 theorems:[
  {n:"Berührradiussatz",s:"Eine Tangente steht im Berührpunkt <strong>senkrecht</strong> auf dem Radius (und umgekehrt).",idea:"Der Berührpunkt ist der nächstgelegene Kreispunkt zu <m>M</m>; der kürzeste Abstand Punkt–Gerade wird auf dem Lot erreicht ⇒ Radius = Lot ⇒ ⊥."},
  {n:"Tangentenabschnittssatz",s:"Die beiden Tangentenabschnitte von einem äußeren Punkt <m>P</m> an einen Kreis sind gleich lang: <m>|PT₁|=|PT₂|</m>.",idea:"Die Dreiecke <m>MPT₁</m> und <m>MPT₂</m> sind rechtwinklig (Berührradius), haben <m>MP</m> gemeinsam und <m>|MT₁|=|MT₂|=r</m> ⇒ kongruent (SsW/Pythagoras) ⇒ gleiche Tangentenlängen."}
 ],
 sketch:{svg:`<svg viewBox="0 0 340 200" width="360">
   <circle cx="120" cy="110" r="60" class="s-line"/><circle cx="120" cy="110" r="3.5" class="s-pt"/><text x="108" y="106" class="s-lbl">M</text>
   <circle cx="290" cy="110" r="4" class="s-pt-r"/><text x="296" y="114" class="s-lbl-r">P</text>
   <line x1="290" y1="110" x2="158" y2="62" class="s-res"/><line x1="290" y1="110" x2="158" y2="158" class="s-res"/>
   <line x1="120" y1="110" x2="158" y2="62" class="s-con"/><line x1="120" y1="110" x2="158" y2="158" class="s-con"/>
   <circle cx="158" cy="62" r="3.5" class="s-pt"/><circle cx="158" cy="158" r="3.5" class="s-pt"/>
   <text x="162" y="56" class="s-lbl">T₁</text><text x="162" y="172" class="s-lbl">T₂</text>
   <text x="170" y="194" text-anchor="middle" class="s-lbl-b">|PT₁|=|PT₂| · Radius ⊥ Tangente</text>
 </svg>`,cap:"Berührradius und gleich lange Tangentenabschnitte von einem äußeren Punkt."},
 focus:[
  "Klassifikation Gerade–Kreis strikt über <strong>Abstand vs. Radius</strong> begründen (Lot + Pythagoras).",
  "Berührradiussatz als <strong>Minimalabstands</strong>-Argument — sehr elegant.",
  "Tangentenabschnittssatz über zwei kongruente rechtwinklige Dreiecke.",
  "Anwendung: Inkreis eines Dreiecks (Tangentenlängen)."
 ],
 nachfr:[{q:"Beweisen Sie, dass die Tangente senkrecht auf dem Berührradius steht.",a:"Der Berührpunkt <m>T</m> ist der einzige gemeinsame Punkt und damit der Punkt der Geraden mit kleinstem Abstand zu <m>M</m> (jeder andere läge weiter als <m>r</m>). Der kürzeste Abstand Punkt–Gerade wird auf dem Lot erreicht. Also ist <m>MT</m> das Lot auf die Tangente, d. h. der Radius <m>MT</m> steht senkrecht auf ihr."},{q:"Beweisen Sie den Tangentenabschnittssatz.",a:"Von einem äußeren Punkt <m>P</m> gehen zwei Tangenten mit Berührpunkten <m>T₁,T₂</m>. Die Dreiecke <m>MPT₁</m> und <m>MPT₂</m> sind bei <m>T₁,T₂</m> rechtwinklig (Berührradius), haben die gemeinsame Hypotenuse <m>MP</m> und gleiche Katheten <m>|MT₁|=|MT₂|=r</m>. Nach Pythagoras (bzw. SsW) sind sie kongruent, also <m>|PT₁|=|PT₂|</m>."},{q:"Wie viele Tangenten gibt es von einem inneren/äußeren Punkt?",a:"Von einem Punkt außerhalb des Kreises genau zwei, von einem Punkt auf dem Kreis genau eine (im Berührpunkt), von einem inneren Punkt keine – jede Gerade durch einen inneren Punkt ist Sekante."}],
 plain:[{t:"Tangente / Sekante / Passante",e:"Eine Gerade kann einen Kreis streifen (Tangente, ein Berührpunkt), durchschneiden (Sekante, zwei Punkte) oder verfehlen (Passante, kein Punkt)."},{t:"Berührradius",e:"Der Radius zum Berührpunkt trifft die Tangente im rechten Winkel – die Tangente „lehnt“ rechtwinklig am Radius an."}],
 links:[4,22,23,19]
},
/* ============================== THEMA 22 ============================== */
{
 id:22, chapter:"Kap. 10.3, 10.4.3", scope:"mittel", school:false,
 title:"Sehnen",
 subs:["Sehnen","Sehnenvierecke","Sehnenabschnittssatz","Tangentenvierecke"],
 overview:"Kreisthema um Sehnen: Sehnenvierecke (Umkreis) und Tangentenvierecke (Inkreis) mit ihren charakteristischen Winkel- bzw. Seitenbedingungen, plus der Sehnen-/Sekantenabschnittssatz (Potenz des Punktes).",
 defs:[
  {t:"Sehne",b:"Strecke zwischen zwei Kreispunkten. Die Mittelsenkrechte jeder Sehne geht durch den Mittelpunkt."},
  {t:"Sehnen- / Tangentenviereck",b:"<strong>Sehnenviereck</strong>: alle Ecken auf einem Kreis (Umkreis). <strong>Tangentenviereck</strong>: alle Seiten berühren einen Kreis (Inkreis)."}
 ],
 theorems:[
  {n:"Sehnenviereckssatz",s:"Ein (konvexes) Viereck besitzt genau dann einen Umkreis, wenn die Summe gegenüberliegender Innenwinkel <m>π</m> beträgt.",idea:"„⇒\u201c über den Peripheriewinkelsatz (gegenüberliegende Winkel sehen komplementäre Bögen). „⇐\u201c über die Umkehrung (Widerspruch, falls die vierte Ecke nicht auf dem Kreis liegt)."},
  {n:"Tangentenviereckssatz",s:"Ein (konvexes) Viereck besitzt genau dann einen Inkreis, wenn die Summen gegenüberliegender Seitenlängen gleich sind: <m>a+c=b+d</m>.",idea:"Tangentenabschnittssatz: jede Ecke liefert zwei gleiche Tangentenlängen; Summieren der Seiten ergibt die Gleichheit."},
  {n:"Sehnen-/Sekantenabschnittssatz",s:"Für Sehnen durch einen inneren Punkt <m>P</m>: <m>|PA|·|PB|=|PC|·|PD|</m>. Für Sekanten von außen analog; die Größe heißt <strong>Potenz</strong> von <m>P</m>.",idea:"Peripheriewinkel liefern ähnliche Dreiecke <m>PAC∼PDB</m> ⇒ Verhältnisgleichung ⇒ Produktgleichheit."}
 ],
 sketch:{svg:`<svg viewBox="0 0 340 200" width="360">
   <circle cx="120" cy="105" r="72" class="s-line"/>

const GROUPS = [
  {name:"Grundlagen & Axiome", ids:[1,2,3]},
  {name:"Figuren & Konstruktion", ids:[4,5,6]},
  {name:"Bewegungen & Kongruenz", ids:[7,8,9,10,11]},

/* ===================== STATE (Fortschritt) ===================== */
const KEY = "koksch-geometrie-fortschritt";
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){ done = {}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(done)); }catch(e){} }

let current = 1;
const byId = id => TOPICS.find(t=>t.id===id);

/* ===================== NAVIGATION rendern ===================== */
const nav = document.getElementById('nav');
function buildNav(){
  nav.innerHTML = "";
  GROUPS.forEach(g=>{
    const h = document.createElement('div');
    h.className='navgroup'; h.textContent=g.name; nav.appendChild(h);
    g.ids.forEach(id=>{
      const t = byId(id);
      const item = document.createElement('div');
      item.className='navitem'+(id===current?' active':'')+(done[id]?' done':'');
      item.dataset.id=id;
      item.dataset.search=(t.title+' '+t.subs.join(' ')+' '+t.overview).toLowerCase();
      item.innerHTML=`<span class="navnum">${id}</span><span class="navtitle">${t.title}</span>
        <span class="navcheck">${done[id]?'✓':''}</span>`;
      item.addEventListener('click',()=>{ show(id); closeMenu(); });
      nav.appendChild(item);
    });
  });
}

/* ===================== FORTSCHRITT ===================== */
function updateProgress(){
  const n = Object.values(done).filter(Boolean).length;
  document.getElementById('progfill').style.width=(n/24*100)+'%';
  document.getElementById('progcount').textContent=`${n} / 24 sicher`;
}

/* ===================== helpers ===================== */
function esc(s){return s;}
function renderList(arr,cls,fn){ return arr && arr.length ? arr.map(fn).join('') : ''; }

/* ===================== TOPIC rendern ===================== */
function show(id){
  current=id; const t=byId(id);
  document.querySelectorAll('.navitem').forEach(n=>n.classList.toggle('active',+n.dataset.id===id));
  const idx = TOPICS.findIndex(x=>x.id===id);
  const prev = idx>0?TOPICS[idx-1]:null, next = idx<TOPICS.length-1?TOPICS[idx+1]:null;

  const scopeLabel = {breit:"breites Gebiet",eng:"eng — hier (fast) alles wissen",mittel:"mittleres Gebiet"}[t.scope];

  const defs = renderList(t.defs,'',d=>`<div class="entry"><span class="lbl def">Def</span><span class="name">${d.t}</span><div class="body">${d.b}</div></div>`);
  const axioms = t.axioms ? renderList(t.axioms,'',a=>`<div class="entry"><span class="lbl ax">Axiom ${a.n}</span><div class="body inline">${a.b}</div></div>`) : '';
  const sätze = renderList(t.theorems,'',s=>`<div class="entry"><span class="lbl satz">Satz</span><span class="name">${s.n}</span><div class="body">${s.s}</div>${s.idea?`<details class="idea"><summary>Beweisidee anzeigen</summary><div class="ideabody">${s.idea}</div></details>`:''}</div>`);
  const nachfr = renderList(t.nachfr,'',n=>`<div class="qa"><div class="q">${n.q}</div><details class="idea answer"><summary>Prüfungsfähige Antwort</summary><div class="ideabody">${n.a}</div></details></div>`);
  const plain = t.plain ? renderList(t.plain,'',p=>`<div class="plainrow"><div class="pt">${p.t}</div><div class="pe">${p.e}</div></div>`) : '';
  const links = renderList(t.links,'',l=>{const lt=byId(l);return `<span class="linkchip" data-goto="${l}">${l} · ${lt.title.split(',')[0].split(' ').slice(0,3).join(' ')}…</span>`;});

  document.getElementById('content').innerHTML = `
   <div class="topic">
     <div class="thead">
       <div class="tnum">${t.id}</div>
       <h2>${t.title}</h2>
     </div>
     <div class="meta">
       <span class="tag chap">${t.chapter}</span>
       <span class="tag scope-${t.scope}">${scopeLabel}</span>
       ${t.school?'<span class="tag school">★ schulnah — häufiger dran</span>':''}
       ${t.subs.map(s=>`<span class="tag">${s}</span>`).join('')}
     </div>
     <button class="doneBtn ${done[t.id]?'on':''}" id="doneBtn">${done[t.id]?'✓ als sicher markiert':'als „sicher“ markieren'}</button>

     <div class="block"><h3>Überblick</h3><p class="lead">${t.overview}</p></div>

     ${t.sketch?`<div class="block"><h3>Leitskizze</h3><div class="sketch">${t.sketch.svg}<div class="cap">${t.sketch.cap}</div></div></div>`:''}

     ${defs?`<div class="block"><h3>Begriffe & Definitionen</h3>${defs}</div>`:''}
     ${plain?`<div class="block"><h3>In einfachen Worten</h3><div class="plainbox">${plain}</div></div>`:''}
     ${axioms?`<div class="block"><h3>Relevante Axiome</h3>${axioms}</div>`:''}
     ${sätze?`<div class="block"><h3>Zentrale Sätze &amp; Beweisideen</h3>${sätze}</div>`:''}

     <div class="block"><h3>Prüfungsfokus</h3>
       <div class="karte"><h4>So punktest du bei Dr. Koksch</h4>
       <ul>${t.focus.map(f=>`<li>${f}</li>`).join('')}</ul></div>
     </div>

     ${nachfr?`<div class="block"><h3>Mögliche Nachfragen</h3><div class="nachfr">${nachfr}</div></div>`:''}

     ${links?`<div class="block"><h3>Verwandte Themen</h3><div class="links">${links}</div></div>`:''}

     <div class="foot">
       ${prev?`<button class="navbtn prev" data-goto="${prev.id}"><span><span class="dir">◂ Thema ${prev.id}</span>${prev.title.split(',')[0]}</span></button>`:'<span></span>'}
       ${next?`<button class="navbtn next" data-goto="${next.id}"><span><span class="dir">Thema ${next.id} ▸</span>${next.title.split(',')[0]}</span></button>`:'<span></span>'}
     </div>
     <p class="hint">Tastatur: <kbd>←</kbd> / <kbd>→</kbd> blättern · <kbd>m</kbd> als sicher markieren</p>
   </div>`;

  document.getElementById('doneBtn').addEventListener('click',toggleDone);
  document.querySelectorAll('[data-goto]').forEach(el=>el.addEventListener('click',()=>show(+el.dataset.goto)));
  document.querySelector('main').scrollTo({top:0,behavior:'smooth'});
  window.scrollTo({top:0,behavior:'smooth'});
}

function toggleDone(){
  done[current]=!done[current]; save(); updateProgress();
  document.querySelectorAll('.navitem').forEach(n=>{
    const on=!!done[+n.dataset.id];
    n.classList.toggle('done',on);
    n.querySelector('.navcheck').textContent=on?'✓':'';
  });
  const b=document.getElementById('doneBtn');
  b.classList.toggle('on',!!done[current]);
  b.textContent=done[current]?'✓ als sicher markiert':'als „sicher“ markieren';
}

/* ===================== SUCHE ===================== */
document.getElementById('search').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  document.querySelectorAll('.navitem').forEach(n=>{
    n.classList.toggle('hidden', q && !n.dataset.search.includes(q));
  });
  document.querySelectorAll('.navgroup').forEach(g=>{
    let sib=g.nextElementSibling, any=false;
    while(sib && sib.classList.contains('navitem')){ if(!sib.classList.contains('hidden'))any=true; sib=sib.nextElementSibling;}
    g.style.display = q && !any ? 'none':'';
  });
});

/* ===================== RESET ===================== */
document.getElementById('progreset').addEventListener('click',()=>{
  if(confirm('Fortschritt für alle 24 Themen zurücksetzen?')){
    done={}; save(); updateProgress();
    document.querySelectorAll('.navitem').forEach(n=>{n.classList.remove('done');n.querySelector('.navcheck').textContent='';});
    show(current);
  }
});

/* ===================== TASTATUR ===================== */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight' && current<24)show(current+1);
  else if(e.key==='ArrowLeft' && current>1)show(current-1);
  else if(e.key==='m'||e.key==='M')toggleDone();
});

/* ===================== MOBILE MENÜ ===================== */
const sidebar=document.getElementById('sidebar'), scrim=document.getElementById('scrim');
function closeMenu(){sidebar.classList.remove('open');scrim.classList.remove('on');}
document.getElementById('menuBtn').addEventListener('click',()=>{sidebar.classList.toggle('open');scrim.classList.toggle('on');});
scrim.addEventListener('click',closeMenu);

/* ===================== INIT ===================== */
buildNav(); updateProgress(); show(1);
</script>
</body>
</html>
